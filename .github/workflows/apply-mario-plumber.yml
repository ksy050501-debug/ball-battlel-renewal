name: Apply plumber character patch

on:
  push:
    paths:
      - '.github/workflows/apply-mario-plumber.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_mario.py
      - name: Clean temporary files
        run: rm -f .github/apply_mario.py .github/workflows/apply-mario-plumber.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/apply_mario.py .github/workflows/apply-mario-plumber.yml
          git commit -m "Add plumber with question-block powerups"
          git push origin HEAD:main
