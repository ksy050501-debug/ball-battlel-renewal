name: Apply Koopa v155 balance patch

on:
  push:
    paths:
      - '.github/workflows/koopa-v155.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Koopa values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('<title>볼배틀 리뉴얼 v154</title>', '<title>볼배틀 리뉴얼 v155</title>'),
              ('<h1 id="mainTitle">볼배틀 리뉴얼 v154</h1>', '<h1 id="mainTitle">볼배틀 리뉴얼 v155</h1>'),
              ('{ id:"koopa_king", name:"쿱하", mark:"K", role:"게임", color:"#65a30d", hp:190, attack:0, speed:2.35, range:0,', '{ id:"koopa_king", name:"쿱하", mark:"K", role:"게임", color:"#65a30d", hp:220, attack:0, speed:2.35, range:0,'),
              ('shellDamage:14, shellKnock:720, shellFlight:.65, shellHitCd:.55, shellWallDamage:8, shellWallWindow:.72, recoveryStun:1,', 'shellDamage:13, shellKnock:720, shellFlight:.65, shellHitCd:.55, shellWallDamage:7, shellWallWindow:.72, recoveryStun:1,'),
              ('firePeriod:20, fireDuration:4.5, fireDamage:6, fireBurnDamage:1, fireBurnTicks:4, fireBurnTick:.6,', 'firePeriod:20, fireDuration:4.5, fireDamage:5, fireBurnDamage:1, fireBurnTicks:4, fireBurnTick:.6,'),
              ('damage: "등껍질 충돌 14 + 강넉백 · 넉백 후 벽충돌 8 / 회전 불기둥 접촉 6 + 화상 1×4",', 'damage: "등껍질 충돌 13 + 강넉백 · 넉백 후 벽충돌 7 / 회전 불기둥 접촉 5 + 화상 1×4",'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one match, got {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          patch_anchor = '      "v154: 쿱하 등껍질 가속곡선 조정.'
          if patch_anchor not in text:
              raise RuntimeError('v154 patch-note anchor not found')
          patch_note = '      "v155: 쿱하 고유 메커니즘 직접 밸런스 조정. HP 190→220. 등껍질 충돌 피해14→13, 넉백 후 벽충돌8→7, 회전 불기둥 접촉6→5. 화상1×4는 정수 최소 단위라 유지. 소수점 피해·전역 보정 없이 실제 능력 수치만 변경했으며 등껍질 주기·가속·추적·기절과 불기둥 주기·개수·지속시간은 유지.",\n'
          text = text.replace(patch_anchor, patch_note + patch_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/koopa-v155.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/koopa-v155.yml
          git commit -m "Balance Koopa unique mechanics v155"
          git push
