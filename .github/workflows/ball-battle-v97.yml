name: Ball Battle v97 Bald Cape
on:
  push:
    paths:
      - ".github/ball-battle-v97.py"
      - ".github/workflows/ball-battle-v97.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v97
        run: python .github/ball-battle-v97.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          if not scripts: raise SystemExit('no inline script')
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Verify v97
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          must=['<title>볼배틀 리뉴얼 v97</title>','id: "bald_cape"','function initBaldCape','bounceAccel:1.20','normalBounces:5','comboHits:6','seriousWindup:1.3','function drawBaldCapeCharacter','baldCapeWallBounce(f);','baldCapeContact(a, b);']
          missing=[x for x in must if x not in s]
          if missing: raise SystemExit('missing '+repr(missing))
          PY
      - name: Commit v97
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "v97: add Bald Cape fighter"
          git push
