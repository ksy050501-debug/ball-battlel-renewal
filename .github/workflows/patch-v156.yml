name: One-shot v156 patch

on:
  push:
    paths:
      - '.github/workflows/patch-v156.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing target: {label}')
              s = s.replace(old, new, 1)

          one('<title>볼배틀 리뉴얼 v155</title>', '<title>볼배틀 리뉴얼 v156</title>', 'title')

          s, n = re.subn(r'(\{ id:"koopa_king", name:"쿱하", mark:"K", role:"게임", color:"#65a30d", hp:)220', r'\g<1>190', s, count=1)
          if n != 1:
              raise SystemExit('koopa hp target not found')

          one('shellDamage:13, shellKnock:720, shellFlight:.65, shellHitCd:.55, shellWallDamage:7, shellWallWindow:.72, recoveryStun:1,\n      firePeriod:20, fireDuration:4.5, fireDamage:5, fireBurnDamage:1, fireBurnTicks:4, fireBurnTick:.6,',
              'shellDamage:14, shellKnock:720, shellFlight:.65, shellHitCd:.55, shellWallDamage:8, shellWallWindow:.72, recoveryStun:1,\n      firePeriod:20, fireDuration:4.5, fireDamage:6, fireBurnDamage:1, fireBurnTicks:4, fireBurnTick:.6,',
              'koopa v154 stats')

          one('      if(!fastSimMode){spawnHitFlash(target.x,target.y,"#bef264",58);spawnParticles(target.x,target.y,"#84cc16",10);}\n      koopaEndShell(source);\n      return dealt>0;',
              '      if(!fastSimMode){spawnHitFlash(target.x,target.y,"#bef264",58);spawnParticles(target.x,target.y,"#84cc16",10);}\n      return dealt>0;',
              'shell contact no longer ends shell')

          one('desc:"거대한 몸집의 마왕형 캐릭터. 등껍질 돌진은 시작부터 최근접 적을 계속 추적하며, 기본 이동속도의 0.35배로 매우 느리게 출발한 뒤 첫 2초 동안 1.3배까지 빠르게 가속하고 이후 4초 동안 최대 2.5배까지 가속한다. 상대와 충돌하면 즉시 돌진을 끝내고 제자리에서 1초 기절한다. 맵 중앙을 축으로 회전하는 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 불기둥은 같은 상대를 1회만 적중한다."',
              'desc:"거대한 몸집의 마왕형 캐릭터. 등껍질 돌진은 시작부터 최근접 적을 계속 추적하며, 기본 이동속도의 0.35배로 매우 느리게 출발한 뒤 첫 2초 동안 1.3배까지 빠르게 가속하고 이후 4초 동안 최대 2.5배까지 가속한다. 상대와 충돌해도 돌진은 끝나지 않고 6초 동안 계속되며, 같은 대상은 돌진 1회당 최대 1회만 피해를 받는다. 6초가 모두 끝난 뒤 제자리에서 1초 기절한다. 맵 중앙을 축으로 회전하는 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 불기둥은 같은 상대를 1회만 적중한다."',
              'koopa card description')

          one('damage: "등껍질 충돌 13 + 강넉백 · 넉백 후 벽충돌 7 / 회전 불기둥 접촉 5 + 화상 1×4",\n          tick: "등껍질 11초 주기·6초 지속·상시 추적·점진 가속·충돌 시 즉시 종료 후 1초 기절 / 불기둥 20초 주기·4.5초 지속",\n          tip: "등껍질은 돌진 1회 동안 같은 상대를 최대 1회만 타격하며 6초 내내 최근접 적을 추적한다. 시작은 기본 이동속도의 0.35배이며 첫 2초 동안 1.3배까지, 이후 4초 동안 최대 2.5배까지 가속하고, 충돌 후 1초 기절한다. 중앙 회전 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 기둥마다 같은 상대를 1회만 적중한다. 따라서 최대 3회 적중할 수 있다. 넉백 저항은 없다."',
              'damage: "등껍질 충돌 14 + 강넉백 · 넉백 후 벽충돌 8 / 회전 불기둥 접촉 6 + 화상 1×4",\n          tick: "등껍질 11초 주기·6초 지속·상시 추적·점진 가속·충돌해도 지속·6초 종료 후 1초 기절 / 불기둥 20초 주기·4.5초 지속",\n          tip: "등껍질은 충돌해도 종료되지 않고 6초 내내 최근접 적을 추적한다. 돌진 1회 동안 같은 상대는 최대 1회만 타격한다. 시작은 기본 이동속도의 0.35배이며 첫 2초 동안 1.3배까지, 이후 4초 동안 최대 2.5배까지 가속하고, 6초가 모두 끝난 뒤 1초 기절한다. 중앙 회전 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 기둥마다 같은 상대를 1회만 적중한다. 따라서 최대 3회 적중할 수 있다. 넉백 저항은 없다."',
              'koopa detail text')

          one('extraTextHtml:`<div class="status-skill-label">충돌 시 즉시 3초 기절 · 불기둥 ${fire?`${fireCount}개 발동 중`:`${Math.max(0,k.fireCd).toFixed(1)}초 후`}</div>`',
              'extraTextHtml:`<div class="status-skill-label">충돌해도 지속 · 종료 후 ${KOOPA.recoveryStun}초 기절 · 불기둥 ${fire?`${fireCount}개 발동 중`:`${Math.max(0,k.fireCd).toFixed(1)}초 후`}</div>`',
              'koopa status text')

          helper = '''    // 의도된 정지 상태가 아닌데 속도가 0으로 고착되면 공용으로 이동을 복구한다.\n    function ensureFreeVelocity(f) {\n      if (!f?.alive || Math.hypot(f.vx, f.vy) >= 0.5) return;\n      if ((f.stun || 0) > 0 || (f.hardFreeze || 0) > 0 || (f.bindStun || 0) > 0\n          || (f.joltStop || 0) > 0 || (f.vampSuppressed || 0) > 0\n          || (f.punchHold || 0) > 0 || (f.punchFlight || 0) > 0 || isCasting(f)\n          || f.mario?.pipeTransit || f.marioBlock\n          || (f.iron?.dash || 0) > 0 || (f.duelMonster?.channel || 0) > 0\n          || (f.duelMonster?.cast || 0) > 0 || f.duelMonster?.fusing\n          || (f.toriMeteorWalk || 0) > 0 || (f.rioStormRush || 0) > 0\n          || f.baldCape?.dash > 0 || f.baldCape?.serious?.timer > 0 || f.baldCape?.combo\n          || f.koopa?.shellActive || f.hinta?.dash || f.logo?.jump) return;\n      const v = randomVelocity(f.baseSpeed || f.speed || 2.35);\n      f.vx = v.vx; f.vy = v.vy;\n    }\n\n'''
          one('    function useSkill(f, label) {', helper + '    function useSkill(f, label) {', 'insert anti-stuck helper')

          one('      if (f.stun > 0) return;\n      if (updateCastPause(f, dt)) {',
              '      if (f.stun > 0) return;\n      ensureFreeVelocity(f);\n      if (updateCastPause(f, dt)) {',
              'call anti-stuck before later early returns')

          patch = '      "v156: 쿱하를 v154 수치 기반으로 복원(HP220→190, 등껍질13→14, 벽충돌7→8, 불기둥5→6). 등껍질은 적·소환수와 충돌해도 즉시 종료되지 않고 6초를 끝까지 유지하며 같은 대상은 돌진 1회당 최대 1회만 피해를 받고, 6초 종료 후 1초 기절한다. 불기둥 66%/33% 단계와 나머지 가속·추적 구조는 유지. 별도 버그 수정으로 모든 캐릭터가 의도된 정지 상태가 아닌데 속도0에 고착되면 기본 이동속도로 공용 복구하도록 안전장치를 추가.",\n'
          one('      const patchNotes = [\n', '      const patchNotes = [\n' + patch, 'patch note')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v156.yml
          git commit -m "Restore Koopa v154 base and improve shell flow v156"
          git push
