name: v118 Conan character patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v118-conan.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          c=p.read_text(encoding='utf-8')

          def rep(old,new,count=1):
              global c
              n=c.count(old)
              if n!=count:
                  raise SystemExit(f'expected {count}, found {n}: {old[:160]!r}')
              c=c.replace(old,new,count)

          rep('<title>볼배틀 리뉴얼 v117</title>','<title>볼배틀 리뉴얼 v118</title>')
          rep('<h1 id="mainTitle">볼배틀 리뉴얼 v117</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v118</h1>')

          # Add Conan to the playable roster before the training dummy.
          anchor='''      { id: "logo_doctor", name: "로고 박사", mark: "博", role: "영화", color: "#94a3b8", hp: 120, attack: 0, speed: 2.55, range: 0,\n        skillName: "잠든 분노 · 헐크크", condition: "박사 0HP → 헐크크 · 분노 소진 → 스마트 헐크크", desc: "박사는 직접 공격하지 않지만 쓰러지면 헐크크로 변신한다. 분노가 소진되면 스마트 헐크크로 다시 변해 전투를 이어간다." },\n      { id: "dummy_unit",'''
          insert='''      { id: "logo_doctor", name: "로고 박사", mark: "博", role: "영화", color: "#94a3b8", hp: 120, attack: 0, speed: 2.55, range: 0,\n        skillName: "잠든 분노 · 헐크크", condition: "박사 0HP → 헐크크 · 분노 소진 → 스마트 헐크크", desc: "박사는 직접 공격하지 않지만 쓰러지면 헐크크로 변신한다. 분노가 소진되면 스마트 헐크크로 다시 변해 전투를 이어간다." },\n      { id: "conan", name: "코난", mark: "🔍", role: "애니", color: "#2563eb", hp: 165, attack: 0, speed: 2.8, range: 130,\n        skillName: "사신 · 범인의 습격", condition: "반경130 안 초당 사신+3 · 직접 접촉+10 · 사신100 → 사건 발생", desc: "코난 근처에 오래 머문 적에게 사신이 누적된다. 사신이 가득 차면 정체불명의 범인이 나타나 큰 피해를 주는 습격을 벌인다." },\n      { id: "dummy_unit",'''
          rep(anchor,insert)

          # Core Conan mechanic and drawing. Insert immediately before Elsa's constants.
          marker='''    const ELSA = {\n'''
          conan='''    const CONAN = {\n      radius:130, maxMeter:100, auraPerSec:3, contactGain:10, contactCd:1.0,\n      assaultWindup:.9, assaultDamage:80, resetMeter:40, knock:560\n    };\n    function initConan(f){\n      f.conan={targets:new Map(),assaults:[],pulse:0};\n    }\n    function conanTargetState(source,target){\n      const cc=source?.conan;if(!cc||!target)return null;\n      let s=cc.targets.get(target.id);\n      if(!s){s={meter:0,contactCd:0,pending:false};cc.targets.set(target.id,s);}\n      return s;\n    }\n    function conanAssaultOrigin(target){\n      const pad=22,side=Math.floor(Math.random()*4);\n      if(side===0)return {x:arena.x+pad,y:clamp(target.y,arena.y+pad,arena.y2-pad)};\n      if(side===1)return {x:arena.x2-pad,y:clamp(target.y,arena.y+pad,arena.y2-pad)};\n      if(side===2)return {x:clamp(target.x,arena.x+pad,arena.x2-pad),y:arena.y+pad};\n      return {x:clamp(target.x,arena.x+pad,arena.x2-pad),y:arena.y2-pad};\n    }\n    function triggerConanAssault(source,target,state){\n      if(!source?.alive||!source.conan||!target?.alive||!state||state.pending)return false;\n      state.meter=CONAN.maxMeter;state.pending=true;\n      const o=conanAssaultOrigin(target);\n      source.conan.assaults.push({targetId:target.id,t:CONAN.assaultWindup,total:CONAN.assaultWindup,x:o.x,y:o.y});\n      if(!fastSimMode){\n        spawnFloatingText(target.x,target.y-target.r-44,"사건 발생!","#fca5a5");\n        spawnBlast(target.x,target.y,58,"#7f1d1d");\n        playSound("warning",1.0);\n      }\n      return true;\n    }\n    function conanContact(source,target){\n      if(!source?.alive||!source.conan||!target?.alive||!areEnemies(source,target))return;\n      const s=conanTargetState(source,target);\n      if(!s||s.pending||s.contactCd>0)return;\n      s.contactCd=CONAN.contactCd;\n      s.meter=Math.min(CONAN.maxMeter,s.meter+CONAN.contactGain);\n      if(!fastSimMode)spawnFloatingText(target.x,target.y-target.r-32,"사신 +"+CONAN.contactGain,"#f87171");\n      if(s.meter>=CONAN.maxMeter)triggerConanAssault(source,target,s);\n    }\n    function updateConan(f,dt){\n      const cc=f?.conan;if(!cc||!f.alive)return;\n      cc.pulse=(cc.pulse+dt)%1;\n      for(const s of cc.targets.values())s.contactCd=Math.max(0,(s.contactCd||0)-dt);\n      for(const target of fighters){\n        if(!target?.alive||target.id===f.id||!areEnemies(f,target))continue;\n        const s=conanTargetState(f,target);\n        if(!s||s.pending)continue;\n        if(Math.hypot(target.x-f.x,target.y-f.y)<=CONAN.radius+target.r){\n          s.meter=Math.min(CONAN.maxMeter,s.meter+CONAN.auraPerSec*dt);\n          if(s.meter>=CONAN.maxMeter)triggerConanAssault(f,target,s);\n        }\n      }\n      for(let i=cc.assaults.length-1;i>=0;i--){\n        const a=cc.assaults[i],target=fighters.find(x=>x.id===a.targetId),s=target?cc.targets.get(target.id):null;\n        if(!target?.alive){if(s){s.pending=false;s.meter=CONAN.resetMeter;}cc.assaults.splice(i,1);continue;}\n        a.t-=dt;\n        if(a.t>0)continue;\n        const dx=target.x-a.x,dy=target.y-a.y,d=Math.hypot(dx,dy)||1;\n        const dealt=damage(target,CONAN.assaultDamage,f,"범인의 습격");\n        if(target.alive&&dealt>0){target.vx=dx/d*CONAN.knock;target.vy=dy/d*CONAN.knock;}\n        if(s){s.pending=false;s.meter=CONAN.resetMeter;}\n        if(!fastSimMode){\n          spawnHitFlash(target.x,target.y,"#111827",130);spawnBlast(target.x,target.y,105,"#7f1d1d");\n          spawnParticles(target.x,target.y,"#111827",30);\n          spawnFloatingText(target.x,target.y-target.r-45,"범인의 습격! -"+Math.round(dealt),"#fecaca");\n          triggerHitStop(.24);screenShake=Math.max(screenShake,.85);playSound("explosion",1.45);\n        }\n        cc.assaults.splice(i,1);\n      }\n    }\n    function conanMeterForTarget(target){\n      let best=0;\n      for(const source of fighters){\n        if(!source?.alive||!source.conan||source.id===target.id||!areEnemies(source,target))continue;\n        const s=source.conan.targets.get(target.id);if(s)best=Math.max(best,s.meter||0);\n      }\n      return best;\n    }\n    function drawConanCharacter(f){\n      const cc=f.conan||{targets:new Map(),assaults:[],pulse:0};\n      if(!f.portraitOnly&&!fastSimMode){\n        ctx.save();ctx.beginPath();ctx.rect(arena.x,arena.y,arena.size,arena.size);ctx.clip();\n        ctx.globalAlpha=.13+.04*Math.sin(battleTime*2.5);ctx.strokeStyle="#94a3b8";ctx.lineWidth=1.5;ctx.setLineDash([6,8]);\n        ctx.beginPath();ctx.arc(f.x,f.y,CONAN.radius,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();\n        for(const a of cc.assaults){\n          const target=fighters.find(x=>x.id===a.targetId);if(!target?.alive)continue;\n          const p=clamp(1-a.t/a.total,0,1),ease=p*p*(3-2*p);\n          const px=a.x+(target.x-a.x)*ease,py=a.y+(target.y-a.y)*ease;\n          ctx.save();ctx.globalAlpha=.35+.6*p;ctx.translate(px,py);\n          const ang=Math.atan2(target.y-py,target.x-px);ctx.rotate(ang);\n          ctx.fillStyle="#020617";ctx.strokeStyle="#7f1d1d";ctx.lineWidth=2;\n          ctx.beginPath();ctx.arc(0,-8,8,0,Math.PI*2);ctx.fill();ctx.stroke();\n          ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.lineTo(9,17);ctx.lineTo(-9,17);ctx.closePath();ctx.fill();\n          ctx.strokeStyle="#e5e7eb";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(6,4);ctx.lineTo(18,0);ctx.stroke();\n          ctx.restore();\n        }\n      }\n      ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.r/20,f.r/20);\n      ctx.fillStyle="#1f2937";ctx.beginPath();ctx.arc(0,-5,18,0,Math.PI*2);ctx.fill();\n      ctx.fillStyle="#f3c7a5";ctx.beginPath();ctx.ellipse(0,-2,13,15,0,0,Math.PI*2);ctx.fill();\n      ctx.fillStyle="#111827";ctx.beginPath();ctx.moveTo(-14,-9);ctx.lineTo(-9,-19);ctx.lineTo(-3,-14);ctx.lineTo(2,-21);ctx.lineTo(7,-14);ctx.lineTo(14,-17);ctx.lineTo(12,-6);ctx.quadraticCurveTo(0,-14,-14,-9);ctx.fill();\n      ctx.strokeStyle="#111827";ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(-6,-2,5,0,Math.PI*2);ctx.arc(6,-2,5,0,Math.PI*2);ctx.moveTo(-1,-2);ctx.lineTo(1,-2);ctx.stroke();\n      ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(-6,-2,1.4,0,Math.PI*2);ctx.arc(6,-2,1.4,0,Math.PI*2);ctx.fill();\n      ctx.fillStyle="#2563eb";ctx.beginPath();ctx.moveTo(-15,11);ctx.lineTo(-9,5);ctx.lineTo(9,5);ctx.lineTo(15,11);ctx.lineTo(12,22);ctx.lineTo(-12,22);ctx.closePath();ctx.fill();\n      ctx.fillStyle="#f8fafc";ctx.beginPath();ctx.moveTo(-7,6);ctx.lineTo(0,15);ctx.lineTo(7,6);ctx.closePath();ctx.fill();\n      ctx.fillStyle="#dc2626";ctx.beginPath();ctx.moveTo(-5,10);ctx.lineTo(0,7);ctx.lineTo(5,10);ctx.lineTo(0,14);ctx.closePath();ctx.fill();\n      ctx.restore();drawHealthBar(f);drawName(f);\n    }\n\n'''
          rep(marker,conan+marker)

          # Initialize Conan in portrait preview and in actual fighters.
          rep('''        if (c.id === "elsa") initElsa(preview);\n        if (c.id === "bald_cape") initBaldCape(preview);''','''        if (c.id === "elsa") initElsa(preview);\n        if (c.id === "conan") initConan(preview);\n        if (c.id === "bald_cape") initBaldCape(preview);''')
          rep('''      if (c.id === "elsa") initElsa(fighter);\n      if (c.id === "bald_cape") initBaldCape(fighter);''','''      if (c.id === "elsa") initElsa(fighter);\n      if (c.id === "conan") initConan(fighter);\n      if (c.id === "bald_cape") initBaldCape(fighter);''')

          # Update mechanic each frame.
          rep('''      if (f.elsa) updateElsa(f, dt);\n      if (!f.alive) return;''','''      if (f.elsa) updateElsa(f, dt);\n      if (f.conan) updateConan(f, dt);\n      if (!f.alive) return;''')

          # Direct contact adds death-flag meter independently of proximity gain.
          rep('''              elsaContact(a, b);\n              elsaContact(b, a);\n              hulkContact(a, b);''','''              elsaContact(a, b);\n              elsaContact(b, a);\n              conanContact(a, b);\n              conanContact(b, a);\n              hulkContact(a, b);''')

          # Character renderer dispatch.
          rep('''      if (f.elsa) { drawElsaCharacter(f); return; }\n      if (f.baldCape) { drawBaldCapeCharacter(f); return; }''','''      if (f.elsa) { drawElsaCharacter(f); return; }\n      if (f.conan) { drawConanCharacter(f); return; }\n      if (f.baldCape) { drawBaldCapeCharacter(f); return; }''')

          # Show the largest Conan death-flag meter affecting each target near its HP bar.
          rep('''      if (f.jabami?.debt > 0) {''','''      const conanMeter=conanMeterForTarget(f);\n      if(conanMeter>0){\n        ctx.save();ctx.font="900 10px system-ui";ctx.textAlign="right";ctx.textBaseline="middle";\n        ctx.strokeStyle="rgba(2,6,23,.9)";ctx.lineWidth=3;ctx.fillStyle="#f87171";\n        const label="☠ "+Math.floor(conanMeter)+"/"+CONAN.maxMeter;\n        ctx.strokeText(label,x+w,y+h+10);ctx.fillText(label,x+w,y+h+10);ctx.restore();\n      }\n\n      if (f.jabami?.debt > 0) {''')

          # Status panel for Conan.
          rep('''    function skillProgressInfo(f) {\n      if(f.elsa){''','''    function skillProgressInfo(f) {\n      if(f.conan){\n        let top=0,name="";for(const [id,s] of f.conan.targets){if((s.meter||0)>top){top=s.meter||0;const t=fighters.find(x=>x.id===id);name=t?.name||"";}}\n        const pending=f.conan.assaults.length>0;\n        return {ratio:clamp(top/CONAN.maxMeter,0,1),className:pending?"rage-fill":"skill-fill",\n          text:pending?"사건 발생 · 범인의 습격!":("사신 "+Math.floor(top)+"/"+CONAN.maxMeter+(name?" · "+name:"")),\n          extraTextHtml:'<div class="status-skill-label">반경130 안 초당 사신+3 · 범위 밖에서도 누적 유지</div><div class="status-skill-label">직접 접촉 +10(대상별1초) · 100에서 0.9초 예고 후 범인의 습격80 · 사건 후40</div>'};}\n      if(f.elsa){''')

          # Encyclopedia / ? details.
          rep('''      if (c.id === "elsa") return {damage:"냉기 영역 초당6 / 빙결 중 냉기 영역9 / 빙결 상태 직접 접촉 파쇄30",''','''      if (c.id === "conan") return {damage:"범인의 습격80 + 강한 넉백",tick:"반경130 안 초당 사신+3 · 직접 접촉 대상별1초마다+10 · 사신100에서 사건 발생 · 습격 예고0.9초 · 사건 후 사신40",tip:"코난은 직접 공격하지 않는다. 적이 반경130 안에 머무는 동안 사신 수치가 초당3씩 누적되며 범위를 벗어나도 감소하지 않는다. 직접 부딪히면 별도로 사신10이 오른다. 사신100이 되면 정체불명의 검은 범인이 경기장 가장자리에서 나타나 대상을 습격해 피해80과 강한 넉백을 준다. 사건이 끝나면 해당 대상의 사신은40으로 내려가 다시 누적된다."};\n      if (c.id === "elsa") return {damage:"냉기 영역 초당6 / 빙결 중 냉기 영역9 / 빙결 상태 직접 접촉 파쇄30",''')

          # Patch note.
          pm='''      const patchNotes = [\n'''
          pn='''      "v118: 애니 캐릭터 '코난' 추가. HP165·이속2.8·직접 공격 없음. 반경130 안의 적은 사신이 초당3씩 누적되고 범위를 벗어나도 감소하지 않으며, 코난과 직접 접촉하면 대상별1초 쿨로 사신+10. 사신100에서 '사건 발생' 후 0.9초 예고와 함께 검은 범인이 가장자리에서 접근해 범인의 습격 피해80·강한 넉백을 가한다. 사건 종료 후 해당 대상 사신은40으로 감소해 다시 누적. 대상별 사신 수치 UI, 범인 실루엣 접근 연출, 코난 전용 상태창·도감·초상화를 추가했습니다.",\n'''
          rep(pm,pm+pn)

          p.write_text(c,encoding='utf-8')
          PY

      - name: Validate v118
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=fs.readFileSync('index.html','utf8');
          const scripts=[...c.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          if(!scripts.length)throw new Error('No inline scripts');
          for(const s of scripts)new Function(s);
          const req=[
            '볼배틀 리뉴얼 v118','id: "conan"','const CONAN = {','radius:130','maxMeter:100',
            'auraPerSec:3','contactGain:10','assaultDamage:80','resetMeter:40','function updateConan',
            'conanContact(a, b)','drawConanCharacter','if(f.conan)','v118: 애니 캐릭터'
          ];
          for(const x of req)if(!c.includes(x))throw new Error('Missing '+x);
          console.log('v118 validation passed');
          NODE

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v118: add Conan death-flag assault character'
          git push origin HEAD:main
