name: Apply v228 anti-stuck and Steve steering

on:
  push:
    paths:
      - '.github/workflows/v228-antistuck-steve-steer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch v228
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,label):
              global s
              c=s.count(old)
              if c!=1:
                  raise SystemExit(f'{label}: expected 1 marker, found {c}')
              s=s.replace(old,new,1)

          rep('<title>볼배틀 리뉴얼 v227</title>','<title>볼배틀 리뉴얼 v228</title>','document title')
          rep('<h1 id="mainTitle">볼배틀 리뉴얼 v227</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v228</h1>','display title')

          rep('''      pickupBonus:24, resourceRadius:14, resourceSpawnDelay:1,
      attackPeriod:1.05, attackBonuses:[4,6,7,8,10,12],''',
              '''      pickupBonus:24, resourceRadius:14, resourceSpawnDelay:1,
      resourceSteerFirst:12, resourceSteerRepeat:10,
      attackPeriod:1.05, attackBonuses:[4,6,7,8,10,12],''','Steve constants')

          rep('''      s.resource={type:t.resource,x:rand(arena.x+r+18,arena.x2-r-18),y:rand(arena.y+r+18,arena.y2-r-18),r,age:0,progress:0};s.mining=false;s.mineAnim=0;''',
              '''      s.resource={type:t.resource,x:rand(arena.x+r+18,arena.x2-r-18),y:rand(arena.y+r+18,arena.y2-r-18),r,age:0,progress:0,nextSteer:STEVE.resourceSteerFirst,inside:false};s.mining=false;s.mineAnim=0;''','Steve resource spawn')

          rep('''          r.age+=dt;const pickup=f.r+r.r+STEVE.pickupBonus,inRange=Math.hypot(f.x-r.x,f.y-r.y)<=pickup;
          if(inRange){''',
              '''          r.age+=dt;const pickup=f.r+r.r+STEVE.pickupBonus,inRange=Math.hypot(f.x-r.x,f.y-r.y)<=pickup;
          const entering=inRange&&!r.inside;r.inside=inRange;
          if(entering){r.age=0;r.nextSteer=STEVE.resourceSteerFirst;}
          if(!inRange&&r.age>=(r.nextSteer??STEVE.resourceSteerFirst)&&!steveBlocked(f)){
            const dx=r.x-f.x,dy=r.y-f.y,d=Math.hypot(dx,dy)||1,speed=(s.baseSpeed||f.baseSpeed||f.speed||2.6)*44;
            f.vx=dx/d*speed;f.vy=dy/d*speed;
            r.nextSteer=(r.nextSteer??STEVE.resourceSteerFirst)+STEVE.resourceSteerRepeat;
          }
          if(inRange){''','Steve steering')

          rep('''      if (options.preserveExistingStrongerKnockback && target.punchFlight > 0 &&
          Math.hypot(target.vx, target.vy) > Math.hypot(vx, vy)) return false;
      if (options.additive) { target.vx += vx; target.vy += vy; }''',
              '''      if (options.preserveExistingStrongerKnockback && target.punchFlight > 0 &&
          Math.hypot(target.vx, target.vy) > Math.hypot(vx, vy)) return false;
      // 공통 넉백이 고유 좌표이동을 덮을 때 점프 상태가 매달려 영구 정지하는 것을 방지한다.
      if(target?.logo?.jump){target.logo.jump=null;target.logo.airHeight=0;target.logo.fistTime=0;}
      if (options.additive) { target.vx += vx; target.vy += vy; }''','Hulk jump knockback cleanup')

          anti='''    const ANTI_STUCK = { duration:2, epsilon:.08 };
    function antiStuckBlocked(f){
      return !f?.alive||f.isSummon||!!f.marioBlock||!!f.kirbySwallowedBy
        ||isStunned(f)||(f.hardFreeze||0)>0||(f.bindStun||0)>0||(f.punchHold||0)>0||(f.punchFlight||0)>0
        ||(f.vampSuppressed||0)>0||(f.joltStop||0)>0||isCasting(f)
        ||!!f.steve?.mining||(f.steve?.nether||0)>0||!!f.logo?.jump
        ||(f.newhello?.windup||0)>0||(f.newhello?.dash||0)>0||!!f.hinta?.dash
        ||(f.wok&&battleTime<(f.wok.dashUntil||0))||!!f.tracer?.sequence
        ||(f.iron?.dash||0)>0||(f.duelMonster?.channel||0)>0||(f.duelMonster?.cast||0)>0||!!f.duelMonster?.fusing
        ||(f.toriMeteorWalk||0)>0||(f.rioStormRush||0)>0||f.baldCape?.dash>0||f.baldCape?.serious?.timer>0||!!f.baldCape?.combo
        ||!!f.koopa?.shellActive||f.baseId==="wind_rio"||(f.tano?.hidden||0)>0||(f.dodoVoid||0)>0
        ||(f.riddle?.horcruxTimer||0)>0||!!f.mario?.pipeTransit;
    }
    function updateAntiStuck(f,dt){
      if(!f?.alive)return;
      const a=f._antiStuck||(f._antiStuck={x:f.x,y:f.y,still:0});
      const moved=Math.hypot(f.x-a.x,f.y-a.y);
      a.x=f.x;a.y=f.y;
      if(antiStuckBlocked(f)){a.still=0;return;}
      if(moved>ANTI_STUCK.epsilon){a.still=0;return;}
      a.still+=dt;
      if(a.still<ANTI_STUCK.duration)return;
      const v=randomVelocity(f.baseSpeed||f.speed||2.35);
      f.vx=v.vx;f.vy=v.vy;a.still=0;
    }

'''
          marker='''    // 충돌 방향은 유지하되 각 개체의 기본 속력으로 부드럽게 복귀한다.
    function recoverOwnMoveSpeed(f, dt) {'''
          rep(marker,anti+marker,'anti-stuck helper insertion')

          rep('''        handleCircleCollisions(sub);
        fighters.forEach(f => { if(f.wok)wokProximityBite(f); });''',
              '''        handleCircleCollisions(sub);
        fighters.forEach(f => updateAntiStuck(f, sub));
        fighters.forEach(f => { if(f.wok)wokProximityBite(f); });''','anti-stuck update call')

          rep('''const patchNotes = [
      "v227: 스티브 자원 크기 확대.''',
              '''const patchNotes = [
      "v228: 공통 이동 고착 복구 및 스티브 장기 미획득 방향 보정. 헐크크 점프 중 넉백 시 점프 상태를 정상 종료해 위치 고정 버그를 막고, 기절·빙결·속박·시전·채굴·네더·고유 이동 등 의도된 정지를 제외한 상태에서 2초간 좌표 변화가 거의 없으면 기본 속도로 이동을 복구한다. 스티브는 자원을 12초간 못 얻은 경우 현재 이동방향을 자원 쪽으로 한 번만 돌리며, 이후에도 못 얻으면 10초 간격으로 한 번씩만 재보정한다. 속도 증가·지속 추적·강제 이동은 없고 벽 반사나 상대 충돌로 바뀐 방향을 그대로 따른다.",
      "v227: 스티브 자원 크기 확대.''','patch notes')

          oldtip='''tip:"다이아 장비부터 남은 인챈트 중 한 권이 랜덤 위치에 등장한다. 날카로움 IV는 검 피해+3, 넉백 IV는 검 적중 시 추가 넉백, 수선 IV는 실제 피해를 준 검 적중 시 체력3 회복(내부 쿨1.5초). 획득 인챈트는 중복되지 않으며 네더 진입과 네더라이트 전환 뒤에도 모두 유지된다. 기존 채굴·장비별 피해감소·네더 귀환 체력30 감소 구조는 유지한다."};'''
          newtip='''tip:"자원을 12초 동안 습득하지 못하면 이동속도는 그대로 둔 채 현재 이동방향만 자원 쪽으로 한 번 보정한다. 그래도 못 얻으면 10초마다 한 번씩 다시 방향만 보정하며 지속 추적이나 강제 이동은 하지 않는다. 다이아 장비부터 남은 인챈트 중 한 권이 랜덤 위치에 등장한다. 날카로움 IV는 검 피해+3, 넉백 IV는 검 적중 시 추가 넉백, 수선 IV는 실제 피해를 준 검 적중 시 체력3 회복(내부 쿨1.5초). 획득 인챈트는 중복되지 않으며 네더 진입과 네더라이트 전환 뒤에도 모두 유지된다. 기존 채굴·장비별 피해감소·네더 귀환 체력30 감소 구조는 유지한다."};'''
          rep(oldtip,newtip,'Steve tooltip')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax and marker checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            ('v228 title','<title>볼배틀 리뉴얼 v228</title>'),
            ('v228 header','<h1 id="mainTitle">볼배틀 리뉴얼 v228</h1>'),
            ('anti stuck','function updateAntiStuck(f,dt)'),
            ('Steve steer first','resourceSteerFirst:12'),
            ('Steve steer repeat','resourceSteerRepeat:10'),
            ('Hulk cleanup','if(target?.logo?.jump)'),
          ]
          for name,mark in checks:
              if mark not in s: raise SystemExit(f'missing {name}')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('script block missing')
          Path('/tmp/game.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/game.js

      - name: Commit v228
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v228: add anti-stuck recovery and Steve steering'
          git push
