name: v124 spider swing fix

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate patch
        run: python .github/scripts/v124_patch.py
      - name: Commit patch
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add index.html && git diff --cached --quiet && exit 1 || (git commit -m "fix: stabilize Geominam web swing v124" && git push)
