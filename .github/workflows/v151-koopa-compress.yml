name: Apply v151 Koopa matchup compression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v151-koopa-compress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          assert '<title>볼배틀 리뉴얼 v150</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v150</h1>' in s
          s=s.replace('<title>볼배틀 리뉴얼 v150</title>','<title>볼배틀 리뉴얼 v151</title>',1)
          s=s.replace('<h1 id="mainTitle">볼배틀 리뉴얼 v150</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v151</h1>',1)

          marker='      const patchNotes = [\n'
          assert marker in s
          note='      "v151: 쿱하 상성 폭 압축 실험. HP 190 유지. 등껍질 충돌 후 자가 기절 3초→1초. 등껍질은 6초 내내 최근접 적을 추적하며, 시작 속도는 평상 이동속도 수준에서 시작해 기존 최대 돌진속도까지 점진 가속. 회전 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개로 변경해 최대 3개. 피해량·주기·지속시간은 유지.",\n'
          s=s.replace(marker,marker+note,1)

          old_const='''    const KOOPA = {
      bodyR:25, shellPeriod:11, shellDuration:6, shellTrackAt:3, shellSpeedMult:1.9, shellTurn:5.0,
      shellDamage:14, shellKnock:720, shellFlight:.65, shellHitCd:.55, shellWallDamage:8, shellWallWindow:.72, recoveryStun:3,
      firePeriod:20, fireDuration:4.5, fireDamage:6, fireBurnDamage:1, fireBurnTicks:4, fireBurnTick:.6,
      fireHitCd:.55, fireTurn:Math.PI*105/180, fireWidth:12
    };'''
          new_const='''    const KOOPA = {
      bodyR:25, shellPeriod:11, shellDuration:6, shellSpeedMult:1.9, shellTurn:5.0,
      shellDamage:14, shellKnock:720, shellFlight:.65, shellHitCd:.55, shellWallDamage:8, shellWallWindow:.72, recoveryStun:1,
      firePeriod:20, fireDuration:4.5, fireDamage:6, fireBurnDamage:1, fireBurnTicks:4, fireBurnTick:.6,
      fireHitCd:.55, fireTurn:Math.PI*105/180, fireWidth:12
    };'''
          assert old_const in s
          s=s.replace(old_const,new_const,1)

          old_count='    function koopaFireCount(f){const q=f.maxHp>0?f.hp/f.maxHp:1;return q>.75?1:q>.50?2:q>.25?3:4;}'
          new_count='    function koopaFireCount(f){const q=f.maxHp>0?f.hp/f.maxHp:1;return q>2/3?1:q>1/3?2:3;}'
          assert old_count in s
          s=s.replace(old_count,new_count,1)

          old_start='''      const mag=Math.hypot(f.vx,f.vy)||1,a=mag>.01?Math.atan2(f.vy,f.vx):rand(0,Math.PI*2),v=k.baseSpeed*44*KOOPA.shellSpeedMult;
      f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;'''
          new_start='''      const mag=Math.hypot(f.vx,f.vy)||1,a=mag>.01?Math.atan2(f.vy,f.vx):rand(0,Math.PI*2),v=k.baseSpeed*44;
      f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;'''
          assert old_start in s
          s=s.replace(old_start,new_start,1)

          old_end='''      k.shellActive=false;k.shellTime=0;k.recovery=KOOPA.recoveryStun;f.vx=0;f.vy=0;applyStun(f,KOOPA.recoveryStun);
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-34,"기절 3초","#fde68a");spawnBlast(f.x,f.y,48,"#84cc16");}
    }
    function koopaNormalizeShellSpeed(f){
      const k=f.koopa,v=k.baseSpeed*44*KOOPA.shellSpeedMult,mag=Math.hypot(f.vx,f.vy)||1,a=mag>.01?Math.atan2(f.vy,f.vx):rand(0,Math.PI*2);
      f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;
    }
    function koopaTrackShell(f,dt){
      const k=f.koopa,target=nearestEnemy(f).enemy;if(!target){koopaNormalizeShellSpeed(f);return;}
      const wanted=Math.atan2(target.y-f.y,target.x-f.x),cur=Math.atan2(f.vy,f.vx),delta=Math.atan2(Math.sin(wanted-cur),Math.cos(wanted-cur));
      const a=cur+clamp(delta,-KOOPA.shellTurn*dt,KOOPA.shellTurn*dt),v=k.baseSpeed*44*KOOPA.shellSpeedMult;
      f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;
    }'''
          new_end='''      k.shellActive=false;k.shellTime=0;k.recovery=KOOPA.recoveryStun;f.vx=0;f.vy=0;applyStun(f,KOOPA.recoveryStun);
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-34,`기절 ${KOOPA.recoveryStun}초`,"#fde68a");spawnBlast(f.x,f.y,48,"#84cc16");}
    }
    function koopaShellSpeed(f){
      const k=f.koopa,p=clamp(1-(k.shellTime/KOOPA.shellDuration),0,1);
      return k.baseSpeed*44*(1+(KOOPA.shellSpeedMult-1)*p);
    }
    function koopaTrackShell(f,dt){
      const k=f.koopa,target=nearestEnemy(f).enemy,v=koopaShellSpeed(f),mag=Math.hypot(f.vx,f.vy)||1,cur=mag>.01?Math.atan2(f.vy,f.vx):rand(0,Math.PI*2);
      if(!target){f.vx=Math.cos(cur)*v;f.vy=Math.sin(cur)*v;return;}
      const wanted=Math.atan2(target.y-f.y,target.x-f.x),delta=Math.atan2(Math.sin(wanted-cur),Math.cos(wanted-cur));
      const a=cur+clamp(delta,-KOOPA.shellTurn*dt,KOOPA.shellTurn*dt);
      f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;
    }'''
          assert old_end in s
          s=s.replace(old_end,new_end,1)

          old_update='if(k.shellActive){k.shellTime=Math.max(0,k.shellTime-dt);if(k.shellTime<=0){koopaEndShell(f);return;}if(k.shellTime<=KOOPA.shellTrackAt)koopaTrackShell(f,dt);else koopaNormalizeShellSpeed(f);}'
          new_update='if(k.shellActive){k.shellTime=Math.max(0,k.shellTime-dt);if(k.shellTime<=0){koopaEndShell(f);return;}koopaTrackShell(f,dt);}'
          assert old_update in s
          s=s.replace(old_update,new_update,1)

          old_char='''      { id:"koopa_king", name:"쿱하", mark:"K", role:"게임", color:"#65a30d", hp:190, attack:0, speed:2.35, range:0,
        skillName:"등껍질 돌진 · 회전 불기둥", condition:"등껍질 11초 주기 · 불기둥 20초 주기 · 저체력일수록 불기둥 1→4개", desc:"거대한 몸집의 마왕형 캐릭터. 등껍질 돌진으로 적을 강하게 날리고 벽충돌 피해를 만들며, 마지막 3초에는 상대를 추적한다. 상대와 충돌하면 즉시 돌진을 끝내고 제자리에서 3초 기절한다. 맵 중앙을 축으로 회전하는 불기둥은 체력이 낮을수록 늘어나며, 각 불기둥은 같은 상대를 1회만 적중한다." },'''
          new_char='''      { id:"koopa_king", name:"쿱하", mark:"K", role:"게임", color:"#65a30d", hp:190, attack:0, speed:2.35, range:0,
        skillName:"등껍질 돌진 · 회전 불기둥", condition:"등껍질 11초 주기 · 불기둥 20초 주기 · 저체력일수록 불기둥 1→3개", desc:"거대한 몸집의 마왕형 캐릭터. 등껍질 돌진은 시작부터 최근접 적을 계속 추적하며, 평상 이동속도 수준에서 출발해 점점 빨라져 기존 최대 돌진속도에 도달한다. 상대와 충돌하면 즉시 돌진을 끝내고 제자리에서 1초 기절한다. 맵 중앙을 축으로 회전하는 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 불기둥은 같은 상대를 1회만 적중한다." },'''
          assert old_char in s
          s=s.replace(old_char,new_char,1)

          old_tick='tick: "등껍질 11초 주기·6초 지속·충돌 시 즉시 종료 후 3초 기절 / 불기둥 20초 주기·4.5초 지속",'
          new_tick='tick: "등껍질 11초 주기·6초 지속·상시 추적·점진 가속·충돌 시 즉시 종료 후 1초 기절 / 불기둥 20초 주기·4.5초 지속",'
          assert old_tick in s
          s=s.replace(old_tick,new_tick,1)

          old_tip='tip: "등껍질은 돌진 1회 동안 같은 상대를 최대 1회만 타격하며, 마지막 3초 동안 적을 추적한다. 충돌 후 3초 기절은 유지된다. 중앙 회전 불기둥은 HP 75% 초과 1개, 50~75% 2개, 25~50% 3개, 25% 이하 4개이며 각 기둥마다 같은 상대를 1회만 적중한다. 따라서 4개일 때 같은 상대에게 최대 4회 적중할 수 있다. 넉백 저항은 없다."'
          new_tip='tip: "등껍질은 돌진 1회 동안 같은 상대를 최대 1회만 타격하며 6초 내내 최근접 적을 추적한다. 시작은 평상 이동속도 수준이고 시간이 지날수록 기존 최대 돌진속도까지 가속하며, 충돌 후 1초 기절한다. 중앙 회전 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 기둥마다 같은 상대를 1회만 적중한다. 따라서 최대 3회 적중할 수 있다. 넉백 저항은 없다."'
          assert old_tip in s
          s=s.replace(old_tip,new_tip,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v151</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v151</h1>' in s
          assert 'recoveryStun:1' in s
          assert 'return q>2/3?1:q>1/3?2:3;' in s
          assert 'function koopaShellSpeed(f)' in s
          assert 'koopaTrackShell(f,dt);' in s
          assert 'shellTrackAt' not in s
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          assert scripts
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
          git diff --check

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v151-koopa-compress.yml
          git add index.html .github/workflows/v151-koopa-compress.yml
          git commit -m 'v151: compress Koopa matchup extremes'
          git push
