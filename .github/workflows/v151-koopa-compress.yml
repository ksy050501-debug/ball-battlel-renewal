name: v151 Koopa matchup compression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v151-koopa-compress.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        run: |
          echo '' | base64 -d > /tmp/patch_v151.py
          python3 /tmp/patch_v151.py
          node --check /tmp/check.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v151-koopa-compress.yml
          git add index.html .github/workflows/v151-koopa-compress.yml
          git commit -m 'v151: compress Koopa matchup extremes'
          git push
