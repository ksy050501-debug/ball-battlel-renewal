name: One-shot v157 patch
on:
  push:
    paths:
      - '.github/workflows/patch-v157.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def one(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing target: {label}')
              s=s.replace(old,new,1)

          one('<title>볼배틀 리뉴얼 v156</title>','<title>볼배틀 리뉴얼 v157</title>','title')

          old='''    function koopaTrackShell(f,dt){
      const k=f.koopa,target=nearestEnemy(f).enemy,v=koopaShellSpeed(f),mag=Math.hypot(f.vx,f.vy)||1,cur=mag>.01?Math.atan2(f.vy,f.vx):rand(0,Math.PI*2);
      if(!target){f.vx=Math.cos(cur)*v;f.vy=Math.sin(cur)*v;return;}
      const wanted=Math.atan2(target.y-f.y,target.x-f.x),delta=Math.atan2(Math.sin(wanted-cur),Math.cos(wanted-cur));
      const a=cur+clamp(delta,-KOOPA.shellTurn*dt,KOOPA.shellTurn*dt);
      f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;
    }'''
          new='''    function koopaTrackShell(f,dt){
      const k=f.koopa,v=koopaShellSpeed(f),mag=Math.hypot(f.vx,f.vy)||1,cur=mag>.01?Math.atan2(f.vy,f.vx):rand(0,Math.PI*2);
      const target=enemiesOf(f).filter(e=>e.alive&&!(k.hitCd[e.id]>0)).sort((a,b)=>dist(f,a)-dist(f,b))[0]||null;
      if(!target){f.vx=Math.cos(cur)*v;f.vy=Math.sin(cur)*v;return;}
      const wanted=Math.atan2(target.y-f.y,target.x-f.x),delta=Math.atan2(Math.sin(wanted-cur),Math.cos(wanted-cur));
      const a=cur+clamp(delta,-KOOPA.shellTurn*dt,KOOPA.shellTurn*dt);
      f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;
    }'''
          one(old,new,'koopa unhit target tracking')

          one('''desc:"거대한 몸집의 마왕형 캐릭터. 등껍질 돌진은 시작부터 최근접 적을 계속 추적하며, 기본 이동속도의 0.35배로 매우 느리게 출발한 뒤 첫 2초 동안 1.3배까지 빠르게 가속하고 이후 4초 동안 최대 2.5배까지 가속한다. 상대와 충돌해도 돌진은 끝나지 않고 6초 동안 계속되며, 같은 대상은 돌진 1회당 최대 1회만 피해를 받는다. 6초가 모두 끝난 뒤 제자리에서 1초 기절한다. 맵 중앙을 축으로 회전하는 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 불기둥은 같은 상대를 1회만 적중한다."''',
              '''desc:"거대한 몸집의 마왕형 캐릭터. 등껍질 돌진은 이번 돌진에서 아직 맞히지 않은 최근접 적을 추적하며, 기본 이동속도의 0.35배로 매우 느리게 출발한 뒤 첫 2초 동안 1.3배까지 빠르게 가속하고 이후 4초 동안 최대 2.5배까지 가속한다. 상대와 충돌해도 돌진은 끝나지 않고 6초 동안 계속되며, 같은 대상은 돌진 1회당 최대 1회만 피해를 받는다. 더 이상 맞히지 않은 적이 없으면 현재 진행방향으로 남은 돌진을 이어간다. 6초가 모두 끝난 뒤 제자리에서 1초 기절한다. 맵 중앙을 축으로 회전하는 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 불기둥은 같은 상대를 1회만 적중한다."''','koopa description')

          one('''tip: "등껍질은 충돌해도 종료되지 않고 6초 내내 최근접 적을 추적한다. 돌진 1회 동안 같은 상대는 최대 1회만 타격한다. 시작은 기본 이동속도의 0.35배이며 첫 2초 동안 1.3배까지, 이후 4초 동안 최대 2.5배까지 가속하고, 6초가 모두 끝난 뒤 1초 기절한다. 중앙 회전 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 기둥마다 같은 상대를 1회만 적중한다. 따라서 최대 3회 적중할 수 있다. 넉백 저항은 없다."''',
              '''tip: "등껍질은 충돌해도 종료되지 않고 6초 동안 이번 돌진에서 아직 맞히지 않은 최근접 적을 우선 추적한다. 이미 맞힌 대상은 남은 돌진 동안 추적 후보에서 제외되며, 더 이상 맞히지 않은 적이 없으면 현재 진행방향으로 움직인다. 돌진 1회 동안 같은 상대는 최대 1회만 타격한다. 시작은 기본 이동속도의 0.35배이며 첫 2초 동안 1.3배까지, 이후 4초 동안 최대 2.5배까지 가속하고, 6초가 모두 끝난 뒤 1초 기절한다. 중앙 회전 불기둥은 HP 66% 초과 1개, 33~66% 2개, 33% 이하 3개이며 각 기둥마다 같은 상대를 1회만 적중한다. 따라서 최대 3회 적중할 수 있다. 넉백 저항은 없다."''','koopa detail tip')

          note='      "v157: 쿱하 등껍질의 6초 완주 구조는 유지하되, 이번 돌진에서 이미 적중한 대상은 남은 돌진 동안 추적 후보에서 제외. 아직 맞히지 않은 적·소환수가 있으면 그중 최근접 대상을 추적하고, 모두 한 번씩 맞힌 뒤에는 현재 진행방향으로 남은 시간을 이동한다. 같은 대상 1회 제한·v154 기반 수치·6초 종료 후 1초 기절·불기둥 구조는 유지.",\n'
          one('      const patchNotes = [\n','      const patchNotes = [\n'+note,'patch note')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v157.yml
          git commit -m "Exclude hit targets from Koopa shell tracking v157"
          git push
