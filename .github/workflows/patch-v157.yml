name: One-shot v157 patch
on:
  push:
    paths:
      - '.github/workflows/patch-v157.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(f'missing target: {label}')
              s=s.replace(old,new,1)
          rep('<title>볼배틀 리뉴얼 v156</title>','<title>볼배틀 리뉴얼 v157</title>','title')
          old='const k=f.koopa,target=nearestEnemy(f).enemy,v=koopaShellSpeed(f),mag=Math.hypot(f.vx,f.vy)||1,cur=mag>.01?Math.atan2(f.vy,f.vx):rand(0,Math.PI*2);'
          new='const k=f.koopa,v=koopaShellSpeed(f),mag=Math.hypot(f.vx,f.vy)||1,cur=mag>.01?Math.atan2(f.vy,f.vx):rand(0,Math.PI*2);\n      const target=enemiesOf(f).filter(e=>e.alive&&!(k.hitCd[e.id]>0)).sort((a,b)=>dist(f,a)-dist(f,b))[0]||null;'
          rep(old,new,'koopa target selection')
          rep('등껍질 돌진은 시작부터 최근접 적을 계속 추적하며','등껍질 돌진은 이번 돌진에서 아직 맞히지 않은 최근접 적을 추적하며','description target wording')
          rep('등껍질은 충돌해도 종료되지 않고 6초 내내 최근접 적을 추적한다.','등껍질은 충돌해도 종료되지 않고 6초 동안 이번 돌진에서 아직 맞히지 않은 최근접 적을 우선 추적한다. 이미 맞힌 대상은 남은 돌진 동안 추적 후보에서 제외되며, 더 이상 맞히지 않은 적이 없으면 현재 진행방향으로 움직인다.','detail target wording')
          note='      "v157: 쿱하 등껍질의 6초 완주 구조는 유지하되, 이번 돌진에서 이미 적중한 대상은 남은 돌진 동안 추적 후보에서 제외. 아직 맞히지 않은 적·소환수가 있으면 그중 최근접 대상을 추적하고, 모두 한 번씩 맞힌 뒤에는 현재 진행방향으로 남은 시간을 이동한다. 같은 대상 1회 제한·v154 기반 수치·6초 종료 후 1초 기절·불기둥 구조는 유지.",\n'
          rep('      const patchNotes = [\n','      const patchNotes = [\n'+note,'patch note')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v157.yml
          git commit -m "Exclude hit targets from Koopa shell tracking v157"
          git push
