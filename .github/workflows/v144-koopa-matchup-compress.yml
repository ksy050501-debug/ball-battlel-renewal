name: Apply v144 Koopa matchup compression

on:
  push:
    paths:
      - '.github/workflows/v144-koopa-matchup-compress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/v144_koopa_matchup_compress.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.find('<script>')
          end=s.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('script block not found')
          Path('/tmp/ballbattle-v144.js').write_text(s[start+8:end], encoding='utf-8')
          PY
          node --check /tmp/ballbattle-v144.js
          git diff --check

      - name: Verify intended markers
        run: |
          grep -q '볼배틀 리뉴얼 v144' index.html
          grep -q 'firePeriod:20' index.html
          grep -q 'hitOnce:{}' index.html
          grep -q 'const key=`${i}:${e.id}`' index.html
          ! grep -q 'target.koopa?.recovery > 0) amount \*= 2' index.html
          grep -q 'koopaEndShell(source);' index.html

      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/scripts/v144_koopa_matchup_compress.py .github/workflows/v144-koopa-matchup-compress.yml
          git commit -m 'v144: compress Koopa matchup extremes'
          git push origin main
