name: v152 Koopa runtime fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v152-koopa-runtime-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch runtime bug
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v151</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v151</h1>' in s
          old='target.koopaWallCrash={sourceId:source.id,t:KOOPA.shellWallWindow};koopaNormalizeShellSpeed(source);}'
          new='target.koopaWallCrash={sourceId:source.id,t:KOOPA.shellWallWindow};}'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          s=s.replace('<title>볼배틀 리뉴얼 v151</title>','<title>볼배틀 리뉴얼 v152</title>',1)
          s=s.replace('<h1 id="mainTitle">볼배틀 리뉴얼 v151</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v152</h1>',1)
          marker='      const patchNotes = [\n'
          assert marker in s
          note='      "v152: v151 쿱하 등껍질 상시추적 변경 후 남아 있던 삭제 함수 호출을 제거해 등껍질 충돌 시 전투 루프가 멈추는 런타임 버그 수정. 전투 수치 변경 없음.",\n'
          s=s.replace(marker,marker+note,1)
          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          assert scripts
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'koopaNormalizeShellSpeed(' not in s
          assert 'function koopaShellSpeed(f)' in s
          assert 'recoveryStun:1' in s
          assert 'return q>2/3?1:q>1/3?2:3;' in s
          PY
          node --check /tmp/check.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v152-koopa-runtime-fix.yml
          git add index.html .github/workflows/v152-koopa-runtime-fix.yml
          git commit -m 'v152: fix Koopa shell runtime crash'
          git push
