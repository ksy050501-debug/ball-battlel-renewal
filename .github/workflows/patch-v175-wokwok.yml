name: One-shot v175 WokWok character
on:
  push:
    paths:
      - '.github/workflows/patch-v175-wokwok.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n < count:
                  raise SystemExit(f'anchor missing: {old[:120]!r} count={n}')
              s=s.replace(old,new,count)

          rep('<title>볼배틀 리뉴얼 v174</title>','<title>볼배틀 리뉴얼 v175</title>')

          old='''      { id: "dummy_unit", name: "훈련용 더미", mark: "木", role: "더미", color: "#9ca3af", hp: 500, attack: 0, speed: 2.35, range: 0, simOnly: true,
        skillName: "공격 없음", condition: "이동만 함 / 무한 부활", desc: "HP 500. 피해를 받고 사망하면 체력 500으로 부활." }'''
          new='''      { id:"wok_wok", name:"웍웍", mark:"獣", role:"게임", color:"#7f1d1d", hp:120, attack:0, speed:2.15, range:0,
        skillName:"짐승의 이빨 · 피 냄새 · 직선 돌진", condition:"깨물기 충전 · 전방120도 피 냄새 가속 · 9초마다 진행방향 돌진", desc:"워윅을 모티브로 한 저체력 추격형 캐릭터. 깨물기가 충전되면 다음 직접 접촉에서 피해와 흡혈을 주며, 자신의 체력이 낮을수록 충전이 빨라진다. 진행방향 전방120도 안에서 가장 체력 비율이 낮은 적의 피 냄새가 진할수록 이동속도가 상승한다. 9초마다 현재 이동속도에 비례해 진행방향으로 직선 돌진하며 적중 시 짧게 스킬을 봉쇄하고 3회 공격·흡혈한다." },
      { id: "dummy_unit", name: "훈련용 더미", mark: "木", role: "더미", color: "#9ca3af", hp: 500, attack: 0, speed: 2.35, range: 0, simOnly: true,
        skillName: "공격 없음", condition: "이동만 함 / 무한 부활", desc: "HP 500. 피해를 받고 사망하면 체력 500으로 부활." }'''
          rep(old,new)

          anchor='''    let coyoteTrails = [];'''
          wok_code=r'''    const WOK = {
      bitePeriodMax:7, bitePeriodMin:3, biteDamage:14, biteHeal:8,
      scentRange:420, scentHalfAngle:Math.PI/3, scentMaxMult:2.0, scentFloorHp:0.05,
      dashPeriod:9, dashDuration:.62, dashSpeedMult:2.35,
      maulHits:3, maulDamage:6, maulHeal:4, maulInterval:.22, maulSkillLock:.9
    };
    let wokBiteFx=[];
    function initWok(f){
      f.wok={biteCharge:0,dashCd:WOK.dashPeriod,dash:0,dashDx:1,dashDy:0,scentMult:1,scentHp:1,maul:null,dirX:1,dirY:0};
    }
    function wokBlocked(f){return !f?.alive||f.stun>0||f.punchHold>0||f.punchFlight>0||f.vampSuppressed>0||f.joltStop>0||isCasting(f);}
    function wokBitePeriod(f){const q=clamp(f.hp/Math.max(1,f.maxHp),0,1);return WOK.bitePeriodMin+(WOK.bitePeriodMax-WOK.bitePeriodMin)*q;}
    function wokFacing(f){
      const w=f.wok,mag=Math.hypot(f.vx||0,f.vy||0);
      if(mag>.5){w.dirX=f.vx/mag;w.dirY=f.vy/mag;}
      return {x:w.dirX||1,y:w.dirY||0};
    }
    function wokScent(f){
      const w=f.wok,dir=wokFacing(f);let bestHp=1,best=null;
      enemiesOf(f).forEach(e=>{
        if(!e.alive||e.isSummon||e.duelMonster||e.marioBlock)return;
        const dx=e.x-f.x,dy=e.y-f.y,d=Math.hypot(dx,dy);
        if(d<=0||d>WOK.scentRange)return;
        const dot=clamp((dx*dir.x+dy*dir.y)/d,-1,1),ang=Math.acos(dot);
        if(ang>WOK.scentHalfAngle)return;
        const hp=clamp(e.hp/Math.max(1,e.maxHp),0,1);
        if(hp<bestHp){bestHp=hp;best=e;}
      });
      const t=best?clamp((1-bestHp)/(1-WOK.scentFloorHp),0,1):0;
      w.scentHp=best?bestHp:1;w.scentMult=1+(WOK.scentMaxMult-1)*t;
      return w.scentMult;
    }
    function wokSpawnBiteFx(x,y,angle,strong=false){
      if(fastSimMode)return;
      wokBiteFx.push({x,y,angle,life:.38,max:.38,strong});
      spawnParticles(x,y,strong?'#fca5a5':'#fecaca',strong?9:6);
    }
    function startWokDash(f){
      const w=f.wok;if(!w||w.dash>0||w.maul||wokBlocked(f))return false;
      const dir=wokFacing(f),normal=f.baseSpeed*44*wokScent(f),v=normal*WOK.dashSpeedMult;
      w.dash=WOK.dashDuration;w.dashCd=WOK.dashPeriod;w.dashDx=dir.x;w.dashDy=dir.y;
      f.vx=dir.x*v;f.vy=dir.y*v;
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-34,"피의 돌진!","#ef4444");spawnBlast(f.x,f.y,46,"#7f1d1d");}
      return true;
    }
    function updateWok(f,dt){
      const w=f.wok;if(!w)return;
      w.biteCharge=clamp(w.biteCharge+dt/Math.max(.1,wokBitePeriod(f)),0,1);
      w.dashCd=Math.max(0,w.dashCd-dt);
      if(w.maul){
        const m=w.maul,target=fighterById(m.targetId);
        if(!target?.alive){w.maul=null;}
        else{
          m.next-=dt;
          while(m.next<=0&&m.hitsLeft>0&&target.alive){
            const dealt=damage(target,WOK.maulDamage,f,"웍웍 난폭한 포식");
            if(dealt>0){heal(f,WOK.maulHeal);wokSpawnBiteFx(target.x,target.y,Math.atan2(target.y-f.y,target.x-f.x),true);}
            m.hitsLeft--;m.next+=WOK.maulInterval;
          }
          if(m.hitsLeft<=0)w.maul=null;
        }
      }
      if(w.dash>0){
        w.dash=Math.max(0,w.dash-dt);
        const normal=f.baseSpeed*44*wokScent(f),v=normal*WOK.dashSpeedMult;
        f.vx=w.dashDx*v;f.vy=w.dashDy*v;
        if(w.dash<=0){f.vx=w.dashDx*normal;f.vy=w.dashDy*normal;}
        return;
      }
      const mult=wokScent(f);
      if(!wokBlocked(f)){
        const dir=wokFacing(f),v=f.baseSpeed*44*mult;f.vx=dir.x*v;f.vy=dir.y*v;
        if(w.dashCd<=0)startWokDash(f);
      }
    }
    function wokContact(f,target){
      const w=f?.wok;if(!w||!f.alive||!target?.alive||!areEnemies(f,target)||target.isSummon||target.duelMonster||target.marioBlock)return false;
      if(w.maul)return false;
      if(w.dash>0){
        w.dash=0;w.maul={targetId:target.id,hitsLeft:WOK.maulHits,next:0};
        target.wokSkillLock=Math.max(target.wokSkillLock||0,WOK.maulSkillLock);
        applyStun(target,WOK.maulSkillLock);
        if(!fastSimMode){spawnFloatingText(target.x,target.y-target.r-28,"포식!","#f87171");spawnBlast(target.x,target.y,58,"#991b1b");}
        return true;
      }
      if(w.biteCharge<1)return false;
      const dealt=damage(target,WOK.biteDamage,f,"웍웍 깨물기");
      if(dealt>0){
        w.biteCharge=0;heal(f,WOK.biteHeal);wokSpawnBiteFx(target.x,target.y,Math.atan2(target.y-f.y,target.x-f.x));
        if(!fastSimMode)spawnFloatingText(target.x,target.y-target.r-24,"깨물기!","#fecaca");
        return true;
      }
      return false;
    }
    function drawWokEffects(){
      if(fastSimMode)return;
      wokBiteFx=wokBiteFx.filter(o=>o.life>0);
      wokBiteFx.forEach(o=>{o.life-=1/60;const p=clamp(o.life/o.max,0,1),open=(1-p)*10+(o.strong?5:0);ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);ctx.globalAlpha=p;ctx.strokeStyle=o.strong?'#fecaca':'#fca5a5';ctx.fillStyle='#fff7ed';ctx.lineWidth=o.strong?3:2;ctx.shadowColor='#ef4444';ctx.shadowBlur=o.strong?14:8;
        [-1,1].forEach(side=>{ctx.save();ctx.scale(1,side);ctx.beginPath();ctx.arc(0,0,22+open,-Math.PI*.88,-Math.PI*.12);ctx.stroke();for(let i=-2;i<=2;i++){const a=-Math.PI*.75+(i+2)*Math.PI*.13,r=20+open,x=Math.cos(a)*r,y=Math.sin(a)*r;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*7,y+Math.sin(a)*7);ctx.lineTo(x+Math.cos(a+.12)*2,y+Math.sin(a+.12)*2);ctx.closePath();ctx.fill();}ctx.restore();});ctx.restore();});
    }
    function drawWokCharacter(f){
      const w=f.wok||{};ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.r/20,f.r/20);
      ctx.fillStyle='#3f3f46';ctx.strokeStyle='#18181b';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,3,16,17,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#27272a';ctx.beginPath();ctx.moveTo(-13,-9);ctx.lineTo(-18,-23);ctx.lineTo(-5,-14);ctx.moveTo(13,-9);ctx.lineTo(18,-23);ctx.lineTo(5,-14);ctx.fill();
      ctx.fillStyle='#7f1d1d';ctx.beginPath();ctx.ellipse(0,-4,12,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fef2f2';ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-3,9);ctx.lineTo(0,1);ctx.moveTo(8,0);ctx.lineTo(3,9);ctx.lineTo(0,1);ctx.fill();
      ctx.fillStyle='#fb7185';ctx.shadowColor='#ef4444';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(-5,-7,2,0,Math.PI*2);ctx.arc(5,-7,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      if((w.biteCharge||0)>=1){ctx.strokeStyle='#fca5a5';ctx.lineWidth=2;ctx.globalAlpha=.65+.25*Math.sin(battleTime*10);ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.stroke();}
      ctx.restore();
    }
'''
          rep(anchor,wok_code+anchor)

          rep('''        if (c.id === "coyote_d") initCoyote(preview);''','''        if (c.id === "coyote_d") initCoyote(preview);
        if (c.id === "wok_wok") initWok(preview);''')
          rep('''      if (c.id === "coyote_d") initCoyote(fighter);''','''      if (c.id === "coyote_d") initCoyote(fighter);
      if (c.id === "wok_wok") initWok(fighter);''')
          rep('''      updateCoyote(f, dt);''','''      updateCoyote(f, dt);
      updateWok(f, dt);''')
          rep('''      recoverOwnMoveSpeed(f, dt);''','''      if(!f.wok) recoverOwnMoveSpeed(f, dt);''')
          rep('''              coyoteContact(a, b);
              coyoteContact(b, a);''','''              coyoteContact(a, b);
              coyoteContact(b, a);
              wokContact(a, b);
              wokContact(b, a);''')
          rep('''      drawCoyoteTrails();''','''      drawCoyoteTrails();
      drawWokEffects();''')
          rep('''      if (f.coyote) { drawCoyoteCharacter(f); return; }''','''      if (f.coyote) { drawCoyoteCharacter(f); return; }
      if (f.wok) { drawWokCharacter(f); return; }''')

          rep('''      f.stun = Math.max(0, (f.stun || 0) - dt);''','''      f.stun = Math.max(0, (f.stun || 0) - dt);
      f.wokSkillLock = Math.max(0, (f.wokSkillLock || 0) - dt);''')
          rep('''    function checkSkill(f, dt) {
      if (!f.alive || f.isSummon) return;''','''    function checkSkill(f, dt) {
      if (!f.alive || f.isSummon || (f.wokSkillLock||0)>0) return;''')

          status_anchor='''      if(f.coyote){'''
          status='''      if(f.wok){
        const w=f.wok,bite=clamp(w.biteCharge||0,0,1),dash=clamp(1-(w.dashCd||0)/WOK.dashPeriod,0,1),scent=(w.scentMult||1).toFixed(2),hp=Math.round((w.scentHp||1)*100);
        return {ratio:bite,className:bite>=1?"rage-fill":"skill-fill",text:bite>=1?"깨물기 준비 완료":"깨물기 충전 "+Math.round(bite*100)+"%",extraBarsHtml:`<div class="bar" title="직선 돌진"><div class="bar-fill shield-fill" style="width:${dash*100}%"></div></div>`,extraTextHtml:`<div class="status-skill-label">피 냄새 이속 ×${scent} · 전방 최저 HP ${hp}% · 최대 ×${WOK.scentMaxMult.toFixed(1)}</div><div class="status-skill-label">돌진 ${w.dash>0?"진행 중":Math.max(0,w.dashCd||0).toFixed(1)+"초"} · 적중 시 ${WOK.maulHits}회 공격/흡혈 · 스킬 봉쇄 ${WOK.maulSkillLock.toFixed(1)}초</div>`};
      }
'''
          rep(status_anchor,status+status_anchor)

          damage_anchor='''      if(c.id==="newhello_sergeant")return'''
          damage='''      if(c.id==="wok_wok")return {damage:`깨물기 ${WOK.biteDamage} + HP${WOK.biteHeal} 회복 / 돌진 적중 후 ${WOK.maulDamage}×${WOK.maulHits} + 타격당 HP${WOK.maulHeal} 회복`,tick:`깨물기 충전 ${WOK.bitePeriodMax}초→최저 ${WOK.bitePeriodMin}초 · 돌진 ${WOK.dashPeriod}초 · 포식 ${WOK.maulInterval}초 간격 ${WOK.maulHits}회`,tip:`기본 HP120·이속2.15. 깨물기 충전은 웍웍 자신의 HP가 낮을수록 빨라진다. 진행방향 전방120도·반경${WOK.scentRange} 안의 적 중 HP 비율이 가장 낮은 한 명만 피 냄새 기준으로 사용하며, 적 HP100%에서는 가속이 없고 5% 이하에서는 최대 이속×${WOK.scentMaxMult.toFixed(1)}. 돌진은 적을 추적하지 않고 발동 순간 진행방향으로 직선 이동하며 현재 피 냄새 이동속도에 비례한다. 첫 적 본체 접촉 시 돌진이 끝나고 ${WOK.maulSkillLock}초 동안 스킬을 봉쇄하며 3회 공격·흡혈한다.`};
'''
          rep(damage_anchor,damage+damage_anchor)

          rep('''      const patchNotes = [
      "v174:''','''      const patchNotes = [
      "v175: 신캐 웍웍 추가. HP120·기본이속2.15. 깨물기는 기본 7초 충전이며 자신의 체력이 낮을수록 최저 3초까지 빨라지고, 준비 후 적 본체와 접촉하면 피해14·HP8 회복. 진행방향 전방120도·반경420 안에서 HP 비율이 가장 낮은 적 하나의 체력에 따라 이속이 ×1.0~2.0으로 연속 증가한다. 9초마다 현재 피 냄새 이동속도에 비례해 진행방향으로 0.62초 직선 돌진하며 추적·조준 보정은 없다. 돌진 중 적 본체 접촉 시 0.9초 스킬 봉쇄와 함께 피해6·HP4 회복을 0.22초 간격으로 3회 적용한다. 깨물기에는 짐승 이빨 이펙트를 추가.",
      "v174:''')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax smoke check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          if a<0 or b<a: raise SystemExit('script block not found')
          Path('/tmp/game.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit v175 and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-v175-wokwok.yml
          git add index.html
          git commit -m 'Add WokWok blood hunt fighter v175'
          git push
