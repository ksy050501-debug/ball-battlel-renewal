name: One-shot v160 anti-stuck patch
on:
  push:
    paths:
      - '.github/workflows/patch-v160.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def one(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing target: {label}')
              s=s.replace(old,new,1)

          one('<title>볼배틀 리뉴얼 v154</title>','<title>볼배틀 리뉴얼 v160</title>','title')
          one('<h1 id="mainTitle">볼배틀 리뉴얼 v154</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v160</h1>','main title')

          helper='''    // 의도된 정지 상태가 아닌데 속도가 0으로 고착되면 공용으로 이동을 복구한다.\n    function ensureFreeVelocity(f) {\n      if (!f?.alive || Math.hypot(f.vx, f.vy) >= 0.5) return;\n      if ((f.stun || 0) > 0 || (f.hardFreeze || 0) > 0 || (f.bindStun || 0) > 0\n          || (f.joltStop || 0) > 0 || (f.vampSuppressed || 0) > 0\n          || (f.punchHold || 0) > 0 || (f.punchFlight || 0) > 0 || isCasting(f)\n          || f.mario?.pipeTransit || f.marioBlock\n          || (f.iron?.dash || 0) > 0 || (f.duelMonster?.channel || 0) > 0\n          || (f.duelMonster?.cast || 0) > 0 || f.duelMonster?.fusing\n          || (f.toriMeteorWalk || 0) > 0 || (f.rioStormRush || 0) > 0\n          || f.baldCape?.dash > 0 || f.baldCape?.serious?.timer > 0 || f.baldCape?.combo\n          || f.koopa?.shellActive || f.hinta?.dash || f.logo?.jump) return;\n      const v = randomVelocity(f.baseSpeed || f.speed || 2.35);\n      f.vx = v.vx; f.vy = v.vy;\n    }\n\n'''
          one('    function useSkill(f, label) {', helper + '    function useSkill(f, label) {', 'anti-stuck helper')
          one('      if (f.stun > 0) return;\n      if (updateCastPause(f, dt)) {',
              '      if (f.stun > 0) return;\n      ensureFreeVelocity(f);\n      if (updateCastPause(f, dt)) {',
              'anti-stuck call')

          note='      "v160: 캡틴전에서 확인된 비의도적 이동속도 0 고착 버그 대응. 모든 캐릭터가 기절·빙결·속박·시전·강제이동 등 의도된 정지 상태가 아닌데 속도0에 고착되면 기본 이동속도로 자동 복구하는 공용 안전장치를 추가. v154의 쿱하 포함 모든 전투 수치와 능력 구조는 유지.",\n'
          one('      const patchNotes = [\n','      const patchNotes = [\n'+note,'patch note')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v160.yml
          git commit -m "Fix zero-velocity stuck states v160"
          git push
