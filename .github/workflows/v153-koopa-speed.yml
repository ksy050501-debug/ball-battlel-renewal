name: v153 Koopa speed curve
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v153-koopa-speed.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        shell: bash
        run: |
          echo '  ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check /tmp/check.js
          git diff --check
          grep -q 'shellStartMult:.35, shellSpeedMult:2.5' index.html
          grep -q '볼배틀 리뉴얼 v153' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v153-koopa-speed.yml
          git add index.html .github/workflows/v153-koopa-speed.yml
          git commit -m 'v153: adjust Koopa shell acceleration'
          git push
