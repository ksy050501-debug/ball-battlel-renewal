name: Ball Battle v94 Jabami Justice fixes
on:
  push:
    paths:
      - ".github/ball-battle-v94.py"
      - ".github/workflows/ball-battle-v94.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v94 fixes
        run: python .github/ball-battle-v94.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          if not scripts: raise SystemExit('no inline script')
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Verify v94 anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            '<title>볼배틀 리뉴얼 v94</title>',
            '<h1 id="mainTitle">볼배틀 리뉴얼 v94</h1>',
            'mode==="tie"',
            'drawJabamiDebtChanceBadge',
            'justiceSummonBattleStats',
            '소환수 피해',
            'screenShake,1.8',
            'd.speechTime=5.8'
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          PY
      - name: Commit v94
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "v94: fix Jabami tie debt and Justice summon stats"
          git push
