name: v154 Koopa acceleration curve
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v154-koopa-curve.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check /tmp/check.js
          git diff --check
          grep -q 'shellMidMult:1.3, shellMidTime:2' index.html
          grep -q '볼배틀 리뉴얼 v154' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v154-koopa-curve.yml
          git add index.html .github/workflows/v154-koopa-curve.yml
          git commit -m 'v154: tune Koopa acceleration curve'
          git push
