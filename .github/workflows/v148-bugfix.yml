name: Apply v148 bugfix
on:
  push:
    paths:
      - '.github/workflows/v148-bugfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        run: |
          echo '' | base64 -d > /tmp/patch_v148.py
          python3 /tmp/patch_v148.py
      - name: Validate patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '볼배틀 리뉴얼 v148' in s
          assert 'function tickTanoTimeClock(f, dt)' in s
          assert 'if(battleMode==="team")return true;' in s
          assert 'fighters.filter(f=>!f.alive).forEach(clearDefeatedFighterStatusStacks);' in s
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          assert scripts
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
          git diff --check
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v148-bugfix.yml
          git add index.html .github/workflows/v148-bugfix.yml
          git commit -m 'v148: fix Tano timer, death stacks, and Andrum team rhythm'
          git push