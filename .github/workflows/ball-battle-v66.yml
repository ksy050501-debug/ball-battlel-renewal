name: Ball Battle v66 Riddle Lord

on:
  push:
    paths:
      - '.github/ball-battle-v66.py'
      - '.github/workflows/ball-battle-v66.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v66 Riddle Lord
        run: python .github/ball-battle-v66.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/ball-battle-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/ball-battle-inline.js
      - name: Commit v66
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'v66 add Riddle Lord'
          git push
