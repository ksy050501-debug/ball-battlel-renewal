name: v153 Koopa acceleration curve
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v153-koopa-curve.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and validate
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert 'v152' in s
          s=re.sub(r'(<title>[^<]*?)v152(</title>)', r'\1v153\2', s, count=1)
          s=re.sub(r'(<h1 id="mainTitle">[^<]*?)v152(</h1>)', r'\1v153\2', s, count=1)

          note="v153: \ucff1\ud558 \ub4f1\uaecd\uc9c8 \uac00\uc18d\uac10 \uc870\uc815. \uc0c1\uc2dc \ucd94\uc801\xb76\ucd08 \uc9c0\uc18d\xb7\ucda9\ub3cc \ud6c4 1\ucd08 \uae30\uc808\uc740 \uc720\uc9c0\ud558\uace0, \ub3cc\uc9c4 \uc2dc\uc791 \uc18d\ub3c4\ub97c \uae30\ubcf8 \uc774\ub3d9\uc18d\ub3c4\uc758 0.35\ubc30\ub85c \ud06c\uac8c \ub0ae\ucd98 \ub4a4 6\ucd08 \ub3d9\uc548 \uc810\uc9c4 \uac00\uc18d\ud558\uc5ec \uc885\ub8cc \uc9c1\uc804 \ucd5c\ub300 2.5\ubc30\uc5d0 \ub3c4\ub2ec\ud558\ub3c4\ub85d \ubcc0\uacbd. \ubd88\uae30\ub465 1/2/3\uac1c \ubc0f \ub098\uba38\uc9c0 \uc804\ud22c \uc218\uce58\ub294 \uc720\uc9c0."
          marker='      const patchNotes = [\n'
          assert marker in s
          s=s.replace(marker, marker+'      "'+note+'",\n', 1)

          old='bodyR:25, shellPeriod:11, shellDuration:6, shellSpeedMult:1.9, shellTurn:5.0,'
          new='bodyR:25, shellPeriod:11, shellDuration:6, shellStartMult:.35, shellSpeedMult:2.5, shellTurn:5.0,'
          assert s.count(old)==1
          s=s.replace(old,new,1)

          old='v=k.baseSpeed*44;\n      f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;'
          new='v=k.baseSpeed*44*KOOPA.shellStartMult;\n      f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;'
          assert s.count(old)>=1
          s=s.replace(old,new,1)

          old='return k.baseSpeed*44*(1+(KOOPA.shellSpeedMult-1)*p);'
          new='return k.baseSpeed*44*(KOOPA.shellStartMult+(KOOPA.shellSpeedMult-KOOPA.shellStartMult)*p);'
          assert s.count(old)==1
          s=s.replace(old,new,1)

          desc="\uac70\ub300\ud55c \ubab8\uc9d1\uc758 \ub9c8\uc655\ud615 \uce90\ub9ad\ud130. \ub4f1\uaecd\uc9c8 \ub3cc\uc9c4\uc740 \uc2dc\uc791\ubd80\ud130 \ucd5c\uadfc\uc811 \uc801\uc744 \uacc4\uc18d \ucd94\uc801\ud558\uba70, \uae30\ubcf8 \uc774\ub3d9\uc18d\ub3c4\uc758 0.35\ubc30\ub85c \ub9e4\uc6b0 \ub290\ub9ac\uac8c \ucd9c\ubc1c\ud574 \uc810\uc810 \ube68\ub77c\uc838 \ucd5c\ub300 2.5\ubc30 \uc18d\ub3c4\uc5d0 \ub3c4\ub2ec\ud55c\ub2e4. \uc0c1\ub300\uc640 \ucda9\ub3cc\ud558\uba74 \uc989\uc2dc \ub3cc\uc9c4\uc744 \ub05d\ub0b4\uace0 \uc81c\uc790\ub9ac\uc5d0\uc11c 1\ucd08 \uae30\uc808\ud55c\ub2e4. \ub9f5 \uc911\uc559\uc744 \ucd95\uc73c\ub85c \ud68c\uc804\ud558\ub294 \ubd88\uae30\ub465\uc740 HP 66% \ucd08\uacfc 1\uac1c, 33~66% 2\uac1c, 33% \uc774\ud558 3\uac1c\uc774\uba70 \uac01 \ubd88\uae30\ub465\uc740 \uac19\uc740 \uc0c1\ub300\ub97c 1\ud68c\ub9cc \uc801\uc911\ud55c\ub2e4."
          pat=r'(\{ id:"koopa_king"[\s\S]*?desc:")[^"]*(" \},)'
          s,n=re.subn(pat,lambda m:m.group(1)+desc+m.group(2),s,count=1)
          assert n==1

          tip="\ub4f1\uaecd\uc9c8\uc740 \ub3cc\uc9c4 1\ud68c \ub3d9\uc548 \uac19\uc740 \uc0c1\ub300\ub97c \ucd5c\ub300 1\ud68c\ub9cc \ud0c0\uaca9\ud558\uba70 6\ucd08 \ub0b4\ub0b4 \ucd5c\uadfc\uc811 \uc801\uc744 \ucd94\uc801\ud55c\ub2e4. \uc2dc\uc791\uc740 \uae30\ubcf8 \uc774\ub3d9\uc18d\ub3c4\uc758 0.35\ubc30\uc774\uba70 \uc2dc\uac04\uc774 \uc9c0\ub0a0\uc218\ub85d \ucd5c\ub300 2.5\ubc30\uae4c\uc9c0 \uac00\uc18d\ud558\uace0, \ucda9\ub3cc \ud6c4 1\ucd08 \uae30\uc808\ud55c\ub2e4. \uc911\uc559 \ud68c\uc804 \ubd88\uae30\ub465\uc740 HP 66% \ucd08\uacfc 1\uac1c, 33~66% 2\uac1c, 33% \uc774\ud558 3\uac1c\uc774\uba70 \uac01 \uae30\ub465\ub9c8\ub2e4 \uac19\uc740 \uc0c1\ub300\ub97c 1\ud68c\ub9cc \uc801\uc911\ud55c\ub2e4. \ub530\ub77c\uc11c \ucd5c\ub300 3\ud68c \uc801\uc911\ud560 \uc218 \uc788\ub2e4. \ub109\ubc31 \uc800\ud56d\uc740 \uc5c6\ub2e4."
          pat=r'(koopa_king:\s*\{[\s\S]*?tip:\s*")[^"]*(")'
          s,n=re.subn(pat,lambda m:m.group(1)+tip+m.group(2),s,count=1)
          assert n==1

          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          assert scripts
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          python3 /tmp/patch.py
          node --check /tmp/check.js
          git diff --check
          grep -q 'shellStartMult:.35, shellSpeedMult:2.5' index.html
          grep -q 'v153' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/v153-koopa-speed.yml .github/workflows/v153-koopa-curve.yml
          git add index.html .github/workflows/v153-koopa-speed.yml .github/workflows/v153-koopa-curve.yml
          git commit -m 'v153: adjust Koopa shell acceleration'
          git push
