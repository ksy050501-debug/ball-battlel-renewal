name: Steve growth v223 once
on:
  push:
    paths:
      - '.github/workflows/steve-growth-v223-once.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Steve progression
        run: python .github/patch_steve_v223.py
      - name: Validate JavaScript
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/ballbattle.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', s, re.S)), encoding='utf-8')"
          node --check /tmp/ballbattle.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v223: rework Steve staged progression'
          git rm .github/workflows/steve-growth-v223-once.yml .github/patch_steve_v223.py
          git commit -m 'chore: remove v223 Steve patch helpers'
          git push origin HEAD:main
