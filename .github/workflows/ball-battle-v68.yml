name: Ball Battle v68 Riddle Horcrux tuning

on:
  push:
    paths:
      - ".github/ball-battle-v68.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v68 Riddle Horcrux tuning
        run: python .github/ball-battle-v68.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>', text, re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/ball-battle-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/ball-battle-inline.js
      - name: Commit v68
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "v68: nerf Riddle Horcrux revival"
          git push
