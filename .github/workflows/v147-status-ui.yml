name: Apply v147 status UI
on:
  push:
    paths:
      - '.github/workflows/v147-status-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        run: |
          echo '' | base64 -d > /tmp/patch_v147.py
          python3 /tmp/patch_v147.py
      - name: Validate UI-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '볼배틀 리뉴얼 v147' in s
          assert 'barW * ratio, 2' in s
          assert 'conanTargetHtml' in s
          assert '❄️x${cold}' in s
          assert 'ctx.rotate(Math.PI / 4);' in s
          assert 'text: `카드 ${f.duelist.hand.length}`' not in s
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          assert scripts
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
          git diff --check
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v147-status-ui.yml
          git add index.html .github/workflows/v147-status-ui.yml
          git commit -m 'v147: refine stack status UI'
          git push
