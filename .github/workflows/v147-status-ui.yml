name: Apply v147 status UI
on:
  push:
    paths:
      - '.github/workflows/v147-status-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v146</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v146</h1>' in s
          s=s.replace('<title>볼배틀 리뉴얼 v146</title>','<title>볼배틀 리뉴얼 v147</title>',1)
          s=s.replace('<h1 id="mainTitle">볼배틀 리뉴얼 v146</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v147</h1>',1)

          new_marks = r'''    function drawHealthStackBadges(f, barY) {
      if (!f?.alive) return;
      const barW = f.role === "보스" ? 74 : 58;
      const barH = 7;
      const barX = f.x - barW / 2;
      const conanMeter = conanMeterForTarget(f);
      const cold = Math.max(0, Math.min(ELSA.coldMax, Math.floor(f.elsaCold || 0)));
      const chances = f.jabami ? Math.max(0, Math.floor(f.jabami.debtChances || 0)) : 0;

      ctx.save();

      // 사신은 내부 0~100 누적을 그대로 사용하고, 대상 체력바 바로 위에 얇은 빨간 진행선으로만 표시한다.
      if (conanMeter > 0) {
        const ratio = clamp(conanMeter / CONAN.maxMeter, 0, 1);
        const sy = barY - 4;
        ctx.fillStyle = "rgba(127,29,29,.34)";
        roundRect(ctx, barX, sy, barW, 2, 1, true, false);
        ctx.fillStyle = "#ef4444";
        roundRect(ctx, barX, sy, barW * ratio, 2, 1, true, false);
      }

      // v144 방식: 빚 액수는 체력바 위 텍스트, 남은 빚 기회는 왼쪽 아래 빨간 다이아몬드.
      if (f.jabami?.debt > 0) {
        const debtY = barY - (conanMeter > 0 ? 12 : 8);
        ctx.font = "900 12px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(0,0,0,.78)";
        ctx.fillStyle = "#f87171";
        ctx.strokeText(`빚 ${Math.ceil(f.jabami.debt)}`, f.x, debtY);
        ctx.fillText(`빚 ${Math.ceil(f.jabami.debt)}`, f.x, debtY);
      }

      if (chances > 0) {
        const size = 5, gap = 5;
        const start = barX + size / 2;
        const dy = barY + barH + 8;
        for (let i = 0; i < chances; i++) {
          ctx.save();
          ctx.translate(start + i * (size + gap), dy);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = "#ef4444";
          ctx.strokeStyle = "#fecaca";
          ctx.lineWidth = .8;
          ctx.fillRect(-size / 2, -size / 2, size, size);
          ctx.strokeRect(-size / 2, -size / 2, size, size);
          ctx.restore();
        }
      }

      // 냉기는 체력바 오른쪽 아래에 간단히 표시. 빚 다이아가 길어질 때만 한 줄 아래로 피한다.
      if (cold > 0) {
        const coldY = barY + barH + 8 + (chances >= 4 ? 9 : 0);
        ctx.font = "900 11px system-ui";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(2,6,23,.88)";
        ctx.fillStyle = "#bae6fd";
        const coldText = `❄️x${cold}`;
        ctx.strokeText(coldText, barX + barW, coldY);
        ctx.fillText(coldText, barX + barW, coldY);
      }

      ctx.restore();
    }

    function drawHealthBar'''
          s2,n=re.subn(r'    function drawHealthStackBadges\(f, barY\) \{[\s\S]*?\n    \}\n\n    function drawHealthBar',new_marks,s,count=1)
          assert n==1, f'drawHealthStackBadges replacement count={n}'
          s=s2

          old_conan='''      if(f.conan){
        let top=0,name="";for(const [id,s] of f.conan.targets){if((s.meter||0)>top){top=s.meter||0;const t=fighters.find(x=>x.id===id);name=t?.name||"";}}
        const pending=f.conan.assaults.length>0;
        return {ratio:clamp(top/CONAN.maxMeter,0,1),className:pending?"rage-fill":"skill-fill",
          text:pending?"사건 발생 · 범인의 습격!":("사신 "+Math.floor(top)+"/"+CONAN.maxMeter+(name?" · "+name:"")),
          extraTextHtml:'<div class="status-skill-label">반경130 안 초당 사신+5 · 범위 밖에서도 누적 유지</div><div class="status-skill-label">직접 접촉 +10(대상별1초) · 100에서 0.9초 예고 후 3종 사건 랜덤 · 명목 총 피해100 · 사건 후0</div>'};}
'''
          new_conan='''      if(f.conan){
        const pending=f.conan.assaults.length>0;
        return {ratio:pending?1:0,className:pending?"rage-fill":"skill-fill",
          text:pending?"사건 발생 · 범인의 습격!":"사신 중첩 · 대상 상태창에 표시",
          extraTextHtml:'<div class="status-skill-label">반경130 안 초당 사신+5 · 범위 밖에서도 누적 유지</div><div class="status-skill-label">직접 접촉 +10(대상별1초) · 100에서 0.9초 예고 후 3종 사건 랜덤 · 명목 총 피해100 · 사건 후0</div>'};}
'''
          assert old_conan in s, 'Conan status source block not found'
          s=s.replace(old_conan,new_conan,1)

          status_anchor='''      const statusClass = f.alive ? (current ? " current" : "") : " dead";
      const skill = skillProgressInfo(f);
'''
          status_insert='''      const statusClass = f.alive ? (current ? " current" : "") : " dead";
      const conanTargetMeter = f.alive ? conanMeterForTarget(f) : 0;
      const conanTargetHtml = conanTargetMeter > 0
        ? `<div class="status-skill-label" style="color:#ef4444;font-weight:1000;">사신 ${Math.floor(conanTargetMeter)}/${CONAN.maxMeter}</div>`
        : "";
      const skill = skillProgressInfo(f);
'''
          assert status_anchor in s, 'status anchor not found'
          s=s.replace(status_anchor,status_insert,1)

          return_anchor='''          ${shieldHtml}
          ${skillHtml}
'''
          return_insert='''          ${shieldHtml}
          ${conanTargetHtml}
          ${skillHtml}
'''
          assert return_anchor in s, 'status return anchor not found'
          s=s.replace(return_anchor,return_insert,1)

          marker='      const patchNotes = [\n'
          assert marker in s
          note='      "v147: 상태 UI 재정리. 사신은 기존 0~100 누적/발동 규칙을 그대로 유지하고 대상 체력바 바로 위에 얇은 빨간 진행선으로 표시하며, 현재 사신 수치는 고난이 아니라 실제 중첩 대상의 상태창에 빨간색 사신 N/100으로 표시. 냉기는 체력바 오른쪽 아래 ❄️xN, 쟈바미 빚 기회는 v144의 왼쪽 아래 빨간 다이아몬드로 복구. 정의의 아군 카드 N 텍스트 배지를 제거해 v144처럼 실제 손패 카드 그래픽만 사용. 전투 수치·판정 변경 없음.",\n'
          s=s.replace(marker,marker+note,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate UI-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '볼배틀 리뉴얼 v147' in s
          assert 'barW * ratio, 2' in s
          assert '사신 ${Math.floor(conanTargetMeter)}/${CONAN.maxMeter}' in s
          assert 'const coldText = `❄️x${cold}`;' in s
          assert 'ctx.rotate(Math.PI / 4);' in s
          assert 'text: `카드 ${f.duelist.hand.length}`' not in s
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          assert scripts
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
          git diff --check
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v147-status-ui.yml
          git add index.html .github/workflows/v147-status-ui.yml
          git commit -m 'v147: refine stack status UI'
          git push
