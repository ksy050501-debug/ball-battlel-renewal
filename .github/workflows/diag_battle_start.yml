name: diagnose battle start
on:
  push:
    paths:
      - '.github/workflows/diag_battle_start.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install puppeteer core
        run: |
          google-chrome --version
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-save >/dev/null 2>&1
      - name: Reproduce start battle
        run: |
          node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-gpu']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>{errors.push(e.stack||e.message);console.log('PAGEERROR:',e.stack||e.message)});
            page.on('console',m=>console.log('CONSOLE:',m.type(),m.text()));
            await page.goto('file://'+process.cwd()+'/index.html',{waitUntil:'load'});
            await new Promise(r=>setTimeout(r,300));
            console.log('TITLE:',await page.title());
            console.log('CARDS:',await page.$$eval('.char-card',x=>x.length));
            console.log('SELECTED BEFORE:',await page.$$eval('.char-card.selected',x=>x.length));
            await page.evaluate(()=>document.querySelectorAll('.char-card')[0]?.click());
            await new Promise(r=>setTimeout(r,80));
            console.log('SELECTED 1:',await page.$$eval('.char-card.selected',x=>x.length));
            await page.evaluate(()=>document.querySelectorAll('.char-card')[1]?.click());
            await new Promise(r=>setTimeout(r,80));
            console.log('SELECTED 2:',await page.$$eval('.char-card.selected',x=>x.length));
            try{console.log('STATE BEFORE:',JSON.stringify(await page.evaluate(()=>eval('({battleState, fighterCount:fighters.length})'))));}catch(e){console.log('STATE BEFORE EVAL ERR:',e.message)}
            await page.click('#startBtn');
            await new Promise(r=>setTimeout(r,1200));
            try{console.log('STATE AFTER:',JSON.stringify(await page.evaluate(()=>eval('({battleState, fighterCount:fighters.length})'))));}catch(e){console.log('STATE AFTER EVAL ERR:',e.message)}
            console.log('OVERLAY TEXT:',await page.$eval('#overlay',e=>e.innerText).catch(()=>'<no overlay>'));
            console.log('OVERLAY CLASS:',await page.$eval('#overlay',e=>e.className).catch(()=>'<no overlay>'));
            console.log('ERROR COUNT:',errors.length);
            if(errors.length)process.exitCode=2;
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
