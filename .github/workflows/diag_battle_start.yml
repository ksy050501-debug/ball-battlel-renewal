name: diagnose battle start
on:
  push:
    paths:
      - '.github/workflows/diag_battle_start.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install puppeteer core
        run: |
          google-chrome --version
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-save >/dev/null 2>&1
      - name: Matrix battle startup test
        run: |
          node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-gpu']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>{errors.push(e.stack||e.message);console.log('PAGEERROR:',e.stack||e.message)});
            await page.goto('file://'+process.cwd()+'/index.html',{waitUntil:'load'});
            await new Promise(r=>setTimeout(r,200));
            const ids=await page.evaluate(()=>eval('availableCharacters().map(c=>c.id)'));
            console.log('IDS',ids.join(','));
            const pairs=[];
            for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)pairs.push([ids[i],ids[j]]);
            const failures=[];
            for(const [a,b] of pairs){
              const e0=errors.length;
              await page.evaluate(([a,b])=>eval(`resetBattle(); selected.clear(); selected.add(${JSON.stringify(a)}); selected.add(${JSON.stringify(b)}); renderAll(); startBattle();`),[a,b]);
              await new Promise(r=>setTimeout(r,180));
              const state=await page.evaluate(()=>eval('({running, fighterCount:fighters.length, battleTime, timeText:document.getElementById("timeText").textContent, stateText:document.getElementById("stateText").textContent, overlay:document.getElementById("overlay").className})'));
              if(!state.running||state.fighterCount!==2||state.battleTime<=0||errors.length>e0){failures.push({a,b,state,newErrors:errors.slice(e0)});console.log('FAIL',a,b,JSON.stringify(state),errors.slice(e0));}
            }
            console.log('PAIR COUNT',pairs.length,'FAIL COUNT',failures.length,'ERROR COUNT',errors.length);
            if(failures.length){console.log(JSON.stringify(failures,null,2));process.exitCode=2;}
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
