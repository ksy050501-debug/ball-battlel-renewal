name: v131 battle start fix
on:
  push:
    paths:
      - '.github/workflows/diag_battle_start.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v131 fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v130</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v130</h1>' in s
          old='if (f.newhello && moveNewhello(f, dt, slow * boost * gardenSlow * irisGlassSlow * oshiSlow * elsaIce)) return;'
          new='if (f.newhello && moveNewhello(f, dt, slow * boost * gardenSlow * irisGlassSlow * songAndConcussionSlow * coldAuraSlow)) return;'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          s=s.replace('<title>볼배틀 리뉴얼 v130</title>','<title>볼배틀 리뉴얼 v131</title>',1)
          s=s.replace('<h1 id="mainTitle">볼배틀 리뉴얼 v130</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v131</h1>',1)
          marker='      const patchNotes = [\n'
          assert marker in s
          note='      "v131: 경기 시작 직후 전투 루프가 멈추던 버그를 수정했습니다. v128 CC 명칭 정리 뒤 뉴헬로 병장의 특수 이동 계산에 옛 지역 변수 oshiSlow·elsaIce 참조가 남아 ReferenceError가 발생하던 문제를 현재 공용 둔화 계산 songAndConcussionSlow·coldAuraSlow로 연결했습니다. 기존 최애 노래·힌타 뇌진탕·엘팔아 냉기 둔화 수치와 병장 이동 성능은 변경하지 않았습니다.",\n'
          s=s.replace(marker,marker+note,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/ballbattle-v131.js').write_text(s[a:b],encoding='utf-8')
          assert 'oshiSlow * elsaIce' not in s
          assert '<title>볼배틀 리뉴얼 v131</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v131</h1>' in s
          PY
          node --check /tmp/ballbattle-v131.js
          git diff --check
      - name: Install browser test dependency
        run: |
          google-chrome --version
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-save >/dev/null 2>&1
      - name: Runtime battle startup test
        run: |
          node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-gpu']});
            const pairs=[['newhello_sergeant','riddle_lord'],['conan','spider_man'],['oshi','hinta'],['elsa','newhello_sergeant']];
            for(const [a,b] of pairs){
              const page=await browser.newPage();
              const errors=[];
              page.on('pageerror',e=>{errors.push(e.stack||e.message);console.log('PAGEERROR',a,b,e.stack||e.message)});
              await page.goto('file://'+process.cwd()+'/index.html',{waitUntil:'load'});
              await page.evaluate(([a,b])=>eval(`selected.clear(); selected.add(${JSON.stringify(a)}); selected.add(${JSON.stringify(b)}); renderAll(); startBattle();`),[a,b]);
              await new Promise(r=>setTimeout(r,650));
              const state=await page.evaluate(()=>eval('({running, fighterCount:fighters.length, battleTime, stateText:document.getElementById("stateText").textContent, overlay:document.getElementById("overlay").className})'));
              console.log(a,b,JSON.stringify(state),'errors',errors.length);
              if(errors.length||!state.running||state.fighterCount!==2||state.battleTime<0.25||state.stateText!=='전투중'||state.overlay.includes('show')) throw new Error('startup failed '+a+' vs '+b+' '+JSON.stringify({state,errors}));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit v131
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore battle startup loop v131'
          git push
