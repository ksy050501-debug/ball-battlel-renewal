name: One-shot v177 WokWok hunt
on:
  push:
    paths:
      - '.github/workflows/patch-v177-wokwok-hunt.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n < count:
                  raise SystemExit(f'anchor missing: {old[:180]!r} count={n}')
              s=s.replace(old,new,count)

          rep('<title>볼배틀 리뉴얼 v176</title>','<title>볼배틀 리뉴얼 v177</title>')

          # 도감: 매우 느린 기본 이속으로 변경하고 설명 갱신
          s2,n=re.subn(r'(\{ id:"wok_wok", name:"웍웍", mark:"🐺", role:"게임", color:"#7f1d1d", hp:120, attack:0, speed:)2\.25(, range:0,)',r'\g<1>1.6\2',s,count=1)
          if n!=1: raise SystemExit(f'wok card speed patch count={n}')
          s=s2
          rep('진행방향 전방120°·420 안에서 가장 체력 비율이 낮은 적의 피 냄새에 반응해 이동속도가 최대2배까지 오른다. 10초마다 현재 피 냄새 속도에 비례한 직선 돌진을 사용하며 적중 시 0.9초 제압하고 3회 공격해 흡혈한다.',
              '진행방향 전방120°·420 안에서 가장 체력 비율이 낮은 적의 피 냄새에 반응한다. 기본 이동은 매우 느리지만 상대가 반피 이하가 되면 폭발적으로 빨라진다. 10초마다 현재 피 냄새 속도에 비례해 돌진하며, 중앙60° 안에 적이 있으면 그 적을 타게팅하고 없으면 진행방향 직선으로 돌진한다. 적중 시 0.9초 제압하고 3회 공격해 흡혈한다.')

          old='''    const WOK = {
      biteDamage:14, biteHeal:10, biteCooldownHigh:7, biteCooldownLow:3.5,
      scentRange:420, scentHalfAngle:Math.PI/3, scentFloorHp:.05, scentMaxMult:2,
      dashPeriod:10, dashDuration:.55, dashSpeedMult:2.7,
      maulDuration:.9, maulHits:3, maulInterval:.3, maulDamage:7, maulHeal:4
    };'''
          new='''    const WOK = {
      biteDamage:14, biteHeal:10, biteCooldownHigh:7, biteCooldownLow:3.5,
      scentRange:420, scentHalfAngle:Math.PI/3, scentTargetHalfAngle:Math.PI/6,
      scentFloorHp:.05, scentHalfHp:.50, scentMidMult:1.35, scentHalfMult:2.6, scentMaxMult:3.4,
      dashPeriod:10, dashDuration:.55, dashSpeedMult:2.7,
      maulDuration:.9, maulHits:3, maulInterval:.3, maulDamage:7, maulHeal:4
    };'''
          rep(old,new)

          rep('''      f.wok={biteCharge:0,nextDashAt:WOK.dashPeriod,dashUntil:0,dashSpeed:0,dashDirX:1,dashDirY:0,bloodMult:1,bloodHp:1,biteFx:0,maul:null,baseSpeed:f.baseSpeed||f.speed||2.25};''',
              '''      f.wok={biteCharge:0,nextDashAt:WOK.dashPeriod,dashUntil:0,dashSpeed:0,dashDirX:1,dashDirY:0,dashTargetId:null,bloodMult:1,bloodHp:1,biteFx:0,maul:null,baseSpeed:f.baseSpeed||f.speed||1.6};''')

          old='''      w.bloodHp=found?best:1;
      const t=found?clamp((1-best)/(1-WOK.scentFloorHp),0,1):0;
      w.bloodMult=1+t*(WOK.scentMaxMult-1);
      return w.bloodMult;
    }'''
          new='''      w.bloodHp=found?best:1;
      if(!found){w.bloodMult=1;return 1;}
      if(best>WOK.scentHalfHp){
        const t=clamp((1-best)/(1-WOK.scentHalfHp),0,1);
        w.bloodMult=1+t*(WOK.scentMidMult-1);
      }else{
        const t=clamp((WOK.scentHalfHp-best)/(WOK.scentHalfHp-WOK.scentFloorHp),0,1);
        w.bloodMult=WOK.scentHalfMult+t*(WOK.scentMaxMult-WOK.scentHalfMult);
      }
      return w.bloodMult;
    }
    function wokDashTarget(f){
      const w=f?.wok;if(!w)return null;
      const mag=Math.hypot(f.vx||0,f.vy||0);
      if(mag<.01)return null;
      const ux=f.vx/mag,uy=f.vy/mag,cosHalf=Math.cos(WOK.scentTargetHalfAngle);
      let best=null,bestHp=Infinity,bestDist=Infinity;
      enemiesOf(f).forEach(e=>{
        if(!e?.alive||e.isSummon||e.duelMonster||e.marioBlock)return;
        const dx=e.x-f.x,dy=e.y-f.y,d=Math.hypot(dx,dy);
        if(d<.001||d>WOK.scentRange)return;
        if((dx/d)*ux+(dy/d)*uy<cosHalf)return;
        const q=clamp(e.hp/Math.max(1,e.maxHp||e.hp||1),0,1);
        if(q<bestHp-1e-6||(Math.abs(q-bestHp)<=1e-6&&d<bestDist)){best=e;bestHp=q;bestDist=d;}
      });
      return best;
    }'''
          rep(old,new)

          old='''    function startWokWokDash(f){
      const w=f?.wok;if(!w||w.maul||wokWokBlocked(f)||battleTime<(w.nextDashAt||0))return false;
      const blood=wokBloodSpeedMultiplier(f),mag=Math.hypot(f.vx||0,f.vy||0)||1;
      w.dashDirX=(f.vx||1)/mag;w.dashDirY=(f.vy||0)/mag;
      w.dashSpeed=w.baseSpeed*44*blood*WOK.dashSpeedMult;
      w.dashUntil=battleTime+WOK.dashDuration;w.nextDashAt=battleTime+WOK.dashPeriod;
      f.vx=w.dashDirX*w.dashSpeed;f.vy=w.dashDirY*w.dashSpeed;
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-34,"야수의 돌진!","#ef4444");spawnBlast(f.x,f.y,42,"#7f1d1d");}
      return true;
    }'''
          new='''    function startWokWokDash(f){
      const w=f?.wok;if(!w||w.maul||wokWokBlocked(f)||battleTime<(w.nextDashAt||0))return false;
      const blood=wokBloodSpeedMultiplier(f),target=wokDashTarget(f),mag=Math.hypot(f.vx||0,f.vy||0)||1;
      if(target){
        const dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy)||1;
        w.dashDirX=dx/d;w.dashDirY=dy/d;w.dashTargetId=target.id;
      }else{
        w.dashDirX=(f.vx||1)/mag;w.dashDirY=(f.vy||0)/mag;w.dashTargetId=null;
      }
      w.dashSpeed=w.baseSpeed*44*blood*WOK.dashSpeedMult;
      w.dashUntil=battleTime+WOK.dashDuration;w.nextDashAt=battleTime+WOK.dashPeriod;
      f.vx=w.dashDirX*w.dashSpeed;f.vy=w.dashDirY*w.dashSpeed;
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-34,target?"피의 추적!":"야수의 돌진!",target?"#fca5a5":"#ef4444");spawnBlast(f.x,f.y,42,"#7f1d1d");}
      return true;
    }'''
          rep(old,new)

          old='''    function moveWokWokDash(f,dt){
      const w=f?.wok;if(!w||battleTime>=(w.dashUntil||0))return false;
      if(wokWokBlocked(f)){w.dashUntil=0;wokRestoreCruise(f);return false;}
      const speed=w.dashSpeed||w.baseSpeed*44*WOK.dashSpeedMult;
      f.vx=w.dashDirX*speed;f.vy=w.dashDirY*speed;
      let nx=f.x+f.vx*dt,ny=f.y+f.vy*dt,hitX=false,hitY=false;
      if(nx<arena.x+f.r||nx>arena.x2-f.r)hitX=true;
      if(ny<arena.y+f.r||ny>arena.y2-f.r)hitY=true;
      f.x=clamp(nx,arena.x+f.r,arena.x2-f.r);f.y=clamp(ny,arena.y+f.r,arena.y2-f.r);
      if(hitX||hitY){if(hitX)w.dashDirX*=-1;if(hitY)w.dashDirY*=-1;w.dashUntil=0;wokRestoreCruise(f);}
      return true;
    }'''
          new='''    function moveWokWokDash(f,dt){
      const w=f?.wok;if(!w||battleTime>=(w.dashUntil||0))return false;
      if(wokWokBlocked(f)){w.dashUntil=0;w.dashTargetId=null;wokRestoreCruise(f);return false;}
      if(w.dashTargetId){
        const target=fighterById(w.dashTargetId);
        if(target?.alive&&areEnemies(f,target)){
          const dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy)||1;
          w.dashDirX=dx/d;w.dashDirY=dy/d;
        }else w.dashTargetId=null;
      }
      const speed=w.dashSpeed||w.baseSpeed*44*WOK.dashSpeedMult;
      f.vx=w.dashDirX*speed;f.vy=w.dashDirY*speed;
      let nx=f.x+f.vx*dt,ny=f.y+f.vy*dt,hitX=false,hitY=false;
      if(nx<arena.x+f.r||nx>arena.x2-f.r)hitX=true;
      if(ny<arena.y+f.r||ny>arena.y2-f.r)hitY=true;
      f.x=clamp(nx,arena.x+f.r,arena.x2-f.r);f.y=clamp(ny,arena.y+f.r,arena.y2-f.r);
      if(hitX||hitY){if(hitX)w.dashDirX*=-1;if(hitY)w.dashDirY*=-1;w.dashUntil=0;w.dashTargetId=null;wokRestoreCruise(f);}
      return true;
    }'''
          rep(old,new)

          rep('''        w.dashUntil=0;w.maul={targetId:target.id,endAt:battleTime+WOK.maulDuration,nextAt:battleTime,hits:0};''',
              '''        w.dashUntil=0;w.dashTargetId=null;w.maul={targetId:target.id,endAt:battleTime+WOK.maulDuration,nextAt:battleTime,hits:0};''')

          # 부채꼴/주변 피냄새 시각화 제거, 눈 색으로만 ON/OFF 표시
          old='''      if(!f.portraitOnly){
        const mag=Math.hypot(f.vx||0,f.vy||0)||1;
        const a=Math.atan2((f.vy||0)/mag,(f.vx||1)/mag);
        const active=(w.bloodMult||1)>1.001;
        ctx.save();ctx.translate(f.x,f.y);
        ctx.globalAlpha=active ? .13 : .035;
        ctx.fillStyle=active?"#ef4444":"#94a3b8";
        ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,WOK.scentRange,a-WOK.scentHalfAngle,a+WOK.scentHalfAngle);ctx.closePath();ctx.fill();
        ctx.globalAlpha=active ? .52 : .14;ctx.strokeStyle=active?"#f87171":"#94a3b8";ctx.lineWidth=active?2.2:1.2;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-WOK.scentHalfAngle)*WOK.scentRange,Math.sin(a-WOK.scentHalfAngle)*WOK.scentRange);ctx.arc(0,0,WOK.scentRange,a-WOK.scentHalfAngle,a+WOK.scentHalfAngle);ctx.lineTo(0,0);ctx.stroke();ctx.restore();
      }
      ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.r/20,f.r/20);
      if(!f.portraitOnly&&(w.bloodMult||1)>1.02){ctx.save();ctx.globalAlpha=.18+.22*clamp(((w.bloodMult||1)-1)/(WOK.scentMaxMult-1),0,1);ctx.strokeStyle="#ef4444";ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-4,1,24+i*7,-.9,.9);ctx.stroke();}ctx.restore();}'''
          new='''      ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.r/20,f.r/20);'''
          rep(old,new)

          old='''      ctx.fillStyle="#ef4444";ctx.shadowColor="#dc2626";ctx.shadowBlur=6;ctx.beginPath();ctx.arc(-5,-9,1.8,0,Math.PI*2);ctx.arc(5,-9,1.8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;'''
          new='''      const bloodOn=!f.portraitOnly&&(w.bloodMult||1)>1.001;
      ctx.fillStyle=bloodOn?"#ef4444":"#fbbf24";ctx.shadowColor=bloodOn?"#dc2626":"#92400e";ctx.shadowBlur=bloodOn?10:2;ctx.beginPath();ctx.arc(-5,-9,1.8,0,Math.PI*2);ctx.arc(5,-9,1.8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;'''
          rep(old,new)

          # 상태창 설명 갱신
          rep('''피 냄새 ×${blood} · 실효 이속 ${(w.effectiveSpeed||w.baseSpeed||f.baseSpeed).toFixed(2)} · 전방120°/420 · 감지 최저 HP ${prey}% · 돌진 ${dashLeft.toFixed(1)}초''',
              '''피 냄새 ×${blood} · 실효 이속 ${(w.effectiveSpeed||w.baseSpeed||f.baseSpeed).toFixed(2)} · 전방120°/420 · 중앙60° 돌진 타게팅 · 감지 최저 HP ${prey}% · 돌진 ${dashLeft.toFixed(1)}초''')

          # 세부정보 갱신
          rep('''피 냄새 전방120°·거리420 · 적 HP100% ×1.0→5% 이하 ×2.0 이속 · 돌진10초·0.55초 직선 이동 · 적중 시0.9초 제압''',
              '''피 냄새 전방120°·거리420 · 기본이속1.6 · 적 HP100% ×1.0 / 50% 초과 최대×1.35 / 50% 이하 즉시×2.6→5% 이하×3.4 · 돌진10초·0.55초 · 중앙60° 적 존재 시 타게팅, 없으면 직선 · 적중 시0.9초 제압''')
          rep('''돌진은 적을 추적하거나 방향을 보정하지 않고 발동 순간 진행방향으로만 이동한다. 돌진 속도는 발동 순간 피 냄새가 반영된 이동속도의 2.7배이며, 적중하면 돌진을 끝내고 0.9초 동안 제압한 뒤 3회 공격·흡혈한다.''',
              '''돌진 발동 순간 중앙60°·거리420 안에 적이 있으면 그중 체력 비율이 가장 낮은 적을 타게팅해 돌진 중 방향을 보정한다. 중앙60° 안에 적이 없으면 발동 순간 진행방향으로 직선 이동한다. 돌진 속도는 발동 순간 피 냄새가 반영된 이동속도의 2.7배이며, 적중하면 돌진을 끝내고 0.9초 동안 제압한 뒤 3회 공격·흡혈한다.''')

          # 패치노트
          rep('''      const patchNotes = [
      "v176:''','''      const patchNotes = [
      "v177: 웍웍 피의 사냥 구조 강화. 기본 이동속도 2.25→1.6으로 크게 낮추고, 전방120°·거리420 안 최저 체력 비율 적을 기준으로 HP50% 초과에서는 최대×1.35, HP50% 이하 진입 즉시×2.6에서 HP5% 이하 최대×3.4까지 폭발적으로 가속한다. 기존 부채꼴/피냄새 범위 시각화는 제거하고 피 냄새 활성 여부는 웍웍의 눈이 황색→붉은색으로 변하는 것으로 표시한다. 돌진 발동 시 진행방향 중앙60°·거리420 안에 적이 있으면 가장 낮은 HP비율 적을 타게팅해 돌진 중 방향을 보정하고, 없으면 기존처럼 진행방향 직선 돌진한다. 깨물기14+회복10, 돌진10초·0.55초·속도×2.7, 제압0.9초·7×3·타격당 회복4는 유지.",
      "v176:''')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script not found')
          Path('/tmp/ballbattle.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/ballbattle.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine WokWok blood hunt and targeted dash v177'
          git push
