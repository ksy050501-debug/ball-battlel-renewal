name: One-shot v177 WokWok hunt
on:
  push:
    paths:
      - '.github/workflows/patch-v177-wokwok-hunt.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 .github/scripts/patch_v177_wokwok.py
      - name: Syntax check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('script not found')
          Path('/tmp/ballbattle.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/ballbattle.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine WokWok blood hunt and targeted dash v177'
          git push
