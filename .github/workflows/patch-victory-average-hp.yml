name: Patch victory-only average HP

on:
  push:
    paths:
      - '.github/workflows/patch-victory-average-hp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch average remaining HP aggregation
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          encoded = [
              ('ICAgICAgICBjaG9zZW4uZm9yRWFjaChjID0+IHsKICAgICAgICAgIGNvbnN0IGZpZ2h0ZXIgPSBmaWdodGVycy5maW5kKGYgPT4gIWYuaXNTdW1tb24gJiYgZi5iYXNlSWQgPT09IGMuaWQpOwogICAgICAgICAgcmVtYWluaW5nSHBUb3RhbHNbYy5pZF0gKz0gTWF0aC5tYXgoMCwgZmlnaHRlciA/IGZpZ2h0ZXIuaHAgOiAwKTsKICAgICAgICB9KTs=', 'ICAgICAgICBpZiAod2lubmVySWQgIT09ICJkcmF3IikgewogICAgICAgICAgY29uc3Qgd2lubmVyID0gZmlnaHRlcnMuZmluZChmID0+ICFmLmlzU3VtbW9uICYmIGYuYmFzZUlkID09PSB3aW5uZXJJZCk7CiAgICAgICAgICByZW1haW5pbmdIcFRvdGFsc1t3aW5uZXJJZF0gKz0gTWF0aC5tYXgoMCwgd2lubmVyID8gd2lubmVyLmhwIDogMCk7CiAgICAgICAgfQ=='),
              ('ICAgICAgICBhdmVyYWdlSHA6IE9iamVjdC5mcm9tRW50cmllcyhjaG9zZW4ubWFwKGMgPT4gWwogICAgICAgICAgYy5pZCwKICAgICAgICAgIGNvdW50ID4gMCA/IHJlbWFpbmluZ0hwVG90YWxzW2MuaWRdIC8gY291bnQgOiAwCiAgICAgICAgXSkpLA==', 'ICAgICAgICBhdmVyYWdlSHA6IE9iamVjdC5mcm9tRW50cmllcyhjaG9zZW4ubWFwKGMgPT4gewogICAgICAgICAgY29uc3Qgd2lucyA9IHNjb3JlW2MuaWRdIHx8IDA7CiAgICAgICAgICByZXR1cm4gW2MuaWQsIHdpbnMgPiAwID8gcmVtYWluaW5nSHBUb3RhbHNbYy5pZF0gLyB3aW5zIDogMF07CiAgICAgICAgfSkpLA=='),
              ('ICAgICAgICBjb25zdCBhdmVyYWdlSHAgPSB7CiAgICAgICAgICBbb3BwLmlkXTogcmVtYWluaW5nSHBUb3RhbHNbb3BwLmlkXSAvIHRvdGFsLAogICAgICAgICAgW2ZvY3VzLmlkXTogcmVtYWluaW5nSHBUb3RhbHNbZm9jdXMuaWRdIC8gdG90YWwKICAgICAgICB9Ow==', 'ICAgICAgICBjb25zdCBhdmVyYWdlSHAgPSB7CiAgICAgICAgICBbb3BwLmlkXTogYVdpbnMgPiAwID8gcmVtYWluaW5nSHBUb3RhbHNbb3BwLmlkXSAvIGFXaW5zIDogMCwKICAgICAgICAgIFtmb2N1cy5pZF06IGJXaW5zID4gMCA/IHJlbWFpbmluZ0hwVG90YWxzW2ZvY3VzLmlkXSAvIGJXaW5zIDogMAogICAgICAgIH07')
          ]
          for i, (old64, new64) in enumerate(encoded, 1):
              old = base64.b64decode(old64).decode('utf-8')
              new = base64.b64decode(new64).decode('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Patch target {i} expected exactly once, found {count}; aborting')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-victory-average-hp.yml
          git add index.html
          git diff --cached --check
          git commit -m "Fix average HP to use winning battles only"
          git push
