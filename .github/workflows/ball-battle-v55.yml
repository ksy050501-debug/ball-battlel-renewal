name: Ball Battle v55 Oshi tuning

on:
  push:
    paths:
      - '.github/workflows/ball-battle-v55.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v55 Oshi tuning
        run: python .github/ball-battle-v55.py
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('no inline scripts found')
          for i, script in enumerate(scripts):
              Path(f'/tmp/inline-{i}.js').write_text(script, encoding='utf-8')
          print(len(scripts))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
      - name: Commit v55
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Tune Oshi song damage and fame gain for v55'
          git push
