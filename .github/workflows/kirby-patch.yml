name: Apply Kirby v197 patch

on:
  push:
    paths:
      - '.github/workflows/kirby-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch index.html
        run: |
          cat > /tmp/patch_kirby.py <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {n}')
              s=s.replace(old,new,1)

          once('<title>볼배틀 리뉴얼 v196</title>','<title>볼배틀 리뉴얼 v197</title>','title')
          once('<h1 id="mainTitle">볼배틀 리뉴얼 v196</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v197</h1>','header')

          tracer='''      { id:"tracer_pan", name:"쟁반서", mark:"↶", role:"게임", color:"#38bdf8", hp:160, attack:0, speed:3.1, range:230,\n        skillName:"펄스 피스톨 · 연속 점멸 · 되감기", condition:"파란 펄스탄 다단히트 · 점멸 3회 충전 → 3연속 돌진 → 되감기 · 피해 스택100 → 부착 폭탄", desc:"주변의 가장 가까운 적에게 파란 펄스탄을 다단히트로 연사한다. 점멸이 3회 충전되면 적이 지나간 자리로 세 번 연속 돌진한 뒤 시작 위치와 체력으로 되감는다. 펄스 피스톨 피해로 스택을 채우면 마지막 점멸 직후 가장 가까운 적에게 부착 폭탄을 던진다." },\n'''
          kirby='''      { id:"kirby", name:"커비", mark:"★", role:"게임", color:"#f472b6", hp:150, attack:0, speed:2.55, range:0,\n        skillName:"흡입 · 카피 능력", condition:"기본 상태 6초 주기 120° 흡입 · 중립 몬스터 최대2마리 · 카피 상태 누적피해45 → 별 이탈", desc:"기본 상태에서는 진행방향 전방120도를 주기적으로 흡입한다. 맵에는 커비와 상대 모두를 공격하는 중립 몬스터가 최대2마리까지 등장하며, 몬스터를 삼키면 소드·빔·파이어·밤 카피 능력을 얻는다. 상대 본체를 삼키면 잠시 몸속에 가둔 뒤 진행방향으로 뱉어 강하게 날리고 벽충돌 피해를 줄 수 있다. 카피 상태에서 누적 피해45를 받으면 능력이 별로 튕겨 나가며, 5초 안에 별에 다시 닿으면 해당 능력을 되찾는다." },\n'''
          once(tracer,tracer+kirby,'character insert')

          once('''      if(c.id==="tracer_pan")return {damage:"펄스 피스톨2×8 / 부착 폭탄36(반경72)",tick:"피스톨2.8초마다8연사 · 점멸2.6초마다1회 충전 · 3회 충전 시 3연속 점멸 후 되감기",tip:"점멸은 적의 현재 위치에 직접 충돌하지 않고 이동 흔적으로 향한다. 펄스 피스톨로 실제 준 피해×2만큼 폭탄 스택이 차며 100에서 준비 완료. 준비된 폭탄은 세 번째 점멸 직후 가장 가까운 적에게 던진 뒤 위치와 체력을 연속 점멸 시작 시점으로 되감는다."};\n''','''      if(c.id==="tracer_pan")return {damage:"펄스 피스톨2×8 / 부착 폭탄36(반경72)",tick:"피스톨2.8초마다8연사 · 점멸2.6초마다1회 충전 · 3회 충전 시 3연속 점멸 후 되감기",tip:"점멸은 적의 현재 위치에 직접 충돌하지 않고 이동 흔적으로 향한다. 펄스 피스톨로 실제 준 피해×2만큼 폭탄 스택이 차며 100에서 준비 완료. 준비된 폭탄은 세 번째 점멸 직후 가장 가까운 적에게 던진 뒤 위치와 체력을 연속 점멸 시작 시점으로 되감는다."};\n      if(c.id==="kirby")return {damage:"소드13 / 빔7 / 파이어7+화상1×3 / 밤14(반경58) / 뱉기 벽충돌12",tick:"기본 흡입6초 주기·1.5초 지속·전방120° / 중립 몬스터6.5초마다·최대2 / 카피 누적피해45에서 별 이탈·별5초",tip:"기본 상태에서만 흡입한다. 중립 몬스터를 삼키면 해당 카피 능력을 얻고, 상대 본체를 삼키면 1.4초 뒤 진행방향으로 뱉는다. 카피 능력은 받은 실제 피해 누적45에서 별로 빠지며 별에 다시 닿으면 즉시 복구된다."};\n''','damage info')

          once('''        const bustIds = new Set(["elsa","conan","spider_man","mario_plumber","koopa_king","coyote_d","wok_wok"]);''','''        const bustIds = new Set(["elsa","conan","spider_man","mario_plumber","koopa_king","coyote_d","wok_wok","kirby"]);''','portrait bust')
          once('''        if (c.id === "spider_man") initSpiderMan(preview);\n        if (c.id === "mario_plumber") initMario(preview);''','''        if (c.id === "spider_man") initSpiderMan(preview);\n        if (c.id === "kirby") initKirby(preview);\n        if (c.id === "mario_plumber") initMario(preview);''','portrait init')

          once('''    let pylons = [];\n    let logs = [];''','''    let pylons = [];\n    let kirbyCopyStars = [];\n    let kirbyNeutralSpawnClock = 2.5;\n    let logs = [];''','globals')

          once('''      "v196: 신규 게임 진영 캐릭터 쟁반서 추가. 파란 펄스 피스톨 8연사, 3회 충전 후 적 이동 흔적으로 3연속 점멸, 시작 위치·체력 되감기, 피스톨 실제 피해×2 스택100에서 점멸 종료 직전 부착 폭탄 투척.",''','''      "v197: 신규 게임 진영 캐릭터 커비 추가. 기본 상태 6초 주기 전방120° 흡입, 중립 몬스터 최대2마리, 소드·빔·파이어·밤 카피, 상대 삼키기 후 1.4초 뒤 뱉기·넉백·벽충돌, 카피 상태 누적피해45에서 별 이탈 및 5초 내 재획득 구조를 추가.",\n      "v196: 신규 게임 진영 캐릭터 쟁반서 추가. 파란 펄스 피스톨 8연사, 3회 충전 후 적 이동 흔적으로 3연속 점멸, 시작 위치·체력 되감기, 피스톨 실제 피해×2 스택100에서 점멸 종료 직전 부착 폭탄 투척.",''','patch note')

          once('''      if (c.id === "spider_man") initSpiderMan(fighter);\n      if (c.id === "tracer_pan") initTracer(fighter);\n      if (c.id === "mario_plumber") initMario(fighter);''','''      if (c.id === "spider_man") initSpiderMan(fighter);\n      if (c.id === "tracer_pan") initTracer(fighter);\n      if (c.id === "kirby") initKirby(fighter);\n      if (c.id === "mario_plumber") initMario(fighter);''','fighter init')

          once('''      pylons = [];\n      logs = [];\n      $("log").innerHTML = "";''','''      pylons = [];\n      kirbyCopyStars = [];\n      kirbyNeutralSpawnClock = KIRBY.neutralFirst;\n      logs = [];\n      $("log").innerHTML = "";''','battle reset start')
          once('''      pylons = [];\n      battleTime = 0;''','''      pylons = [];\n      kirbyCopyStars = [];\n      kirbyNeutralSpawnClock = KIRBY.neutralFirst;\n      battleTime = 0;''','reset battle')

          kirby_code=r'''
    const KIRBY = {
      inhalePeriod:6, inhaleDuration:1.5, inhaleRange:165, inhaleCone:Math.PI*2/3, inhalePull:132, inhaleGrow:1.16,
      swallowedDuration:1.4, spitSpeed:520, spitFlight:.72, spitWallDamage:12,
      copyDamageNeed:45, starLife:5, starSpeed:150,
      neutralFirst:2.5, neutralPeriod:6.5, neutralMax:2
    };
    const KIRBY_COPY = {
      sword:{name:"소드",color:"#86efac"}, beam:{name:"빔",color:"#fde047"}, fire:{name:"파이어",color:"#fb923c"}, bomb:{name:"밤",color:"#a78bfa"}
    };
    function kirbyCopyName(type){return KIRBY_COPY[type]?.name||"기본";}
    function initKirby(f){
      f.kirby={mode:"base",baseR:f.r||16,inhaleCd:1.8,inhaleTime:0,inhaleAngle:Math.atan2(f.vy||0,f.vx||1),copyDamageStart:f.damageTaken||0,attackCd:0,swallowedId:"",swallowTime:0};
    }
    function kirbyResetBody(f){if(f?.kirby)f.r=f.kirby.baseR||16;}
    function kirbyGainCopy(f,type){
      const k=f?.kirby;if(!k||!KIRBY_COPY[type])return false;
      k.mode=type;k.attackCd=.2;k.inhaleTime=0;k.inhaleCd=KIRBY.inhalePeriod;k.copyDamageStart=f.damageTaken||0;kirbyResetBody(f);
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-30,`${kirbyCopyName(type)} 카피!`,KIRBY_COPY[type].color);spawnBlast(f.x,f.y,46,KIRBY_COPY[type].color);playSound("summon",.75);}
      return true;
    }
    function kirbyDropCopy(f){
      const k=f?.kirby;if(!k||k.mode==="base")return false;
      const type=k.mode,move=Math.atan2(f.vy||0,f.vx||1),a=move+Math.PI+rand(-.55,.55);
      kirbyCopyStars.push({ownerId:f.id,type,x:f.x,y:f.y,r:9,vx:Math.cos(a)*KIRBY.starSpeed,vy:Math.sin(a)*KIRBY.starSpeed,life:KIRBY.starLife,maxLife:KIRBY.starLife});
      k.mode="base";k.attackCd=0;k.inhaleTime=0;k.inhaleCd=1.6;k.copyDamageStart=f.damageTaken||0;kirbyResetBody(f);
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-32,"카피 능력 이탈!","#fde68a");spawnParticles(f.x,f.y,"#fde68a",12);}
      return true;
    }
    function kirbyStartInhale(f){
      const k=f?.kirby;if(!k||k.mode!=="base"||k.swallowedId)return false;
      const mag=Math.hypot(f.vx||0,f.vy||0);if(mag>2)k.inhaleAngle=Math.atan2(f.vy,f.vx);
      k.inhaleTime=KIRBY.inhaleDuration;k.inhaleCd=KIRBY.inhalePeriod;f.r=(k.baseR||16)*KIRBY.inhaleGrow;
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-28,"흡입!","#f9a8d4");playSound("wind",.72);}
      return true;
    }
    function kirbyStopInhale(f){const k=f?.kirby;if(!k)return;k.inhaleTime=0;kirbyResetBody(f);}
    function kirbyBlocked(f){return !f?.alive||isStunned(f)||(f.hardFreeze||0)>0||(f.bindStun||0)>0||(f.punchHold||0)>0||(f.punchFlight||0)>0||(f.vampSuppressed||0)>0||(f.joltStop||0)>0||isCasting(f);}
    function kirbyAttackTarget(f){return enemiesOf(f).filter(e=>e.alive&&!e.kirbySwallowedBy).sort((a,b)=>dist(f,a)-dist(f,b))[0]||null;}
    function kirbyUseCopy(f){
      const k=f.kirby,target=kirbyAttackTarget(f);if(!target)return false;const d=dist(f,target);
      if(k.mode==="sword"){
        if(d>82){k.attackCd=.18;return false;}const dealt=damage(target,13,f,"커비 소드");if(dealt>0&&target.alive){const dx=target.x-f.x,dy=target.y-f.y,m=Math.hypot(dx,dy)||1;applyKnockback(target,f,dx/m,dy/m,145,.18,{additive:true});}k.attackCd=1.25;if(!fastSimMode)spawnSlash(f.x,f.y,Math.atan2(target.y-f.y,target.x-f.x),70,"#86efac");return true;
      }
      if(k.mode==="beam"){shoot(f,target,7,8.2,5,"커비 빔","#fde047",{life:2.1,trail:15,glow:22});k.attackCd=1.55;return true;}
      if(k.mode==="fire"){
        if(d>105){k.attackCd=.20;return false;}damage(target,7,f,"커비 파이어");applyBurn(target,f,1,1.8,.6,3,"kirbyFire");k.attackCd=1.05;if(!fastSimMode){spawnHitFlash(target.x,target.y,"#fb923c",40);spawnParticles(target.x,target.y,"#fb923c",8);}return true;
      }
      if(k.mode==="bomb"){
        scheduleBlast(f,target.x,target.y,.58,58,14,"#a78bfa","커비 밤",{noCross:true});k.attackCd=3.1;if(!fastSimMode)spawnFloatingText(f.x,f.y-f.r-26,"밤!","#c4b5fd");return true;
      }
      return false;
    }
    function updateKirby(f,dt){
      const k=f?.kirby;if(!k||!f.alive)return;
      if(k.mode!=="base"&&(f.damageTaken||0)-(k.copyDamageStart||0)>=KIRBY.copyDamageNeed)kirbyDropCopy(f);
      if(k.inhaleTime>0){
        if(kirbyBlocked(f)){kirbyStopInhale(f);}else{const mag=Math.hypot(f.vx||0,f.vy||0);if(mag>2)k.inhaleAngle=Math.atan2(f.vy,f.vx);k.inhaleTime=Math.max(0,k.inhaleTime-dt);f.r=(k.baseR||16)*KIRBY.inhaleGrow;if(k.inhaleTime<=0)kirbyStopInhale(f);}
      }else kirbyResetBody(f);
      if(k.mode==="base"){
        k.inhaleCd=Math.max(0,(k.inhaleCd||0)-dt);
        if(!k.swallowedId&&k.inhaleTime<=0&&k.inhaleCd<=0&&!kirbyBlocked(f))kirbyStartInhale(f);
      }else{
        k.attackCd=Math.max(0,(k.attackCd||0)-dt);
        if(k.attackCd<=0&&!kirbyBlocked(f))kirbyUseCopy(f);
      }
    }
    function kirbyNeutralData(type){
      return ({
        sword:{name:"소드 몬스터",mark:"⚔",color:"#4ade80",hp:30,speed:2.2,period:1.25},
        beam:{name:"빔 몬스터",mark:"✦",color:"#facc15",hp:27,speed:1.9,period:2.0},
        fire:{name:"파이어 몬스터",mark:"♨",color:"#f97316",hp:31,speed:2.0,period:1.6},
        bomb:{name:"밤 몬스터",mark:"●",color:"#8b5cf6",hp:32,speed:1.75,period:3.0}
      })[type];
    }
    function spawnKirbyNeutral(){
      const types=Object.keys(KIRBY_COPY),active=fighters.filter(e=>e.alive&&e.kirbyNeutral).map(e=>e.kirbyNeutral.type),pool=types.filter(t=>!active.includes(t)),type=pick(pool.length?pool:types),d=kirbyNeutralData(type),r=13;
      let x=rand(arena.x+r+18,arena.x2-r-18),y=rand(arena.y+r+18,arena.y2-r-18);
      for(let tries=0;tries<10&&fighters.some(f=>f.alive&&!f.isSummon&&Math.hypot(f.x-x,f.y-y)<90);tries++){x=rand(arena.x+r+18,arena.x2-r-18);y=rand(arena.y+r+18,arena.y2-r-18);}
      const spec={id:"kirby_neutral_"+type,name:d.name,mark:d.mark,role:"중립",color:d.color,hp:d.hp,attack:0,speed:d.speed,range:0,skillName:d.name,condition:""};
      const m=makeFighter(spec,{x,y},fighterSerial++,null,null);m.isSummon=true;m.ownerId=null;m.summonLife=9999;m.r=r;m.kirbyNeutral={type,attackCd:rand(.4,1.0)};fighters.push(m);
      if(!fastSimMode){spawnBlast(x,y,34,d.color);spawnFloatingText(x,y-r-20,d.name,d.color);}
      return m;
    }
    function kirbyNeutralTarget(f){return fighters.filter(e=>e.alive&&!e.isSummon&&!e.kirbySwallowedBy&&e!==f).sort((a,b)=>dist(f,a)-dist(f,b))[0]||null;}
    function updateKirbyNeutral(f,dt){
      const n=f?.kirbyNeutral;if(!n||!f.alive)return;n.attackCd=Math.max(0,(n.attackCd||0)-dt);const target=kirbyNeutralTarget(f);if(!target||isStunned(f)||(f.hardFreeze||0)>0)return;
      const dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy)||1,v=(f.baseSpeed||f.speed||2)*44;f.vx=dx/d*v;f.vy=dy/d*v;
      if(n.attackCd>0)return;
      if(n.type==="sword"&&d<=48){damage(target,5,f,"중립 소드");n.attackCd=1.25;if(!fastSimMode)spawnSlash(f.x,f.y,Math.atan2(dy,dx),45,"#4ade80");}
      else if(n.type==="beam"&&d<=210){shoot(f,target,5,7.4,4,"중립 빔","#facc15",{life:2.0,trail:10});n.attackCd=2.0;}
      else if(n.type==="fire"&&d<=92){damage(target,4,f,"중립 파이어");applyBurn(target,f,1,1.2,.6,2,"kirbyNeutralFire");n.attackCd=1.6;if(!fastSimMode)spawnHitFlash(target.x,target.y,"#f97316",30);}
      else if(n.type==="bomb"&&d<=185){scheduleBlast(f,target.x,target.y,.65,48,8,"#8b5cf6","중립 밤",{noCross:true});n.attackCd=3.0;}
      else n.attackCd=.18;
    }
    function kirbySwallowEnemy(f,target){
      const k=f?.kirby;if(!k||k.swallowedId||!target?.alive||target.isSummon||!areEnemies(f,target))return false;
      k.swallowedId=target.id;k.swallowTime=KIRBY.swallowedDuration;target.kirbySwallowedBy=f.id;target.vx=0;target.vy=0;target.punchFlight=0;target.punchSource=null;target.punchWallPower=0;target.webKnockTime=0;target.coyoteFling=null;kirbyStopInhale(f);
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-34,"꿀꺽!","#f9a8d4");spawnBlast(f.x,f.y,42,"#f472b6");}
      return true;
    }
    function kirbyReleaseSwallowed(f,spit=true){
      const k=f?.kirby;if(!k?.swallowedId)return false;const target=fighterById(k.swallowedId);k.swallowedId="";k.swallowTime=0;
      if(!target)return false;target.kirbySwallowedBy="";target.x=clamp(f.x,arena.x+target.r,arena.x2-target.r);target.y=clamp(f.y,arena.y+target.r,arena.y2-target.r);
      if(spit&&f.alive){const mag=Math.hypot(f.vx||0,f.vy||0),a=mag>2?Math.atan2(f.vy,f.vx):(k.inhaleAngle||0);target.x=clamp(f.x+Math.cos(a)*(f.r+target.r+3),arena.x+target.r,arena.x2-target.r);target.y=clamp(f.y+Math.sin(a)*(f.r+target.r+3),arena.y+target.r,arena.y2-target.r);applyKnockback(target,f,Math.cos(a),Math.sin(a),KIRBY.spitSpeed,KIRBY.spitFlight,{wallDamageSource:f,wallDamage:KIRBY.spitWallDamage,resetWallHits:true,replaceDuration:true});if(!fastSimMode){spawnFloatingText(target.x,target.y-target.r-26,"뱉기!","#f9a8d4");spawnBlast(target.x,target.y,38,"#f9a8d4");}}
      else{target.vx=rand(-80,80);target.vy=rand(-80,80);}
      return true;
