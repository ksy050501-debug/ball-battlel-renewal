name: Apply Kirby v197 patch

on:
  push:
    paths:
      - '.github/workflows/kirby-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/kirby_patch_v197.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v197</title>' in s
          assert 'id:"kirby"' in s
          assert 'neutralMax:2' in s
          assert 'inhaleCone:Math.PI*2/3' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('script block missing')
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=2500 --dump-dom "file://$PWD/index.html" >/tmp/kirby-dom.txt
            grep -q '볼배틀 리뉴얼 v197' /tmp/kirby-dom.txt
            grep -q '커비' /tmp/kirby-dom.txt
          fi
      - name: Commit patch and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/kirby-patch.yml .github/kirby_patch_v197.py
          git add -A
          git commit -m "v197: add Kirby copy and neutral monster system"
          git push
