name: Ball Battle v46 hotfix

on:
  push:
    paths:
      - '.github/workflows/ball-battle-hotfix-v46.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python .github/ball-battle-hotfix-v46.py
      - name: Commit hotfix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'chatgpt-hotfix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix simultaneous contact attacks and Hulk naming'
          git push
