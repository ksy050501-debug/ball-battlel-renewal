name: Apply single full test 50 once

on:
  push:
    paths:
      - '.github/workflows/sim-50-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          reps = [
            ('<title>볼배틀 리뉴얼 v218</title>', '<title>볼배틀 리뉴얼 v219</title>'),
            ('id="quickSimAll30Btn"', 'id="quickSimAll50Btn"'),
            ('function runQuickSimAll30() {\n      runQuickSimAllCount(30);\n    }', 'function runQuickSimAll50() {\n      runQuickSimAllCount(50);\n    }'),
            ('$("quickSimAll30Btn").addEventListener("click", runQuickSimAll30);', '$("quickSimAll50Btn").addEventListener("click", runQuickSimAll50);'),
            ('1인 전체 테스트는 선택한 1명을 나머지 전원과 각각 30전, 전체 테스트는 모든 조합을 각각 30전, 1대1 100전은 선택한 2명을 100전 시뮬레이션합니다.', '1인 전체 테스트는 선택한 1명을 나머지 전원과 각각 50전, 전체 테스트는 모든 조합을 각각 30전, 1대1 100전은 선택한 2명을 100전 시뮬레이션합니다.'),
          ]
          for old, new in reps:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly 1 match for {old[:60]!r}, got {n}')
              s = s.replace(old, new, 1)
          marker = '      const patchNotes = [\n'
          note = '      "v219: 1인 전체 테스트의 상대별 시뮬레이션 횟수를 30전에서 50전으로 상향. 전체 테스트 30전과 1대1 100전은 유지.",\n'
          if marker not in s:
              raise SystemExit('patchNotes marker not found')
          s = s.replace(marker, marker + note, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sim-50-once.yml
          git add index.html
          git commit -m "v219: raise single full test to 50 matches"
          git push origin main
