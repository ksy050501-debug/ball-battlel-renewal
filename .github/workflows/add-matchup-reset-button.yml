name: Apply matchup reset patch

on:
  push:
    paths:
      - '.github/workflows/add-matchup-reset-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python3 .tmp_patch_reset.py
      - name: Validate
        run: |
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/ball-battle.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', s, re.S)), encoding='utf-8')"
          node --check /tmp/ball-battle.js
          grep -q 'id="resetMatchupBtn"' index.html
          grep -q '볼배틀 리뉴얼 v138' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-matchup-reset-button.yml .tmp_patch_reset.py
          git add index.html
          git diff --cached --check
          git commit -m "Add matchup history reset button"
          git push origin HEAD:main
