name: Add matchup reset button

on:
  push:
    paths:
      - '.github/workflows/add-matchup-reset-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          if '볼배틀 리뉴얼 v137' not in s:
              raise SystemExit('v137 marker missing')
          s=s.replace('볼배틀 리뉴얼 v137','볼배틀 리뉴얼 v138',1)

          old='''      <div class="button-row" style="width:min(700px,100%);grid-template-columns:1fr;">
        <button class="ghost" id="copyMatchupBtn">전적 복사</button>
      </div>'''
          new='''      <div class="button-row" style="width:min(700px,100%);">
        <button class="ghost" id="copyMatchupBtn">전적 복사</button>
        <button class="danger" id="resetMatchupBtn">전적 리셋</button>
      </div>'''
          if s.count(old)!=1:
              raise SystemExit(f'button row marker expected 1, found {s.count(old)}')
          s=s.replace(old,new,1)

          old='''    $("copyMatchupBtn").addEventListener("click", copyMatchupHistory);'''
          new='''    $("copyMatchupBtn").addEventListener("click", copyMatchupHistory);
    $("resetMatchupBtn").addEventListener("click", resetMatchupHistory);'''
          if s.count(old)!=1:
              raise SystemExit(f'copy listener marker expected 1, found {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/ball-battle.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/ball-battle.js
          grep -q 'id="resetMatchupBtn"' index.html
          grep -q 'resetMatchupBtn").addEventListener' index.html
          grep -q '볼배틀 리뉴얼 v138' index.html

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-matchup-reset-button.yml
          git add index.html
          git diff --cached --check
          git commit -m "Add matchup history reset button"
          git push origin HEAD:main
