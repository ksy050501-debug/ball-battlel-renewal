name: Diagnose Mario simulation

on:
  push:
    paths:
      - '.github/workflows/diag-mario-sim.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostic page
        run: |
          cat > /tmp/diag.js <<'JS'
          setTimeout(async()=>{
            const out=[];
            const mario=characterById('mario_plumber');
            const opponents=battleRosterCharacters().filter(c=>c.id!==mario.id);
            const prev=beginFastSim('diag-full30');
            const totalStart=performance.now();
            try{
              for(let i=0;i<opponents.length;i++){
                const opp=opponents[i];
                const start=performance.now();
                try{
                  const r=await simulateQuickPair([opp,mario],30,'diag '+opp.id);
                  out.push({i:i+1,opp:opp.id,ms:Math.round(performance.now()-start),avgTime:r.avgTime,a:r.aWins,b:r.bWins,d:r.drawCount,total:r.aWins+r.bWins+r.drawCount});
                }catch(e){
                  out.push({i:i+1,opp:opp.id,ms:Math.round(performance.now()-start),error:String(e&&e.stack||e)});
                  break;
                }
                await new Promise(r=>setTimeout(r,0));
              }
            }finally{
              endFastSim(prev);
            }
            out.push({done:true,totalMs:Math.round(performance.now()-totalStart),history:out.length});
            const pre=document.createElement('pre');pre.id='diagResult';pre.textContent=JSON.stringify(out);document.body.appendChild(pre);
          },50);
          JS
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='    requestAnimationFrame(loop);'
          diag=Path('/tmp/diag.js').read_text(encoding='utf-8')
          if marker not in s: raise SystemExit('marker missing')
          Path('/tmp/diag.html').write_text(s.replace(marker,diag+'\n'+marker,1),encoding='utf-8')
          PY
      - name: Run full 30 benchmark
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=300000 --dump-dom file:///tmp/diag.html > /tmp/diag-dom.txt
          python3 - <<'PY'
          import re, html
          s=open('/tmp/diag-dom.txt',encoding='utf-8').read()
          m=re.search(r'<pre id="diagResult">(.*?)</pre>',s,re.S)
          if not m:
              print(s[-5000:])
              raise SystemExit('diagnostic result missing')
          print('DIAG_RESULT='+html.unescape(m.group(1)))
          PY
