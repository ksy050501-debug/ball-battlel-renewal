name: Diagnose Mario simulation

on:
  push:
    paths:
      - '.github/workflows/diag-mario-sim.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostic page
        run: |
          cat > /tmp/diag.js <<'JS'
          setTimeout(async()=>{
            const out=[];
            async function runOne(aId,bId){
              const a=characterById(aId), b=characterById(bId);
              const prev=beginFastSim('diag');
              try{
                setArenaSize(2);
                prepareBattleState();
                teamState=null;
                const positions=spawnPositions(2);
                fighters=[a,b].map((c,i)=>makeFighter(c,positions[i],i));
                let guard=0;
                while(running&&!ended&&battleTime<500&&guard<20000){
                  update(0.033);
                  guard++;
                  if(guard%600===0) await new Promise(r=>setTimeout(r,0));
                }
                out.push({
                  pair:aId+' vs '+bId,
                  guard,
                  battleTime,
                  running,
                  ended,
                  winnerId:quickWinnerLabel([a,b]),
                  alive:fighters.filter(f=>f.alive&&!f.isSummon).map(f=>({name:f.name,baseId:f.baseId,id:f.id,hp:f.hp,mario:!!f.mario,kart:!!f.mario?.kart,pipe:f.mario?.pipeTransit?.phase||null})),
                  all:fighters.map(f=>({name:f.name,baseId:f.baseId,id:f.id,isSummon:!!f.isSummon,alive:f.alive,hp:f.hp,marioBlock:!!f.marioBlock}))
                });
              }catch(e){
                out.push({pair:aId+' vs '+bId,error:String(e&&e.stack||e)});
              }finally{
                endFastSim(prev);
              }
            }
            await runOne('spider_man','mario_plumber');
            await runOne('logo_doctor','mario_plumber');
            await runOne('captain','mario_plumber');
            await runOne('spider_man','conan');
            const pre=document.createElement('pre');
            pre.id='diagResult';
            pre.textContent=JSON.stringify(out);
            document.body.appendChild(pre);
          },50);
          JS
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='    requestAnimationFrame(loop);'
          diag=Path('/tmp/diag.js').read_text(encoding='utf-8')
          if marker not in s:
              raise SystemExit('marker missing')
          s=s.replace(marker,diag+'\n'+marker,1)
          Path('/tmp/diag.html').write_text(s,encoding='utf-8')
          PY
      - name: Run headless browser diagnostic
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=45000 --dump-dom file:///tmp/diag.html > /tmp/diag-dom.txt
          python3 - <<'PY'
          import re, html
          s=open('/tmp/diag-dom.txt',encoding='utf-8').read()
          m=re.search(r'<pre id="diagResult">(.*?)</pre>',s,re.S)
          if not m:
              print(s[-4000:])
              raise SystemExit('diagnostic result missing')
          print('DIAG_RESULT='+html.unescape(m.group(1)))
          PY
