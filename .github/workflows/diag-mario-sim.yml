name: Diagnose Mario simulation

on:
  push:
    paths:
      - '.github/workflows/diag-mario-sim.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostic page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          s=Path('index.html').read_text(encoding='utf-8')
          marker='    requestAnimationFrame(loop);'
          diag=base64.b64decode('CiAgICBzZXRUaW1lb3V0KGFzeW5jKCk9PnsKICAgICAgY29uc3Qgb3V0PVtdOwogICAgICBhc3luYyBmdW5jdGlvbiBydW5PbmUoYUl  pZDpmLmlkLGhwOmYuaHAsbWFyaW86ISFmLm1hcmlvLGthcnQ6ISFmLm1hcmlvPy5rYXJ0LHBpcGU6Zi5tYXJpbz8ucGlwZVRyYW5zaXQ/LnBoYXNlfHxudWxsfSkpOwogICAgICAgICAgb3V0LnB1c2goe3BhaXI6YUl kKycgdnMgJytiSWQsZ3VhcmQsYmF0dGxlVGltZSxydW5uaW5nLGVuZGVkLHdpbm5lcklkOnF1aWNrV2lubmVyTGFiZWwoW2EsYl0pLGFsaXZlLGFsbDpmaWdodGVycy5tYXAoZj0+KHtuYW1lOmYubmFtZSxiYXNlSWQ6Zi5iYXNlSWQsaWQ6Zi5pZCxpc1N1bW1vbjohIWYuaXNTdW1tb24sYWxpdmU6Zi5hbGl2ZSxocDp mLmhwLG1hcmlvQmxvY2s6ISFmLm1hcmlvQmxvY2t9KX0pKTsKICAgICAgICB9Y2F0Y2goZSl7b3V0LnB1c2goe3BhaXI6YUl '.replace(/ /g,'')).decode()
          if marker not in s: raise SystemExit('marker missing')
          s=s.replace(marker,diag+'\n'+marker,1)
          Path('/tmp/diag.html').write_text(s,encoding='utf-8')
          PY
      - name: Run headless browser diagnostic
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=45000 --dump-dom file:///tmp/diag.html > /tmp/diag-dom.txt
          python3 - <<'PY'
          import re,html
          s=open('/tmp/diag-dom.txt',encoding='utf-8').read()
          m=re.search(r'<pre id="diagResult">(.*?)</pre>',s,re.S)
          if not m:
              print(s[-4000:])
              raise SystemExit('diagnostic result missing')
          print('DIAG_RESULT='+html.unescape(m.group(1)))
          PY
