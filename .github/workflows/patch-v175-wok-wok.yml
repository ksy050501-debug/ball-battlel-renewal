name: One-shot v175 WokWok

on:
  push:
    paths:
      - .github/workflows/patch-v175-wok-wok.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python3 .github/scripts/patch_v175_wok.py
      - name: JavaScript syntax check
        run: node --check /tmp/ballbattle.js
      - name: Verify patch
        run: |
          grep -q '볼배틀 리뉴얼 v175' index.html
          grep -q 'id:"wok_wok"' index.html
          grep -q 'function wokWokContact' index.html
          grep -q 'wokBloodSpeed' index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/patch-v175-wok-wok.yml .github/scripts/patch_v175_wok.py
          git add index.html
          git commit -m 'Add WokWok blood hunt fighter v175'
          git push
