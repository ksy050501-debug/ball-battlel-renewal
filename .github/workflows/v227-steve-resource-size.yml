name: Apply v227 Steve resource size patch

on:
  push:
    paths:
      - '.github/workflows/v227-steve-resource-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch Steve resource size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,label):
              global s
              c=s.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1, found {c}')
              s=s.replace(old,new,1)
          rep('볼배틀 리뉴얼 v226','볼배틀 리뉴얼 v227','title')
          rep('pickupBonus:24, resourceRadius:10, resourceSpawnDelay:1,','pickupBonus:24, resourceRadius:14, resourceSpawnDelay:1,','resource radius')
          old='ctx.fillRect(-9,-9,18,18);ctx.strokeRect(-9,-9,18,18);ctx.globalAlpha=.55;ctx.fillStyle="#fff";ctx.fillRect(-5,-5,4,4);ctx.fillRect(2,1,4,4);ctx.restore();ctx.save();ctx.font="900 10px system-ui";ctx.textAlign="center";ctx.fillStyle=info.color;ctx.strokeStyle="rgba(0,0,0,.8)";ctx.lineWidth=3;ctx.strokeText(info.name,r.x,r.y-16);ctx.fillText(info.name,r.x,r.y-16);'
          new='ctx.fillRect(-r.r,-r.r,r.r*2,r.r*2);ctx.strokeRect(-r.r,-r.r,r.r*2,r.r*2);ctx.globalAlpha=.55;ctx.fillStyle="#fff";ctx.fillRect(-r.r*.55,-r.r*.55,5,5);ctx.fillRect(r.r*.15,r.r*.1,5,5);ctx.restore();ctx.save();ctx.font="900 10px system-ui";ctx.textAlign="center";ctx.fillStyle=info.color;ctx.strokeStyle="rgba(0,0,0,.8)";ctx.lineWidth=3;ctx.strokeText(info.name,r.x,r.y-r.r-7);ctx.fillText(info.name,r.x,r.y-r.r-7);'
          rep(old,new,'resource drawing')
          marker='      "v226: 스티브 다이아 장비 이후 인챈트 북 추가.'
          if marker not in s:
              # tolerate current exact wording by inserting before first v226 note
              marker='      "v226:'
          idx=s.find(marker)
          if idx<0: raise SystemExit('v226 patch note marker missing')
          note='      "v227: 스티브 자원 크기 확대. 나무·돌·철·다이아 자원의 판정 반경을 10→14로 확대하고 화면 표시 크기도 판정 반경과 동일하게 키움. 기존 습득 보너스 +24, 채굴시간, 필요 자원 수, 전투 수치는 유지.",\n'
          s=s[:idx]+note+s[idx:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script block missing')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit v227
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v227-steve-resource-size.yml
          git add index.html .github/workflows/v227-steve-resource-size.yml
          git commit -m 'v227: enlarge Steve resources'
          git push
