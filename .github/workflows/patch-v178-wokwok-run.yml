name: Run v178 WokWok patch
on:
  push:
    paths:
      - '.github/workflows/patch-v178-wokwok-run.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_v178_wokwok.py
      - name: Syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('no script blocks')
          Path('/tmp/ballbattle.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/ballbattle.js
          git diff --check
      - name: Commit
        run: |
          rm -f .github/scripts/patch_v178_wokwok.py
          rm -f .github/workflows/patch-v178-wokwok-run.yml
          rm -f .github/workflows/patch-v178-wokwok-bloodhunt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/patch_v178_wokwok.py .github/workflows/patch-v178-wokwok-run.yml .github/workflows/patch-v178-wokwok-bloodhunt.yml
          git commit -m 'Enhance WokWok blood hunt sustain v178'
          git push origin main
