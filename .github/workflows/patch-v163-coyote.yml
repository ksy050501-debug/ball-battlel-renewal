name: One-shot v163 CoyoteD patch

on:
  push:
    paths:
      - '.github/workflows/patch-v163-coyote.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def one(old,new,label):
              global s
              c=s.count(old)
              if c!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {c}')
              s=s.replace(old,new,1)

          one('<title>볼배틀 리뉴얼 v162</title>','<title>볼배틀 리뉴얼 v163</title>','title')
          one('<h1 id="mainTitle">볼배틀 리뉴얼 v162</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v163</h1>','main title')

          dummy='      { id: "dummy_unit", name: "훈련용 더미", mark: "木", role: "더미", color: "#9ca3af", hp: 500, attack: 0, speed: 2.35, range: 0, simOnly: true,'
          if dummy not in s: raise SystemExit('dummy anchor missing')
          card='''      { id:"coyote_d", name:"코요테드", mark:"☣", role:"게임", color:"#8b5a2b", hp:170, attack:0, speed:2.9, range:0,\n        skillName:"독방구 · 뒤로 넘기기", condition:"이동 경로에 3초 독방구 · 접촉 시 8피해 후 상대를 뒤로 넘김", desc:"신지도를 모티브로 한 교란형 캐릭터. 이동한 자리에 잠시 독방구 흔적을 남겨 적에게 지속 피해를 주고, 직접 부딪히면 피해를 준 뒤 자신의 진행방향 뒤쪽으로 상대를 넘겨 위치를 흐트러뜨린다." },\n'''
          s=s.replace(dummy,card+dummy,1)

          anchor='    function initCaptain(f) {'
          if anchor not in s: raise SystemExit('initCaptain anchor missing')
          code=r'''    const COYOTE = {
      trailLife:3, trailEvery:.18, trailRadius:24, trailDamage:1, trailTick:.5,
      contactDamage:8, contactCooldown:1, flipGap:10
    };
    let coyoteTrails = [];
    function initCoyote(f){
      f.coyote={trailCd:0,contactCd:new Map(),dirX:1,dirY:0};
    }
    function updateCoyote(f,dt){
      if(!f.coyote)return;
      const c=f.coyote;
      for(const [id,cd] of c.contactCd){const n=cd-dt;if(n<=0)c.contactCd.delete(id);else c.contactCd.set(id,n);}
      const sp=Math.hypot(f.vx,f.vy);
      if(sp>.5){c.dirX=f.vx/sp;c.dirY=f.vy/sp;}
      if(!f.alive)return;
      c.trailCd-=dt;
      while(c.trailCd<=0){
        coyoteTrails.push({owner:f,x:f.x,y:f.y,life:COYOTE.trailLife});
        c.trailCd+=COYOTE.trailEvery;
      }
    }
    function updateCoyoteTrails(dt){
      coyoteTrails.forEach(t=>t.life-=dt);
      coyoteTrails=coyoteTrails.filter(t=>t.life>0);
      fighters.forEach(target=>{
        target.coyotePoisonCd=Math.max(0,(target.coyotePoisonCd||0)-dt);
        if(!target.alive||target.coyotePoisonCd>0)return;
        const hit=coyoteTrails.find(t=>t.owner&&t.owner!==target&&areEnemies(t.owner,target)&&Math.hypot(target.x-t.x,target.y-t.y)<=COYOTE.trailRadius+target.r);
        if(!hit)return;
        const dealt=damage(target,COYOTE.trailDamage,hit.owner,"독방구");
        if(dealt>0){target.coyotePoisonCd=COYOTE.trailTick;if(!fastSimMode)spawnParticles(target.x,target.y,"#84cc16",3);}
      });
    }
    function coyoteContact(f,target){
      if(!f?.coyote||!f.alive||!target?.alive||!areEnemies(f,target))return false;
      if(target.duelMonster||target.marioBlock)return false;
      const key=target.id;
      if((f.coyote.contactCd.get(key)||0)>0)return false;
      f.coyote.contactCd.set(key,COYOTE.contactCooldown);
      const dealt=damage(target,COYOTE.contactDamage,f,"코요테드 넘기기");
      if(dealt<=0||!target.alive)return false;
      const dx=f.coyote.dirX||1,dy=f.coyote.dirY||0;
      const gap=f.r+target.r+COYOTE.flipGap;
      target.x=clamp(f.x-dx*gap,arena.x+target.r,arena.x2-target.r);
      target.y=clamp(f.y-dy*gap,arena.y+target.r,arena.y2-target.r);
      // 강펀치·파워스톤·기타 강제이동과의 충돌 버그를 막기 위해 대상 vx/vy와 예약 타격 상태는 건드리지 않는다.
      if(!fastSimMode){spawnHitFlash(target.x,target.y,"#bef264",42);spawnFloatingText(target.x,target.y-target.r-24,"뒤로 넘기기!","#d9f99d");}
      return true;
    }
    function drawCoyoteTrails(){
      if(fastSimMode)return;
      coyoteTrails.forEach(t=>{const a=Math.max(0,Math.min(.30,t.life/COYOTE.trailLife*.30));ctx.save();ctx.globalAlpha=a;ctx.fillStyle="#65a30d";ctx.beginPath();ctx.arc(t.x,t.y,COYOTE.trailRadius,0,Math.PI*2);ctx.fill();ctx.globalAlpha=a*.75;ctx.fillStyle="#bef264";ctx.beginPath();ctx.arc(t.x-6,t.y-4,5,0,Math.PI*2);ctx.arc(t.x+7,t.y+3,4,0,Math.PI*2);ctx.fill();ctx.restore();});
    }
    function drawCoyoteCharacter(f){
      ctx.save();ctx.translate(f.x,f.y);
      ctx.fillStyle="#8b5a2b";ctx.strokeStyle="#3f2a16";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle="#6b4423";ctx.beginPath();ctx.moveTo(-12,-12);ctx.lineTo(-7,-28);ctx.lineTo(-1,-11);ctx.fill();ctx.beginPath();ctx.moveTo(12,-12);ctx.lineTo(7,-28);ctx.lineTo(1,-11);ctx.fill();
      ctx.fillStyle="#d6b07a";ctx.beginPath();ctx.ellipse(8,5,13,8,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(18,4,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-5,-4,2.5,0,Math.PI*2);ctx.fill();
      ctx.restore();if(!f.portraitOnly){drawHealthBar(f);drawName(f);}
    }

'''
          s=s.replace(anchor,code+anchor,1)

          one('      if (c.id === "captain") initCaptain(fighter);','      if (c.id === "captain") initCaptain(fighter);\n      if (c.id === "coyote_d") initCoyote(fighter);','init hook')
          one('      updateTano(f, dt);\n      updateCaptain(f, dt);\n      updateJabami(f, dt);','      updateTano(f, dt);\n      updateCaptain(f, dt);\n      updateCoyote(f, dt);\n      updateJabami(f, dt);','fighter update hook')
          one('        updateCaptainShields(sub);\n        updateHintaBalls(sub);','        updateCaptainShields(sub);\n        updateCoyoteTrails(sub);\n        updateHintaBalls(sub);','global update hook')
          one('      drawCaptainShields();\n      drawHintaBalls();','      drawCaptainShields();\n      drawCoyoteTrails();\n      drawHintaBalls();','draw trail hook')
          one('      if (f.newhello) { drawNewhelloCharacter(f); return; }','      if (f.newhello) { drawNewhelloCharacter(f); return; }\n      if (f.coyote) { drawCoyoteCharacter(f); return; }','draw fighter hook')
          one('              if (a.baseId === "prism_iris") applyIrisPrismChargeContact(a, b);\n              if (b.baseId === "prism_iris") applyIrisPrismChargeContact(b, a);','              if (a.baseId === "prism_iris") applyIrisPrismChargeContact(a, b);\n              if (b.baseId === "prism_iris") applyIrisPrismChargeContact(b, a);\n              coyoteContact(a, b);\n              coyoteContact(b, a);','collision hook')

          reset='      captainShields = [];\n      duelBreaths = [];'
          c=s.count(reset)
          if c!=2: raise SystemExit(f'reset hook expected 2, got {c}')
          s=s.replace(reset,'      captainShields = [];\n      coyoteTrails = [];\n      duelBreaths = [];')

          patch='      "v163: 신캐 코요테드 추가. HP170·이속2.9. 이동 경로에 3초간 남는 독방구 흔적을 생성하며 범위 안 적은 0.5초마다 피해1을 받는다. 상대 본체와 접촉하면 대상별 1초 쿨로 피해8을 준 뒤 코요테드의 진행방향 뒤쪽으로 넘긴다. 넘기기는 상대의 속도·강펀치/파워스톤 등 예약 타격·강제이동 상태를 지우지 않고 위치만 재배치해 접촉 공격 상호작용을 보존한다.",\n'
          one('      const patchNotes = [\n','      const patchNotes = [\n'+patch,'patch note')

          p.write_text(s,encoding='utf-8')
          PY
          node --check <(python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)))
          PY
          )
          git diff --check
          grep -q '볼배틀 리뉴얼 v163' index.html
          grep -q 'id:"coyote_d"' index.html
          grep -q 'contactDamage:8' index.html
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v163-coyote.yml
          git commit -m "Add CoyoteD poison trail and flip contact v163"
          git push
