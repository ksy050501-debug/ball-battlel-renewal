name: One-shot v163 CoyoteD patch

on:
  push:
    paths:
      - '.github/workflows/patch-v163-coyote.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,zlib
          data=(
          ''
          ''
          ''
          ''
          ''
          )
          open('/tmp/patch.py','wb').write(zlib.decompress(base64.b64decode(data)))
          PY
          python3 /tmp/patch.py
          node --check /tmp/check.js
          git diff --check
          grep -q '볼배틀 리뉴얼 v163' index.html
          grep -q 'id:"coyote_d"' index.html
          grep -q 'contactDamage:8' index.html
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v163-coyote.yml
          git commit -m "Add CoyoteD poison trail and flip contact v163"
          git push
