name: v132 Spider control nerf
on:
  push:
    paths:
      - '.github/workflows/v132_spider_nerf.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v132 Spider nerf
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v131</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v131</h1>' in s
          old='webKnock:105, webKnockDuration:.22, webSlow:.78, webSlowTime:.9, bindTime:1.6'
          new='webKnock:45, webKnockDuration:.22, webSlow:.90, webSlowTime:.9, bindTime:.9'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old_detail='if (c.id === "spider_man") return {damage:"웹슈터2×6 / 속박 연계 웹스윙 근접타격18",tick:"웹슈터5초마다6발(0.09초 간격) · 웹슈터 넉백 판정0.22초 · 그동안 벽충돌 시 속박1.6초→웹스윙 돌진",tip:"5초마다 웹슈터를 6연사한다. 각 탄은 피해2·약한 넉백·0.9초 22% 둔화를 준다. 웹슈터에 맞아 밀려나는 0.22초 안에 실제로 벽에 충돌한 경우에만 1.6초 속박되며, 예전에 맞은 뒤 한참 후 벽에 닿는 것은 속박되지 않는다. 속박 성공 시 해당 상대에게만 웹스윙 돌진을 사용해 근접타격18과 강한 넉백을 준다. 웹스윙 넉백으로 벽에 충돌해도 추가 피해는 없다. 자동·랜덤 웹스윙과 벽 부채꼴 연쇄 스윙은 없다."};'
          new_detail='if (c.id === "spider_man") return {damage:"웹슈터2×6 / 속박 연계 웹스윙 근접타격18",tick:"웹슈터5초마다6발(0.09초 간격) · 웹슈터 넉백 판정0.22초 · 그동안 벽충돌 시 속박0.9초→웹스윙 돌진",tip:"5초마다 웹슈터를 6연사한다. 각 탄은 피해2·약한 넉백·0.9초 10% 둔화를 준다. 웹슈터에 맞아 밀려나는 0.22초 안에 실제로 벽에 충돌한 경우에만 0.9초 속박되며, 예전에 맞은 뒤 한참 후 벽에 닿는 것은 속박되지 않는다. 속박 성공 시 해당 상대에게만 웹스윙 돌진을 사용해 근접타격18과 강한 넉백을 준다. 웹스윙 넉백으로 벽에 충돌해도 추가 피해는 없다. 자동·랜덤 웹스윙과 벽 부채꼴 연쇄 스윙은 없다."};'
          assert s.count(old_detail)==1, s.count(old_detail)
          s=s.replace(old_detail,new_detail,1)
          old_status="extraTextHtml:'<div class=\"status-skill-label\">웹슈터 5초마다 6연사 · 발당2·약넉백·0.9초 둔화</div><div class=\"status-skill-label\">웹슈터 넉백 중 벽에 충돌해야만 1.6초 속박 · 속박 성공 시 타게팅 웹스윙 돌진18+강넉백</div>'"
          new_status="extraTextHtml:'<div class=\"status-skill-label\">웹슈터 5초마다 6연사 · 발당2·약넉백·0.9초 10%둔화</div><div class=\"status-skill-label\">웹슈터 넉백 중 벽에 충돌해야만 0.9초 속박 · 속박 성공 시 타게팅 웹스윙 돌진18+강넉백</div>'"
          assert s.count(old_status)==1, s.count(old_status)
          s=s.replace(old_status,new_status,1)
          s=s.replace('<title>볼배틀 리뉴얼 v131</title>','<title>볼배틀 리뉴얼 v132</title>',1)
          s=s.replace('<h1 id="mainTitle">볼배틀 리뉴얼 v131</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v132</h1>',1)
          marker='      const patchNotes = [\n'
          assert marker in s
          note='      "v132: 거미남 웹슈터의 제어력을 낮췄습니다. 웹슈터 넉백을 105→45로 줄이고 둔화를 22%→10%(0.9초), 벽충돌 속박을 1.6초→0.9초로 줄였습니다. 웹슈터 6연사·발당 피해2·넉백 판정0.22초·속박 성공 시 웹스윙 돌진18+강넉백·HP170·이속2.9는 유지합니다.",\n'
          s=s.replace(marker,marker+note,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v132</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v132</h1>' in s
          assert 'webKnock:45, webKnockDuration:.22, webSlow:.90, webSlowTime:.9, bindTime:.9' in s
          assert '웹슈터2×6 / 속박 연계 웹스윙 근접타격18' in s
          assert '0.9초 10% 둔화' in s
          assert '속박0.9초→웹스윙 돌진' in s
          assert '웹스윙 넉백으로 벽에 충돌해도 추가 피해는 없다.' in s
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/ballbattle-v132.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/ballbattle-v132.js
          git diff --check
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-save >/dev/null 2>&1
      - name: Runtime smoke test
        run: |
          node <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-gpu']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.stack||e.message));
            await page.goto('file://'+process.cwd()+'/index.html',{waitUntil:'load'});
            const vals=await page.evaluate(()=>eval('({webKnock:SPIDER.webKnock,webSlow:SPIDER.webSlow,webSlowTime:SPIDER.webSlowTime,bindTime:SPIDER.bindTime,volleyCount:SPIDER.volleyCount,webDamage:SPIDER.webDamage,meleeDamage:SPIDER.meleeDamage})'));
            console.log('SPIDER',JSON.stringify(vals));
            if(vals.webKnock!==45||Math.abs(vals.webSlow-.90)>1e-9||vals.webSlowTime!==.9||vals.bindTime!==.9||vals.volleyCount!==6||vals.webDamage!==2||vals.meleeDamage!==18) throw new Error('Spider constants mismatch');
            await page.evaluate(()=>eval(`selected.clear(); selected.add('conan'); selected.add('spider_man'); renderAll(); startBattle();`));
            await new Promise(r=>setTimeout(r,700));
            const state=await page.evaluate(()=>eval('({running,fighterCount:fighters.length,battleTime,stateText:document.getElementById("stateText").textContent,overlay:document.getElementById("overlay").className})'));
            console.log('STATE',JSON.stringify(state),'errors',errors.length);
            if(errors.length||!state.running||state.fighterCount!==2||state.battleTime<.3||state.stateText!=='전투중'||state.overlay.includes('show')) throw new Error('runtime smoke failed '+JSON.stringify({state,errors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit v132
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'balance: nerf Spider web control v132'
          git push
