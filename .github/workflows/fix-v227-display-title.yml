name: Fix v227 displayed title

on:
  push:
    paths:
      - '.github/workflows/fix-v227-display-title.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix displayed title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<h1 id="mainTitle">볼배틀 리뉴얼 v223</h1>'
          new='<h1 id="mainTitle">볼배틀 리뉴얼 v227</h1>'
          if s.count(old)!=1:
              raise SystemExit(f'display title marker expected 1, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: update displayed title to v227'
          git push
