name: Apply v143 Koopa balance

# retry after patch-anchor fix
on:
  push:
    paths:
      - '.github/workflows/v143-koopa-balance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/v143_koopa_balance.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.find('<script>')
          end=s.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('script block not found')
          Path('/tmp/ballbattle-v143.js').write_text(s[start+8:end], encoding='utf-8')
          PY
          node --check /tmp/ballbattle-v143.js
          git diff --check

      - name: Verify intended markers
        run: |
          grep -q '볼배틀 리뉴얼 v143' index.html
          grep -q 'firePeriod:20' index.html
          grep -q 'target.koopa?.recovery > 0) amount \*= 2' index.html
          grep -q 'koopaEndShell(source);' index.html

      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/scripts/v143_koopa_balance.py .github/workflows/v143-koopa-balance.yml
          git commit -m 'v143: tune Koopa shell recovery and fire cooldown'
          git push origin main
