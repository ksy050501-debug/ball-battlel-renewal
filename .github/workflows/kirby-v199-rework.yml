name: Apply Kirby v199 rework

on:
  push:
    paths:
      - '.github/workflows/kirby-v199-rework.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Repair matcher and apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/kirby_v199.py')
          s=p.read_text(encoding='utf-8')
          old="sub(r'    function drawKirbyNeutral\\(f\\)\\{.*?\\n    \\}\\n    function drawKirbyCharacter',draw_neutral+'\\n    function drawKirbyCharacter','neutral art')"
          new="sub(r'    function drawKirbyNeutral\\(f\\)\\{.*?\\}\\n    function drawKirbyCharacter',draw_neutral+'\\n    function drawKirbyCharacter','neutral art')"
          if old not in s: raise SystemExit('neutral matcher line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 .github/scripts/kirby_v199.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          checks=['<title>볼배틀 리뉴얼 v199</title>','wanderAngle:rand(0,Math.PI*2)','fx.kind==="beam"','createRadialGradient','v199: 커비 비주얼·중립 몬스터 AI 재작업']
          missing=[x for x in checks if x not in s]
          assert not missing, missing
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/kirby-v199-rework.yml .github/scripts/kirby_v199.py
          git add index.html
          git commit -m 'v199: rework Kirby visuals and neutral wandering AI'
          git push
