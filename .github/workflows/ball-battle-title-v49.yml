name: Ball Battle v49 title hotfix

on:
  push:
    paths:
      - '.github/workflows/ball-battle-title-v49.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix main title
        run: python .github/ball-battle-title-v49.py
      - name: Commit title fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html was not changed'
            exit 1
          fi
          git config user.name 'chatgpt-title-hotfix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix visible version title to v49'
          git push
