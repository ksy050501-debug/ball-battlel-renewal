name: One-shot v174 Coyote contact buff

"on":
  push:
    paths:
      - '.github/workflows/patch-v174-coyote-contact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              if old not in s:
                  raise SystemExit('missing ' + label)
              s = s.replace(old, new, 1)

          one('<title>볼배틀 리뉴얼 v173</title>', '<title>볼배틀 리뉴얼 v174</title>', 'title')
          one('<h1 id="mainTitle">볼배틀 리뉴얼 v173</h1>', '<h1 id="mainTitle">볼배틀 리뉴얼 v174</h1>', 'heading')

          one(
              'contactDamage:8, contactCooldown:1, flingDuration:.42, flingGap:10,',
              'contactDamage:12, contactCooldown:1, flingDuration:.42, flingGap:10,',
              'coyote contact damage'
          )

          one(
              'condition:"이동 경로에 3초 독방구 · 접촉8+넘기기 · 30초 리안드리 · 60초 균열생성기 · 90초 라일라이"',
              'condition:"이동 경로에 3초 독방구 · 접촉12+넘기기 · 30초 리안드리 · 60초 균열생성기 · 90초 라일라이"',
              'coyote card text'
          )

          note = '      "v174: 코요테드 근접 보상 상향. 상대 본체와 접촉해 뒤로 넘기기에 성공할 때의 피해를 8→12로 상향했다. 대상별 접촉 쿨1초·0.42초 플링·독방구2/1초·리안드리1×3·균열생성기·라일라이·HP170·이속2.9는 유지.",\n'
          one('      const patchNotes = [\n', '      const patchNotes = [\n' + note, 'patch note')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          open('/tmp/check.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/check.js
          git diff --check
          grep -q '볼배틀 리뉴얼 v174' index.html
          grep -q 'contactDamage:12, contactCooldown:1' index.html
          grep -q '접촉12+넘기기' index.html
          grep -q 'v174: 코요테드 근접 보상 상향' index.html

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v174-coyote-contact.yml
          git commit -m "Buff CoyoteD contact fling damage v174"
          git push
