name: Apply v139 balance patch

on:
  push:
    paths:
      - '.github/workflows/v139-balance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          checks = [
              ('<title>볼배틀 리뉴얼 v138</title>', '<title>볼배틀 리뉴얼 v139</title>'),
              ('dashDamage:16, bleedDamage:1', 'dashDamage:15, bleedDamage:1'),
              ('shieldDamage: 10, heldReduction: 0.65', 'shieldDamage: 12, heldReduction: 0.65'),
              ('일반 광역 회전베기8 / 와이어 광역 강습16 + 출혈1×5회', '일반 광역 회전베기8 / 와이어 광역 강습15 + 출혈1×5회'),
          ]
          for old, new in checks:
              if s.count(old) != 1:
                  raise SystemExit(f'marker count {s.count(old)} for: {old}')
              s = s.replace(old, new, 1)

          # Patch-note trail: insert v139 ahead of v138 if a v138 entry exists; otherwise add ahead of the first visible version entry.
          note = '      "v139: 캡틴 성조 방패 투척 피해 10→12 상향. 뉴헬로 병장 와이어 광역 강습 피해 16→15 하향. 일반 회전베기8·출혈1×5·강펀치13·방패 밀어내기5 및 나머지 전투 수치는 유지.",\n'
          if '"v139:' not in s:
              idx = s.find('      "v138:')
              if idx < 0:
                  idx = s.find('      "v137:')
              if idx >= 0:
                  s = s[:idx] + note + s[idx:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/ball-battle.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'dashDamage:15, bleedDamage:1' in s
          assert 'shieldDamage: 12, heldReduction: 0.65' in s
          assert '와이어 광역 강습15' in s
          assert '<title>볼배틀 리뉴얼 v139</title>' in s
          PY
          node --check /tmp/ball-battle.js
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v139-balance.yml
          git add index.html
          git commit -m "Tune captain shield and sergeant wire damage"
          git push origin HEAD:main
