name: Apply Steve v224 patch

on:
  push:
    paths:
      - '.github/workflows/patch-steve-v224.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Steve v224
        run: python3 .github/scripts/patch_steve_v224.py

      - name: JavaScript syntax check
        run: |
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); b=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S); assert b; Path('/tmp/ballbattle.js').write_text(chr(10).join(b),encoding='utf-8')"
          node --check /tmp/ballbattle.js

      - name: Commit v224 and clean helpers
        run: |
          rm .github/scripts/patch_steve_v224.py
          rm .github/workflows/patch-steve-v224.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/patch_steve_v224.py .github/workflows/patch-steve-v224.yml
          git commit -m 'v224: Steve mining and progressive attack range'
          git push
