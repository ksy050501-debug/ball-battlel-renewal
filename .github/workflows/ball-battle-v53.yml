name: Ball Battle v53 Oshi anti-fan tuning

on:
  push:
    paths:
      - '.github/workflows/ball-battle-v53.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v53 Oshi tuning
        run: python .github/ball-battle-v53.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/ball-battle-v53.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/ball-battle-v53.js
      - name: Commit v53
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html was not changed'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Lower Oshi anti-fan wall damage'
          git push
