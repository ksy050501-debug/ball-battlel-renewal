name: One-shot v164 Coyote fling fix

on:
  push:
    paths:
      - '.github/workflows/patch-v164-coyote-fling.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def one(old,new,label):
              global s
              if old not in s: raise SystemExit('missing '+label)
              s=s.replace(old,new,1)

          one('<title>볼배틀 리뉴얼 v163</title>','<title>볼배틀 리뉴얼 v164</title>','title')
          one('<h1 id="mainTitle">볼배틀 리뉴얼 v163</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v164</h1>','heading')

          one('power:"none",shield:0,blockId:null,nextBlock:MARIO.blockDelay,blink:0,fireCd:0,fireShots:0,fireballs:[],starTime:0,starHits:{},starReturn:null,',
              'power:"none",shield:0,blockId:null,nextBlock:MARIO.blockDelay,blink:0,invulTextCd:0,fireCd:0,fireShots:0,fireballs:[],starTime:0,starHits:{},starReturn:null,','mario init')
          one('const m=f?.mario;if(!m||!f.alive)return;m.blink=Math.max(0,m.blink-dt);m.punchCd=Math.max(0,m.punchCd-dt);m.kartContactCd=Math.max(0,m.kartContactCd-dt);updateMarioFireballs(f,dt);',
              'const m=f?.mario;if(!m||!f.alive)return;m.blink=Math.max(0,m.blink-dt);m.invulTextCd=Math.max(0,(m.invulTextCd||0)-dt);m.punchCd=Math.max(0,m.punchCd-dt);m.kartContactCd=Math.max(0,m.kartContactCd-dt);updateMarioFireballs(f,dt);','mario cooldown tick')
          one('if(m.power==="star"||m.blink>0){if(!fastSimMode)spawnFloatingText(f.x,f.y-f.r-20,"무적","#fde047");return 0;}',
              'if(m.power==="star"||m.blink>0){if(!fastSimMode&&(m.invulTextCd||0)<=0){spawnFloatingText(f.x,f.y-f.r-20,"무적","#fde047");m.invulTextCd=.65;}return 0;}','mario invul text')

          one('trailLife:3, trailEvery:.18, trailRadius:24, trailDamage:1, trailTick:.5,\n      contactDamage:8, contactCooldown:1, flipGap:10',
              'trailLife:3, trailEvery:.18, trailRadius:24, trailDamage:1, trailTick:.5,\n      contactDamage:8, contactCooldown:1, flingDuration:.42, flingGap:10','coyote constants')

          pat=r'    function coyoteContact\(f,target\)\{.*?\n    \}\n    function drawCoyoteTrails\(\)\{'
          repl='''    function coyoteContact(f,target){
      if(!f?.coyote||!f.alive||!target?.alive||!areEnemies(f,target))return false;
      if(target.duelMonster||target.marioBlock||target.coyoteFling)return false;
      const key=target.id;
      if((f.coyote.contactCd.get(key)||0)>0)return false;
      f.coyote.contactCd.set(key,COYOTE.contactCooldown);
      const dealt=damage(target,COYOTE.contactDamage,f,"코요테드 넘기기");
      if(dealt<=0||!target.alive)return false;
      const dx=f.coyote.dirX||1,dy=f.coyote.dirY||0;
      const gap=f.r+target.r+COYOTE.flingGap;
      const endX=clamp(f.x-dx*gap,arena.x+target.r,arena.x2-target.r);
      const endY=clamp(f.y-dy*gap,arena.y+target.r,arena.y2-target.r);
      target.coyoteFling={sourceId:f.id,t:0,duration:COYOTE.flingDuration,startX:target.x,startY:target.y,overX:f.x,overY:f.y,endX,endY};
      // 강펀치·파워스톤 등의 예약 공격과 vx/vy는 지우지 않는다. 넘기기 애니메이션 동안 충돌 위치만 별도로 제어한다.
      if(!fastSimMode){spawnHitFlash(target.x,target.y,"#bef264",42);spawnFloatingText(target.x,target.y-target.r-24,"뒤로 넘기기!","#d9f99d");}
      return true;
    }
    function updateCoyoteFlings(dt){
      fighters.forEach(target=>{
        const q=target.coyoteFling;if(!q)return;
        if(!target.alive){target.coyoteFling=null;return;}
        q.t=Math.min(q.duration,q.t+dt);
        const p=clamp(q.t/Math.max(.001,q.duration),0,1),u=1-p;
        target.x=u*u*q.startX+2*u*p*q.overX+p*p*q.endX;
        target.y=u*u*q.startY+2*u*p*q.overY+p*p*q.endY;
        if(q.t>=q.duration){target.x=q.endX;target.y=q.endY;target.coyoteFling=null;if(!fastSimMode)spawnParticles(target.x,target.y,"#d9f99d",6);}
      });
    }
    function drawCoyoteTrails(){'''
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('coyote contact block replacement failed')

          one('fighters.forEach(f => updateFighter(f, sub));\n        handleCircleCollisions(sub);',
              'fighters.forEach(f => updateFighter(f, sub));\n        updateCoyoteFlings(sub);\n        handleCircleCollisions(sub);','fling update loop')
          one('if (!a.alive || (a.dodoVoid || 0) > 0 || a.punchHold > 0 || a.logo?.jump?.phase === "flight" || (a.mario?.pipeTransit && a.mario.pipeTransit.phase!=="approach")) continue;',
              'if (!a.alive || (a.dodoVoid || 0) > 0 || a.punchHold > 0 || a.coyoteFling || a.logo?.jump?.phase === "flight" || (a.mario?.pipeTransit && a.mario.pipeTransit.phase!=="approach")) continue;','collision a')
          one('if (!b.alive || (b.dodoVoid || 0) > 0 || b.punchHold > 0 || b.logo?.jump?.phase === "flight" || (b.mario?.pipeTransit && b.mario.pipeTransit.phase!=="approach")) continue;',
              'if (!b.alive || (b.dodoVoid || 0) > 0 || b.punchHold > 0 || b.coyoteFling || b.logo?.jump?.phase === "flight" || (b.mario?.pipeTransit && b.mario.pipeTransit.phase!=="approach")) continue;','collision b')

          one('condition:"이동 경로에 3초 독방구 · 접촉 시 8피해 후 상대를 뒤로 넘김", desc:"신지도를 모티브로 한 교란형 캐릭터. 이동한 자리에 잠시 독방구 흔적을 남겨 적에게 지속 피해를 주고, 직접 부딪히면 피해를 준 뒤 자신의 진행방향 뒤쪽으로 상대를 넘겨 위치를 흐트러뜨린다."',
              'condition:"이동 경로에 3초 독방구 · 접촉 시 8피해 후 0.42초에 걸쳐 뒤로 넘김", desc:"신지도를 모티브로 한 교란형 캐릭터. 이동한 자리에 잠시 독방구 흔적을 남겨 적에게 지속 피해를 주고, 직접 부딪히면 피해를 준 뒤 상대를 자신의 몸 위로 넘겨 진행방향 뒤쪽에 착지시킨다."','coyote card')

          note='      "v164: 코요테드 뒤로 넘기기를 순간 좌표이동에서 0.42초짜리 실제 플링으로 변경. 접촉 지점에서 코요테드 몸 위를 지나 진행방향 뒤쪽에 착지하며 비행 중 재충돌은 막되 강펀치·파워스톤 등 예약 공격과 vx/vy 상태는 지우지 않는다. 스타배관공 등 무적 상태가 연속 피해 판정을 받을 때 무적 텍스트가 겹쳐 쌓이지 않도록 표시를 0.65초 간격으로 제한.",\n'
          one('      const patchNotes = [\n','      const patchNotes = [\n'+note,'patch note')

          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          open('/tmp/check.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/check.js
          git diff --check
          grep -q '볼배틀 리뉴얼 v164' index.html
          grep -q 'flingDuration:.42' index.html
          grep -q 'm.invulTextCd=.65' index.html
          grep -q 'updateCoyoteFlings(sub)' index.html
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v164-coyote-fling.yml
          git commit -m "Animate CoyoteD fling and throttle invul text v164"
          git push