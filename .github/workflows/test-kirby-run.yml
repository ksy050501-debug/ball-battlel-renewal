name: Run Kirby v198 patch

on:
  push:
    paths:
      - '.github/workflows/test-kirby-run.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract and apply prepared patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/kirby-v198.yml').read_text(encoding='utf-8')
          begin="          cat > /tmp/patch_kirby_v198.py <<'PY'\n"
          end="\n          PY\n          python3 /tmp/patch_kirby_v198.py"
          a=src.index(begin)+len(begin)
          b=src.index(end,a)
          block=src[a:b]
          out=[]
          for line in block.splitlines():
              out.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/patch_kirby_v198.py').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          python3 /tmp/patch_kirby_v198.py

      - name: Validate v198
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            '<title>볼배틀 리뉴얼 v198</title>',
            'inhalePeriod:10, inhaleDuration:3.2',
            'kirbyBombs',
            '커비 빔 채찍',
            '중립 소드 회전베기',
            'neutral.kirbyNeutral.recoil',
            '현재 존재하는 몬스터와 커비가 보유한 카피를 제외'
          ]
          missing=[x for x in checks if x not in s]
          assert not missing, missing
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js

      - name: Commit v198 and clean temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/kirby-v198.yml .github/workflows/kirby-v198-runner.yml .github/workflows/kirby-v198-exec.yml .github/workflows/test-kirby-run.yml
          git add index.html
          git commit -m 'v198: refine Kirby copy moves and neutral collisions'
          git push
