name: Ball Battle v65 Hinta tuning

on:
  push:
    paths:
      - '.github/ball-battle-v65.py'
      - '.github/workflows/ball-battle-v65.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v65 Hinta tuning
        run: python .github/ball-battle-v65.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>', s, re.I)
          js='\n'.join(scripts)
          Path('/tmp/ball-battle-inline.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/ball-battle-inline.js
      - name: Commit v65
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Tune Hinta for v65"
          git push
