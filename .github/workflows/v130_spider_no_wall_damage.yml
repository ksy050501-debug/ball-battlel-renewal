name: v130 Spider no wall damage
on:
  push:
    paths:
      - '.github/workflows/v130_spider_no_wall_damage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v130 patch
        run: python .github/scripts/v130_spider_no_wall_damage.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/ballbattle-v130.js').write_text(s[a:b], encoding='utf-8')
          PY
          node --check /tmp/ballbattle-v130.js
      - name: Validate diff
        run: git diff --check
      - name: Commit v130
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove Spider swing wall damage v130'
          git push
