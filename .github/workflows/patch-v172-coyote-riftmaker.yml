name: One-shot v172 Coyote Riftmaker

on:
  push:
    paths:
      - '.github/workflows/patch-v172-coyote-riftmaker.yml'
      - '.github/patch_v172_coyote_riftmaker.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch_v172_coyote_riftmaker.py
      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          open('/tmp/check.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/check.js
          git diff --check
          grep -q '볼배틀 리뉴얼 v172' index.html
          grep -q 'riftmakerAt:60, riftThreshold:10, riftHeal:3' index.html
          grep -q 'coyoteRecordDotDamage(owner,dealt)' index.html
          grep -q 'coyoteRecordDotDamage(source,dealt)' index.html
          grep -q '균열생성기 획득!' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v172-coyote-riftmaker.yml .github/patch_v172_coyote_riftmaker.py
          git commit -m "Add CoyoteD Riftmaker sustain v172"
          git push
