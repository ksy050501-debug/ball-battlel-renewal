name: One-shot v165 Coyote item growth

on:
  push:
    paths:
      - '.github/workflows/patch-v165-coyote-items.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch_v165.py
      - name: Validate
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          open('/tmp/check.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/check.js
          git diff --check
          grep -q '볼배틀 리뉴얼 v165' index.html
          grep -q 'liandryAt:30, liandryTicks:3, rylaiAt:90, rylaiSlowMult:.8' index.html
          grep -q '리안드리 잔류독' index.html
          grep -q 'coyotePoisonSlowMultiplier' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/patch_v165.py .github/workflows/patch-v165-coyote-items.yml
          git commit -m 'Add CoyoteD Liandry and Rylai growth v165'
          git push