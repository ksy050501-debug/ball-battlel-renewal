name: Apply v141 Bowser patch

on:
  push:
    paths:
      - '.github/workflows/v141-bowser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '볼배틀 리뉴얼 v140' not in s:
              raise SystemExit('v140 marker missing')
          if 'bowser_king' in s:
              raise SystemExit('bowser already exists')
          s=s.replace('볼배틀 리뉴얼 v140','볼배틀 리뉴얼 v141',1)

          mario_entry='''      { id:"mario_plumber", name:"배관공", mark:"M", role:"게임", color:"#ef4444", hp:160, attack:8, speed:2.8, range:0,\n        skillName:"랜덤박스 · 토관 · 배관공카트", condition:"랜덤박스 파워업 · 벽 50회마다 토관을 통해 기본↔카트 모드 전환", desc:"랜덤박스로 슈퍼·파이어·스타 상태를 오가며 싸운다. 벽 접촉 50회를 채우면 충돌한 벽의 초록 토관으로 느리게 들어가고, 무작위 벽의 토관에서 반대 모드로 나온다. 카트 모드에서는 바나나와 등껍질을 사용한다." },'''
          bowser_entry='''      { id:"bowser_king", name:"쿱하", mark:"♛", role:"게임", color:"#4d7c0f", hp:240, attack:0, speed:2.3, range:0,\n        skillName:"등껍질 돌진 · 회전 불기둥", condition:"등껍질11초·6초 지속·마지막3초 추적·종료3초 기절 · 불기둥9초·체력에 따라1~4개", desc:"거대한 몸집으로 전장을 압박한다. 주기적으로 등껍질에 들어가 고속 돌진하고, 맵 중앙을 축으로 회전하는 불기둥을 소환한다. 체력이 낮을수록 불기둥 수가 늘어난다." },'''
          if s.count(mario_entry)!=1:
              raise SystemExit(f'mario entry marker expected 1, found {s.count(mario_entry)}')
          s=s.replace(mario_entry,mario_entry+'\n'+bowser_entry,1)

          bowser_code=r'''
    const BOWSER = {
      shellPeriod:11, shellDuration:6, shellTrackStart:3, shellSpeedMult:1.9,
      shellDamage:14, shellKnock:560, shellHitCd:.65, wallDamage:8, wallWindow:1.25, selfStun:3,
      firePeriod:9, fireDuration:4.5, fireDamage:6, fireHitCd:.7, burnDamage:1, burnTicks:4, burnTick:1,
      fireTurn:Math.PI*105/180, fireWidth:12
    };
    function initBowser(f){
      f.bowser={shellCd:BOWSER.shellPeriod,shellTime:0,shellHitCd:new Map(),selfStun:0,
        fireCd:BOWSER.firePeriod,fireTime:0,fireAngle:rand(0,Math.PI*2),fireCount:1,fireHitCd:new Map(),
        baseSpeed:f.baseSpeed||f.speed||2.3};
      f.r=26;
    }
    function bowserFireCount(f){const ratio=f.maxHp>0?f.hp/f.maxHp:1;return ratio>.75?1:ratio>.5?2:ratio>.25?3:4;}
    function bowserStartShell(f){
      const b=f.bowser;b.shellTime=BOWSER.shellDuration;b.shellCd=BOWSER.shellPeriod;b.shellHitCd.clear();
      const mag=Math.hypot(f.vx,f.vy),target=nearestEnemy(f).enemy;
      const a=mag>1?Math.atan2(f.vy,f.vx):target?Math.atan2(target.y-f.y,target.x-f.x):rand(0,Math.PI*2);
      const v=b.baseSpeed*44*BOWSER.shellSpeedMult;f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-38,"등껍질 돌진!","#a3e635");playSound("dash",.95);}
    }
    function bowserStartFire(f){
      const b=f.bowser;b.fireTime=BOWSER.fireDuration;b.fireCd=BOWSER.firePeriod;b.fireCount=bowserFireCount(f);b.fireHitCd.clear();
      if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-42,`회전 불기둥 ×${b.fireCount}`,"#fb923c");playSound("fireball",1);}
    }
    function bowserRefreshBurn(target,source){
      target.bowserBurns=target.bowserBurns||[];
      let burn=target.bowserBurns.find(x=>x.sourceId===source.id);
      if(!burn){burn={sourceId:source.id,ticksLeft:BOWSER.burnTicks,next:BOWSER.burnTick};target.bowserBurns.push(burn);}
      else{burn.ticksLeft=BOWSER.burnTicks;burn.next=BOWSER.burnTick;}
    }
    function updateBowserBurns(f,dt){
      for(const target of fighters){
        const arr=target.bowserBurns;if(!arr?.length)continue;
        for(let i=arr.length-1;i>=0;i--){const burn=arr[i];if(burn.sourceId!==f.id)continue;
          if(!target.alive){arr.splice(i,1);continue;}burn.next-=dt;
          while(burn.next<=0&&burn.ticksLeft>0&&target.alive){damage(target,BOWSER.burnDamage,f,"쿱하 화상");burn.ticksLeft--;burn.next+=BOWSER.burnTick;}
          if(burn.ticksLeft<=0||!target.alive)arr.splice(i,1);
        }
      }
    }
    function updateBowserWallHits(f,dt){
      for(const target of fighters){const mark=target.bowserWallHit;if(!mark||mark.sourceId!==f.id)continue;
        mark.t-=dt;if(!target.alive||mark.t<=0){target.bowserWallHit=null;continue;}
        const hit=target.x-target.r<=arena.x+1.5||target.x+target.r>=arena.x2-1.5||target.y-target.r<=arena.y+1.5||target.y+target.r>=arena.y2-1.5;
        if(hit){damage(target,BOWSER.wallDamage,f,"등껍질 넉백 벽충돌");target.bowserWallHit=null;if(!fastSimMode){spawnHitFlash(target.x,target.y,"#fed7aa",48);playSound("impact",.8);}}
      }
    }
    function updateBowserFire(f,dt){
      const b=f.bowser;if(b.fireTime<=0)return;b.fireTime=Math.max(0,b.fireTime-dt);b.fireAngle=(b.fireAngle+BOWSER.fireTurn*dt)%(Math.PI*2);
      for(const [id,cd] of b.fireHitCd){const next=cd-dt;if(next<=0)b.fireHitCd.delete(id);else b.fireHitCd.set(id,next);}
      const cx=(arena.x+arena.x2)/2,cy=(arena.y+arena.y2)/2,len=arena.size*.76;
      for(const e of enemiesOf(f)){if(!e.alive||b.fireHitCd.has(e.id))continue;let touching=false;
        for(let i=0;i<b.fireCount;i++){const a=b.fireAngle+i*Math.PI*2/b.fireCount,dx=e.x-cx,dy=e.y-cy,along=dx*Math.cos(a)+dy*Math.sin(a),side=Math.abs(-dx*Math.sin(a)+dy*Math.cos(a));
          if(along>=-e.r&&along<=len+e.r&&side<=BOWSER.fireWidth+e.r){touching=true;break;}}
        if(touching){const dealt=damage(e,BOWSER.fireDamage,f,"회전 불기둥");if(dealt>0&&e.alive)bowserRefreshBurn(e,f);b.fireHitCd.set(e.id,BOWSER.fireHitCd);if(!fastSimMode)spawnHitFlash(e.x,e.y,"#fb923c",40);}
      }
    }
    function updateBowser(f,dt){
      const b=f?.bowser;if(!b)return;
      b.shellCd=Math.max(0,b.shellCd-dt);b.fireCd=Math.max(0,b.fireCd-dt);b.selfStun=Math.max(0,b.selfStun-dt);
      updateBowserBurns(f,dt);updateBowserWallHits(f,dt);
      if(!f.alive)return;
      if(b.fireTime>0)updateBowserFire(f,dt);else if(b.fireCd<=0)bowserStartFire(f);
      if(b.selfStun>0){f.vx=0;f.vy=0;return;}
      if(b.shellTime>0){
        b.shellTime=Math.max(0,b.shellTime-dt);
        if(f.stun>0){f.vx=0;f.vy=0;}else{
          let a=Math.hypot(f.vx,f.vy)>1?Math.atan2(f.vy,f.vx):rand(0,Math.PI*2);
          if(b.shellTime<=BOWSER.shellTrackStart){const t=nearestEnemy(f).enemy;if(t){const wanted=Math.atan2(t.y-f.y,t.x-f.x),delta=Math.atan2(Math.sin(wanted-a),Math.cos(wanted-a)),turn=4.2*dt;a+=clamp(delta,-turn,turn);}}
          const v=b.baseSpeed*44*BOWSER.shellSpeedMult;f.vx=Math.cos(a)*v;f.vy=Math.sin(a)*v;
        }
        if(b.shellTime<=0){b.selfStun=BOWSER.selfStun;f.stun=Math.max(f.stun||0,BOWSER.selfStun);f.vx=0;f.vy=0;if(!fastSimMode){spawnFloatingText(f.x,f.y-f.r-36,"돌진 종료 · 기절!","#fde68a");playSound("stun",.9);}}
        return;
      }
      if(b.shellCd<=0&&f.stun<=0)bowserStartShell(f);
    }
    function bowserContact(f,target){
      const b=f?.bowser;if(!b||b.shellTime<=0||!target?.alive||!areEnemies(f,target)||b.shellHitCd.has(target.id))return false;
      const dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy)||1,dealt=damage(target,BOWSER.shellDamage,f,"등껍질 돌진");
      b.shellHitCd.set(target.id,BOWSER.shellHitCd);
      if(dealt>0&&target.alive){target.vx=dx/d*BOWSER.shellKnock;target.vy=dy/d*BOWSER.shellKnock;target.bowserWallHit={sourceId:f.id,t:BOWSER.wallWindow};if(!fastSimMode){spawnHitFlash(target.x,target.y,"#bef264",58);spawnBlast(target.x,target.y,48,"#84cc16");playSound("impact",1);}}
      return dealt>0;
    }
    function drawBowserFireBars(f){
      const b=f.bowser;if(!b||b.fireTime<=0||fastSimMode||f.portraitOnly)return;const cx=(arena.x+arena.x2)/2,cy=(arena.y+arena.y2)/2,len=arena.size*.76;
      ctx.save();ctx.beginPath();ctx.rect(arena.x,arena.y,arena.size,arena.size);ctx.clip();
      for(let i=0;i<b.fireCount;i++){const a=b.fireAngle+i*Math.PI*2/b.fireCount;for(let r=14;r<len;r+=28){const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;ctx.shadowColor="#f97316";ctx.shadowBlur=14;ctx.fillStyle="#ea580c";ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fde68a";ctx.beginPath();ctx.arc(x-2,y-2,4.2,0,Math.PI*2);ctx.fill();}}
      ctx.restore();
    }
    function drawBowserCharacter(f){
      const b=f.bowser;drawBowserFireBars(f);ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.r/26,f.r/26);
      if(b?.shellTime>0){ctx.rotate(battleTime*8);ctx.fillStyle="#3f6212";ctx.strokeStyle="#1a2e05";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.stroke();for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.save();ctx.rotate(a);ctx.fillStyle="#f8fafc";ctx.beginPath();ctx.moveTo(16,-5);ctx.lineTo(31,0);ctx.lineTo(16,5);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}ctx.fillStyle="#65a30d";ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();}
      else{ctx.fillStyle="#65a30d";ctx.strokeStyle="#1a2e05";ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(-4,4,20,22,0,0,Math.PI*2);ctx.fill();ctx.stroke();for(let i=0;i<5;i++){const a=-1.15+i*.57;ctx.save();ctx.translate(-4+Math.cos(a)*15,4+Math.sin(a)*15);ctx.rotate(a);ctx.fillStyle="#f8fafc";ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(10,0);ctx.lineTo(0,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}ctx.fillStyle="#d97706";ctx.beginPath();ctx.ellipse(9,-9,15,13,-.2,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#f8fafc";ctx.beginPath();ctx.moveTo(4,-20);ctx.lineTo(2,-32);ctx.lineTo(10,-22);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(16,-19);ctx.lineTo(23,-30);ctx.lineTo(23,-17);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#fef3c7";ctx.beginPath();ctx.ellipse(13,-5,10,7,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(14,-12,2,0,Math.PI*2);ctx.fill();}
      ctx.restore();drawHealthBar(f);drawName(f);
    }
'''
          marker='\n    const MARIO = {'
          if s.count(marker)!=1:
              raise SystemExit(f'MARIO marker expected 1, found {s.count(marker)}')
          s=s.replace(marker,'\n'+bowser_code+marker,1)

          preview='        if (c.id === "mario_plumber") initMario(preview);'
          fighter='      if (c.id === "mario_plumber") initMario(fighter);'
          if s.count(preview)!=1 or s.count(fighter)!=1:
              raise SystemExit('init markers missing')
          s=s.replace(preview,preview+'\n        if (c.id === "bowser_king") initBowser(preview);',1)
          s=s.replace(fighter,fighter+'\n      if (c.id === "bowser_king") initBowser(fighter);',1)

          update='      if (f.mario) updateMario(f, dt);'
          if s.count(update)!=1: raise SystemExit('update hook marker missing')
          s=s.replace(update,update+'\n      if (f.bowser) updateBowser(f, dt);',1)

          collision='              captainContact(b, a);'
          if s.count(collision)!=1: raise SystemExit('collision hook marker missing')
          s=s.replace(collision,collision+'\n              bowserContact(a, b);\n              bowserContact(b, a);',1)

          draw='      if (f.mario) { drawMarioCharacter(f); return; }'
          if s.count(draw)!=1: raise SystemExit('draw hook marker missing')
          s=s.replace(draw,'      if (f.bowser) { drawBowserCharacter(f); return; }\n'+draw,1)

          status='    function skillProgressInfo(f) {\n      if(f.mario){'
          if s.count(status)!=1: raise SystemExit('status marker missing')
          bowser_status='''    function skillProgressInfo(f) {\n      if(f.bowser){\n        const b=f.bowser,fireText=b.fireTime>0?`불기둥 ${b.fireCount}개 · ${b.fireTime.toFixed(1)}초`:`불기둥 ${Math.max(0,b.fireCd).toFixed(1)}초`;\n        if(b.selfStun>0)return {ratio:1-b.selfStun/BOWSER.selfStun,className:"rage-fill",text:`돌진 후 기절 ${b.selfStun.toFixed(1)}초`,extraTextHtml:`<div class="status-skill-label">${fireText}</div>`};\n        if(b.shellTime>0)return {ratio:1-b.shellTime/BOWSER.shellDuration,className:"rage-fill",text:`등껍질 돌진 ${b.shellTime.toFixed(1)}초${b.shellTime<=BOWSER.shellTrackStart?" · 추적 중":""}`,extraTextHtml:`<div class="status-skill-label">접촉14 · 강넉백 · 벽충돌8</div><div class="status-skill-label">${fireText}</div>`};\n        return {ratio:clamp(1-Math.max(0,b.shellCd)/BOWSER.shellPeriod,0,1),className:"skill-fill",text:`등껍질 돌진 ${Math.max(0,b.shellCd).toFixed(1)}초`,extraTextHtml:`<div class="status-skill-label">${fireText}</div><div class="status-skill-label">HP ${Math.ceil(f.hp)}/${Math.ceil(f.maxHp)} · 다음 불기둥 ${bowserFireCount(f)}개</div>`};\n      }\n      if(f.mario){'''
          s=s.replace(status,bowser_status,1)

          m=re.search(r'    function characterDamageInfo\(c\) \{',s)
          if not m: raise SystemExit('characterDamageInfo marker missing')
          dmg='''\n      if(c.id==="bowser_king")return {damage:"등껍질 돌진14 + 강넉백 · 넉백 후 벽충돌8 · 회전 불기둥6 + 화상1×4",tick:"등껍질11초마다 · 6초 지속 · 마지막3초 추적 · 종료 후3초 기절 · 불기둥9초마다 · 4.5초 지속 · HP 75/50/25% 경계로1~4개",tip:"쿱하는 일반 캐릭터보다 큰 반경26으로 시작한다. 넉백 저항은 없으며, 등껍질 돌진이 끝나면 제자리에서 3초간 기절한다. 불기둥은 맵 중앙을 축으로 회전하고 같은 화상은 중첩되지 않고 4틱으로 갱신된다."};'''
          s=s[:m.end()]+dmg+s[m.end():]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate syntax and hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/ball-battle.js').write_text(scripts,encoding='utf-8')
          checks=['볼배틀 리뉴얼 v141','bowser_king','function initBowser','function updateBowser','function bowserContact','function drawBowserCharacter','hp:240','selfStun:3']
          for x in checks:
              if x not in s: raise SystemExit('missing '+x)
          PY
          node --check /tmp/ball-battle.js
          git diff --check

      - name: Smoke test Bowser in Chrome
        run: |
          cat > /tmp/bowser-smoke.js <<'JS'
          setTimeout(async()=>{
            const out=[];
            const bowser=characterById('bowser_king');
            const opps=['spider_man','tano','mario_plumber'].map(characterById);
            const prev=beginFastSim('bowser-smoke');
            try{
              for(const opp of opps){
                const r=await simulateQuickPair([opp,bowser],5,'bowser smoke '+opp.id);
                out.push({opp:opp.id,total:r.aWins+r.bWins+r.drawCount,a:r.aWins,b:r.bWins,d:r.drawCount});
              }
            }catch(e){out.push({error:String(e&&e.stack||e)});}finally{endFastSim(prev);}
            const pre=document.createElement('pre');pre.id='bowserSmoke';pre.textContent=JSON.stringify(out);document.body.appendChild(pre);
            window.requestAnimationFrame=()=>0;
          },50);
          JS
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8');marker='    requestAnimationFrame(loop);';diag=Path('/tmp/bowser-smoke.js').read_text()
          if marker not in s: raise SystemExit('raf marker missing')
          Path('/tmp/bowser.html').write_text(s.replace(marker,diag+'\n'+marker,1),encoding='utf-8')
          PY
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=120000 --dump-dom file:///tmp/bowser.html > /tmp/bowser-dom.txt
          python3 - <<'PY'
          import re,html,json
          s=open('/tmp/bowser-dom.txt',encoding='utf-8').read();m=re.search(r'<pre id="bowserSmoke">(.*?)</pre>',s,re.S)
          if not m: raise SystemExit('smoke result missing')
          data=json.loads(html.unescape(m.group(1)));print(data)
          if any('error' in x for x in data): raise SystemExit(str(data))
          if any(x.get('total')!=5 for x in data): raise SystemExit(str(data))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v141-bowser.yml
          git add index.html
          git diff --cached --check
          git commit -m "Add Kupha boss mechanics"
          git push origin HEAD:main
