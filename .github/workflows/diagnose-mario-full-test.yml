name: Apply plumber full-test crash fix

on:
  push:
    paths:
      - '.github/workflows/diagnose-mario-full-test.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # v137
          if '볼배틀 리뉴얼 v136' not in s:
              raise SystemExit('v136 title marker missing')
          s=s.replace('볼배틀 리뉴얼 v136','볼배틀 리뉴얼 v137')

          # Revert the v136 regression: yielding every 600 simulation updates made long plumber tests much slower.
          old='''          guard += 1;\n          if (guard % 600 === 0) {\n            await new Promise(resolve => setTimeout(resolve, 0));\n          }'''
          new='''          guard += 1;'''
          if s.count(old)!=1:
              raise SystemExit(f'guard-yield marker expected 1, found {s.count(old)}')
          s=s.replace(old,new,1)

          # Kart hazards can be cleared/replaced by a mode transition while a backwards loop still owns the old index.
          # Treat a missing slot as already removed instead of dereferencing it.
          old='''      for(let i=m.bananas.length-1;i>=0;i--){const b=m.bananas[i];b.ownerGrace=Math.max(0,(b.ownerGrace||0)-dt);const candidates=fighters.filter(e=>e.alive&&!e.isSummon&&!e.marioBlock&&(e===f||areEnemies(f,e)));'''
          new='''      for(let i=m.bananas.length-1;i>=0;i--){const b=m.bananas[i];if(!b){m.bananas.splice(i,1);continue;}b.ownerGrace=Math.max(0,(b.ownerGrace||0)-dt);const candidates=fighters.filter(e=>e.alive&&!e.isSummon&&!e.marioBlock&&(e===f||areEnemies(f,e)));'''
          if s.count(old)!=1:
              raise SystemExit(f'banana marker expected 1, found {s.count(old)}')
          s=s.replace(old,new,1)

          old='''      for(let i=m.shells.length-1;i>=0;i--){const sh=m.shells[i],ox=sh.x,oy=sh.y;sh.ownerGrace=Math.max(0,(sh.ownerGrace||0)-dt);'''
          new='''      for(let i=m.shells.length-1;i>=0;i--){const sh=m.shells[i];if(!sh){m.shells.splice(i,1);continue;}const ox=sh.x,oy=sh.y;sh.ownerGrace=Math.max(0,(sh.ownerGrace||0)-dt);'''
          if s.count(old)!=1:
              raise SystemExit(f'shell marker expected 1, found {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/ball-battle.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/ball-battle.js
          grep -q '볼배틀 리뉴얼 v137' index.html

      - name: Install browser harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1

      - name: Verify plumber 30-match full-test pairs
        run: |
          cat > verify.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          const {execSync,spawn}=require('child_process');
          const fs=require('fs');
          const chrome=execSync('which google-chrome').toString().trim();
          fs.mkdirSync('/tmp/ballsite',{recursive:true});
          fs.copyFileSync('index.html','/tmp/ballsite/index.html');
          const server=spawn('python3',['-m','http.server','8127','--bind','127.0.0.1'],{cwd:'/tmp/ballsite',stdio:'ignore'});
          (async()=>{
            await new Promise(r=>setTimeout(r,400));
            const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e.stack||e)));
            await page.goto('http://127.0.0.1:8127',{waitUntil:'load'});
            const result=await page.evaluate(async()=>{
              const focus=characterById('mario_plumber');
              const opponents=battleRosterCharacters().filter(c=>c.id!==focus.id&&!c.simOnly);
              const out=[];soundEnabled=false;fastSimMode=true;speedMultiplier=4;
              for(const opp of opponents){
                const start=performance.now();
                const r=await simulateQuickPair([opp,focus],30,'');
                out.push({id:opp.id,name:opp.name,total:r.aWins+r.bWins+r.drawCount,ms:Math.round(performance.now()-start)});
              }
              fastSimMode=false;
              return out;
            });
            console.log(JSON.stringify(result));
            if(errors.length) throw new Error('page errors: '+errors.join('\n'));
            if(!result.length || result.some(x=>x.total!==30)) throw new Error('incomplete 30-match result');
            console.log(`PASS: ${result.length} plumber matchups x 30 completed`);
            await browser.close();server.kill();
          })().catch(e=>{console.error(e.stack||e);server.kill();process.exit(1)});
          JS
          node verify.cjs

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-mario-full-test.yml
          git add index.html
          git diff --cached --check
          git commit -m "Fix plumber kart hazard crash in full tests"
          git push origin HEAD:main
