name: Apply v149 Koopa HP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v149-koopa-hp.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Koopa HP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v148</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v148</h1>' in s
          old='{ id:"koopa_king", name:"쿱하", mark:"K", role:"게임", color:"#65a30d", hp:240, attack:0, speed:2.35, range:0,'
          new='{ id:"koopa_king", name:"쿱하", mark:"K", role:"게임", color:"#65a30d", hp:200, attack:0, speed:2.35, range:0,'
          assert s.count(old)==1, 'Koopa HP anchor mismatch'
          s=s.replace(old,new,1)
          s=s.replace('<title>볼배틀 리뉴얼 v148</title>','<title>볼배틀 리뉴얼 v149</title>',1)
          s=s.replace('<h1 id="mainTitle">볼배틀 리뉴얼 v148</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v149</h1>',1)
          marker='      const patchNotes = [\n'
          assert marker in s
          note='      "v149: 쿱하 체력 240→200. 최근 테스트에서 과도하게 높은 종합 승률과 긴 전투 시간을 함께 줄이기 위한 단일 수치 조정이며, 등껍질·불기둥·기절·쿨타임 등 나머지 전투 구조는 유지.",\n'
          s=s.replace(marker,marker+note,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v149</title>' in s
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v149</h1>' in s
          assert 'id:"koopa_king"' in s and 'hp:200' in s
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/v149-koopa-hp.yml
          git add index.html .github/workflows/v149-koopa-hp.yml
          git commit -m 'v149: reduce Koopa HP to 200'
          git push
