name: Apply v141 Koopa

on:
  push:
    paths:
      - '.github/workflows/v141-koopa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index
        run: python3 .github/scripts/v141_patch.py

      - name: Validate syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/ball-battle.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)),encoding='utf-8')
          for marker in ['볼배틀 리뉴얼 v141','id:"koopa_king"','const KOOPA = {','if (f.koopa) updateKoopa(f, dt);','drawKoopaFirePillars();']:
              if marker not in s:
                  raise SystemExit('missing '+marker)
          PY
          node --check /tmp/ball-battle.js
          git diff --check

      - name: Browser smoke test
        run: |
          cat > /tmp/smoke.js <<'JS'
          setTimeout(async()=>{
            const out=[];let error='';
            window.addEventListener('error',e=>{error+=(e.error&&e.error.stack)||e.message||String(e);});
            const koopa=characterById('koopa_king');
            const ids=['mario_plumber','tano','newhello_sergeant','spider_man'];
            const prev=beginFastSim('koopa-smoke');
            try{
              if(!koopa)throw new Error('koopa missing');
              for(const id of ids){
                const opp=characterById(id);
                const r=await simulateQuickPair([opp,koopa],3,'smoke '+id);
                out.push({id,total:r.aWins+r.bWins+r.drawCount});
              }
            }catch(e){error+='\n'+String(e&&e.stack||e);}
            finally{endFastSim(prev);}
            const pre=document.createElement('pre');pre.id='smokeResult';pre.textContent=JSON.stringify({out,error});document.body.appendChild(pre);window.requestAnimationFrame=()=>0;
          },50);
          JS
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='    requestAnimationFrame(loop);'
          diag=Path('/tmp/smoke.js').read_text()
          if marker not in s:
              raise SystemExit('loop marker missing')
          Path('/tmp/smoke.html').write_text(s.replace(marker,diag+'\n'+marker,1),encoding='utf-8')
          PY
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=150000 --dump-dom file:///tmp/smoke.html > /tmp/smoke-dom.txt
          python3 - <<'PY'
          import re,html,json
          s=open('/tmp/smoke-dom.txt',encoding='utf-8').read()
          m=re.search(r'<pre id="smokeResult">(.*?)</pre>',s,re.S)
          if not m:
              raise SystemExit('smoke result missing')
          data=json.loads(html.unescape(m.group(1)))
          print(data)
          if data.get('error'):
              raise SystemExit(data['error'])
          if len(data.get('out',[]))!=4 or any(x.get('total')!=3 for x in data['out']):
              raise SystemExit('incomplete smoke matches')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v141-koopa.yml .github/scripts/v141_patch.py
          git add index.html
          git diff --cached --check
          git commit -m "Add Koopa-inspired boss fighter"
          git push origin HEAD:main
