name: Apply v224 Steve patch

on:
  push:
    paths:
      - '.github/workflows/v224-steve-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch Steve v224
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def sub_once(pattern, repl, label, flags=0):
              global s
              s, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1, found {n}')

          if '볼배틀 리뉴얼 v223' not in s:
              raise SystemExit('v223 marker missing')
          s = s.replace('볼배틀 리뉴얼 v223', '볼배틀 리뉴얼 v224', 1)

          new_entry = (
              '      { id:"steve_miner", name:"스티브", mark:"⛏", role:"게임", color:"#3b82f6", hp:170, attack:0, speed:2.6, range:0,\n'
              '        skillName:"채굴 · 장비 진화 · 네더 원정", condition:"자원 추적 없음 · 습득반경 내 채굴(이동·공격 불가) · 충돌 시 중단/진행도 누적 · 나무1→돌2→철3→다이아4", desc:"맨손으로 시작한다. 현재 단계에 필요한 자원은 맵의 랜덤 위치에 항상 1개만 존재하며 자원을 향해 추적 이동하지 않는다. 자원이 습득반경 안에 들어오면 제자리에서 곡괭이질을 하며 채굴하고, 채굴 중에는 이동과 공격을 할 수 없다. 나무·돌·철·다이아는 각각 0.6/0.9/1.2/1.6초가 필요하며 다른 캐릭터와 몸이 부딪히면 채굴이 중단되지만 진행도는 남아 다음 접촉 시 이어서 채굴한다. 나무1개, 돌2개, 철3개, 다이아4개를 차례로 모아 장비가 진화하고 성장 단계가 높을수록 공격범위도 넓어진다. 다이아 장비가 되면 네더 포탈이 나타나며 10초 뒤 네더라이트 장비로 귀환하면서 체력30을 잃는다." },'
          )
          sub_once(
              r'      \{ id:"steve_miner", name:"스티브".*?\n\s*skillName:"채굴 · 장비 진화 · 네더 원정".*?\},',
              new_entry,
              'Steve character entry',
              re.S
          )

          new_const = (
              '    const STEVE = {\n'
              '      pickupBonus:24, resourceRadius:10, resourceSpawnDelay:1,\n'
              '      attackPeriod:1.05, attackBonuses:[4,6,7,8,10,12],\n'
              '      mineTimes:{wood:.6,stone:.9,iron:1.2,diamond:1.6},\n'
              '      portalFirst:5, portalLife:4.5, portalGap:4.5, portalLength:96,\n'
              '      netherTime:10, netherCost:30\n'
              '    };'
          )
          sub_once(
              r'    const STEVE = \{.*?\n    \};(?=\n    const STEVE_TIERS)',
              new_const,
              'STEVE constants',
              re.S
          )

          old_init = '      f.steve={tier:0,count:0,resource:null,resourceSpawnCd:0,attackCd:.35,swing:0,forcing:false,portal:null,portalCd:0,nether:0,baseSpeed:f.baseSpeed||f.speed||2.6};'
          new_init = '      f.steve={tier:0,count:0,resource:null,resourceSpawnCd:0,attackCd:.35,swing:0,mining:false,mineAnim:0,portal:null,portalCd:0,nether:0,baseSpeed:f.baseSpeed||f.speed||2.6};'
          if s.count(old_init) != 1: raise SystemExit('Steve init marker missing')
          s = s.replace(old_init, new_init, 1)

          sub_once(
              r'    function steveForceWait\(f\)\{.*?\}\n',
              '',
              'remove steveForceWait'
          )

          old_spawn = '      s.resource={type:t.resource,x:rand(arena.x+r+18,arena.x2-r-18),y:rand(arena.y+r+18,arena.y2-r-18),r,age:0};s.forcing=false;'
          new_spawn = '      s.resource={type:t.resource,x:rand(arena.x+r+18,arena.x2-r-18),y:rand(arena.y+r+18,arena.y2-r-18),r,age:0,progress:0};s.mining=false;s.mineAnim=0;'
          if s.count(old_spawn) != 1: raise SystemExit('Steve spawn marker missing')
          s = s.replace(old_spawn, new_spawn, 1)

          old_collect = '      s.count++;s.resource=null;s.forcing=false;s.resourceSpawnCd=STEVE.resourceSpawnDelay;'
          new_collect = '      s.count++;s.resource=null;s.mining=false;s.mineAnim=0;s.resourceSpawnCd=STEVE.resourceSpawnDelay;'
          if s.count(old_collect) != 1: raise SystemExit('Steve collect marker missing')
          s = s.replace(old_collect, new_collect, 1)

          old_enter = '      s.nether=STEVE.netherTime;s.portal=null;s.portalCd=0;s.forcing=false;f.vx=0;f.vy=0;f.x=arena.x-5000;f.y=arena.y-5000;'
          new_enter = '      s.nether=STEVE.netherTime;s.portal=null;s.portalCd=0;s.mining=false;s.mineAnim=0;f.vx=0;f.vy=0;f.x=arena.x-5000;f.y=arena.y-5000;'
          if s.count(old_enter) != 1: raise SystemExit('Steve nether marker missing')
          s = s.replace(old_enter, new_enter, 1)

          new_attack = (
              '    function steveAttack(f,dt){\n'
              '      const s=f.steve;s.attackCd=Math.max(0,s.attackCd-dt);s.swing=Math.max(0,(s.swing||0)-dt);if(s.attackCd>0||steveBlocked(f)||s.mining)return;\n'
              '      const q=nearestEnemy(f),e=q.enemy,bonus=STEVE.attackBonuses[clamp(s.tier||0,0,5)]||0;if(!e||q.d>f.r+e.r+bonus)return;\n'
              '      const tier=steveTier(f),dealt=damage(e,tier.damage,f,tier.name+" 검");s.attackCd=STEVE.attackPeriod;s.swing=.22;\n'
              '      if(dealt>0&&!fastSimMode){spawnHitFlash(e.x,e.y,tier.color,34);playSound("hit",.48);}\n'
              '    }'
          )
          sub_once(
              r'    function steveAttack\(f,dt\)\{.*?\n    \}(?=\n    function updateSteve)',
              new_attack,
              'Steve attack function',
              re.S
          )

          new_update = (
              '    function updateSteve(f,dt){\n'
              '      const s=f?.steve;if(!s||!f.alive)return false;\n'
              '      if(s.nether>0){s.nether=Math.max(0,s.nether-dt);s.mining=false;s.mineAnim=0;f.vx=0;f.vy=0;if(s.nether<=0){steveExitNether(f);return false;}return true;}\n'
              '      if(s.tier<4){\n'
              '        if(!s.resource){s.resourceSpawnCd=Math.max(0,(s.resourceSpawnCd||0)-dt);if(s.resourceSpawnCd<=0)steveSpawnResource(f);}\n'
              '        const r=s.resource;\n'
              '        if(r){\n'
              '          r.age+=dt;const pickup=f.r+r.r+STEVE.pickupBonus,inRange=Math.hypot(f.x-r.x,f.y-r.y)<=pickup;\n'
              '          if(inRange){\n'
              '            const collided=fighters.some(o=>o!==f&&o.alive&&!o.isSummon&&Math.hypot(f.x-o.x,f.y-o.y)<=f.r+o.r);\n'
              '            if(collided||steveBlocked(f)){s.mining=false;s.mineAnim=0;}\n'
              '            else{\n'
              '              s.mining=true;s.mineAnim=(s.mineAnim||0)+dt;f.vx=0;f.vy=0;\n'
              '              const need=STEVE.mineTimes[r.type]||1;r.progress=Math.min(need,(r.progress||0)+dt);\n'
              '              if(r.progress>=need){steveCollectResource(f);return false;}\n'
              '              return true;\n'
              '            }\n'
              '          }else{s.mining=false;s.mineAnim=0;}\n'
              '        }else{s.mining=false;s.mineAnim=0;}\n'
              '      }else{s.mining=false;s.mineAnim=0;}\n'
              '      steveAttack(f,dt);\n'
              '      if(s.tier===4){if(s.portal){s.portal.life=Math.max(0,s.portal.life-dt);if(steveTouchingPortal(f,s.portal)){steveEnterNether(f);return true;}if(s.portal.life<=0){s.portal=null;s.portalCd=STEVE.portalGap;}}else{s.portalCd=Math.max(0,(s.portalCd||0)-dt);if(s.portalCd<=0)steveSpawnPortal(f);}}\n'
              '      return false;\n'
              '    }'
          )
          sub_once(
              r'    function updateSteve\(f,dt\)\{.*?\n    \}(?=\n    function stevePortalEndpoints)',
              new_update,
              'Steve update function',
              re.S
          )

          old_draw = '      const swing=(s.swing||0)>0?-1.0+((.22-s.swing)/.22)*1.65:-.45;ctx.save();ctx.translate(9,2);ctx.rotate(swing);if(s.tier===0){ctx.fillStyle="#b77956";ctx.fillRect(0,-4,15,8);ctx.fillStyle="#8b5e3c";ctx.fillRect(12,-6,8,12);ctx.strokeStyle="#5b3a29";ctx.lineWidth=1.2;ctx.strokeRect(12,-6,8,12);}else{ctx.strokeStyle=tier.color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(22,0);ctx.stroke();ctx.strokeStyle="#f8fafc";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(4,-1);ctx.lineTo(22,-1);ctx.stroke();ctx.fillStyle="#78350f";ctx.fillRect(-3,-3,7,6);}ctx.restore();ctx.restore();drawHealthBar(f);drawName(f);'
          new_draw = '      const mining=!!s.mining;const swing=mining?-1.0+Math.sin((s.mineAnim||0)*18)*.55:(s.swing||0)>0?-1.0+((.22-s.swing)/.22)*1.65:-.45;ctx.save();ctx.translate(9,2);ctx.rotate(swing);if(mining){ctx.strokeStyle="#78350f";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-2,0);ctx.lineTo(23,0);ctx.stroke();ctx.strokeStyle="#cbd5e1";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(17,-8);ctx.quadraticCurveTo(23,-11,29,-7);ctx.stroke();ctx.strokeStyle="#64748b";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(17,-7);ctx.quadraticCurveTo(23,-10,29,-6);ctx.stroke();}else if(s.tier===0){ctx.fillStyle="#b77956";ctx.fillRect(0,-4,15,8);ctx.fillStyle="#8b5e3c";ctx.fillRect(12,-6,8,12);ctx.strokeStyle="#5b3a29";ctx.lineWidth=1.2;ctx.strokeRect(12,-6,8,12);}else{ctx.strokeStyle=tier.color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(22,0);ctx.stroke();ctx.strokeStyle="#f8fafc";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(4,-1);ctx.lineTo(22,-1);ctx.stroke();ctx.fillStyle="#78350f";ctx.fillRect(-3,-3,7,6);}ctx.restore();ctx.restore();drawHealthBar(f);drawName(f);'
          if s.count(old_draw) != 1: raise SystemExit('Steve draw marker missing')
          s = s.replace(old_draw, new_draw, 1)

          status_start = '      if(f.steve){const s=f.steve,t=steveTier(f);'
          status_end = '      if(f.hinta){'
          a = s.find(status_start)
          b = s.find(status_end, a + 1)
          if a < 0 or b < 0: raise SystemExit('Steve status boundaries missing')
          new_status = '      if(f.steve){const s=f.steve,t=steveTier(f);if(s.nether>0)return {ratio:clamp(1-s.nether/STEVE.netherTime,0,1),className:"skill-fill",text:`네더 탐험 · ${s.nether.toFixed(1)}초`,extraTextHtml:\'<div class="status-skill-label">귀환 시 네더라이트 · 체력 -30</div>\'};if(s.tier<4){const r=s.resource,spawn=Math.max(0,s.resourceSpawnCd||0),needTime=r?(STEVE.mineTimes[r.type]||1):0,prog=r?(r.progress||0):0,remain=Math.max(0,needTime-prog);return {ratio:s.mining&&needTime?clamp(prog/needTime,0,1):(t.need?clamp(s.count/t.need,0,1):1),className:"skill-fill",text:`${t.name} · ${t.resourceName} ${s.count}/${t.need}`,extraTextHtml:`<div class="status-skill-label">${r?(s.mining?`채굴 중 · ${remain.toFixed(1)}초 남음`:prog>0?`채굴 누적 ${prog.toFixed(1)}/${needTime.toFixed(1)}초`:`자원 접근 시 ${needTime.toFixed(1)}초 채굴`):`다음 자원 ${spawn.toFixed(1)}초`}</div>`};}if(s.tier===4)return {ratio:s.portal?clamp(s.portal.life/s.portal.maxLife,0,1):clamp(1-(s.portalCd||0)/STEVE.portalGap,0,1),className:"skill-fill",text:s.portal?`다이아 장비 · 포탈 ${s.portal.life.toFixed(1)}초`:`다이아 장비 · 포탈 대기 ${(s.portalCd||0).toFixed(1)}초`,extraTextHtml:\'<div class="status-skill-label">포탈 접촉 → 네더 10초</div>\'};return {ratio:1,className:"skill-fill",text:"네더라이트 장비 · 최종 단계",extraTextHtml:\'<div class="status-skill-label">검17 · 일반 피해 20% 감소</div>\'};}\n'
          s = s[:a] + new_status + s[b:]

          info_start = '      if(c.id==="steve_miner")return {'
          info_end = '      if(c.id==="wok_wok")return {'
          a = s.find(info_start)
          b = s.find(info_end, a + 1)
          if a < 0 or b < 0: raise SystemExit('Steve info boundaries missing')
          new_info = '      if(c.id==="steve_miner")return {damage:"맨손5 / 나무검7 / 돌검9 / 철검11 / 다이아검14 / 네더라이트검17 · 공격범위 보너스 +4/+6/+7/+8/+10/+12",tick:"근접 공격1.05초 · 자원 1개만 존재 · 채굴 나무0.6/돌0.9/철1.2/다이아1.6초 · 나무1→돌2→철3→다이아4 · 다음 자원1초 후 생성 · 네더10초",tip:"자원 추적 이동은 하지 않는다. 습득 반경은 몸체+자원 반경에 24를 더하며, 범위 안에서는 이동·공격을 멈추고 곡괭이질한다. 다른 캐릭터 본체와 충돌하면 채굴이 즉시 중단되지만 진행도는 자원에 누적되어 다음 접촉 때 이어진다. 철 장비의 공격범위는 뉴헬로 병장의 비접촉 발동거리(+8)와 같고 다이아·네더라이트에서 더 넓어진다. 기존 장비별 공격력·피해감소와 네더 귀환 체력30 감소는 유지한다."};\n'
          s = s[:a] + new_info + s[b:]

          note = '      "v224: 스티브 채굴 구조 및 공격범위 개편. 자원 추적 이동을 삭제하고 습득반경을 +20→+24로 소폭 확대. 자원 접촉 시 이동·공격을 멈추고 곡괭이질하며 나무0.6/돌0.9/철1.2/다이아1.6초 후 획득. 다른 캐릭터 본체와 충돌 시 채굴은 중단되지만 진행도는 누적 유지. 공격범위 보너스는 맨손/나무/돌/철/다이아/네더라이트 +4/+6/+7/+8/+10/+12로 단계별 증가하며 철은 뉴헬로 비접촉 발동거리와 동일. 기존 공격력·피해감소·성장 필요량·네더 구조는 유지.",\n'
          marker = '      "v223: 스티브 성장 구조 개편.'
          if s.count(marker) != 1: raise SystemExit('v223 patch-note marker missing')
          s = s.replace(marker, note + marker, 1)

          for old in ('steveForceWait', 'STEVE.forceWaits', 's.forcing', 'STEVE.meleeBonus'):
              if old in s: raise SystemExit(f'old Steve reference remains: {old}')
          for needed in ('볼배틀 리뉴얼 v224', 'attackBonuses:[4,6,7,8,10,12]', 'mineTimes:{wood:.6,stone:.9,iron:1.2,diamond:1.6}', 'pickupBonus:24', 'progress:0', 's.mining'):
              if needed not in s: raise SystemExit(f'new Steve marker missing: {needed}')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no script blocks')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('script blocks',len(scripts),'bytes',Path('/tmp/app.js').stat().st_size)
          PY
          node --check /tmp/app.js
      - name: Commit v224
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v224: rework Steve mining and attack range'
          git push
