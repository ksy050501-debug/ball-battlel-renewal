name: Apply v224 Steve patch

on:
  push:
    paths:
      - '.github/workflows/v224-steve-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch Steve v224
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '볼배틀 리뉴얼 v223' not in s:
              raise SystemExit('v223 marker missing')
          s = s.replace('볼배틀 리뉴얼 v223', '볼배틀 리뉴얼 v224', 1)

          old_entry = '''      { id:"steve_miner", name:"스티브", mark:"⛏", role:"게임", color:"#3b82f6", hp:170, attack:0, speed:2.6, range:0,
            skillName:"채굴 · 장비 진화 · 네더 원정", condition:"자원 1개 랜덤 생성 · 단계별 자동이동 5/7/9/11초 · 나무1→돌2→철3→다이아4 · 다이아 이후 네더 포탈", desc:"맨손으로 시작한다. 현재 단계에 필요한 자원은 맵의 랜덤 위치에 항상 1개만 존재하고 평소에는 추적하지 않는다. 나무는 5초, 돌은 7초, 철은 9초, 다이아는 11초 동안 습득하지 못했을 때만 해당 자원으로 이동한다. 나무1개, 돌2개, 철3개, 다이아4개를 차례로 모아 맨손→나무→돌→철→다이아 장비로 진화하며, 자원을 얻은 뒤 다음 자원은 1초 후 새로운 랜덤 위치에 생성된다. 다이아 장비가 되면 랜덤한 벽 일부에 네더 포탈이 나타나고, 포탈에 닿으면 10초간 전장을 떠난 뒤 랜덤한 벽에서 네더라이트 장비로 귀환하며 체력30을 잃는다." },'''
          new_entry = '''      { id:"steve_miner", name:"스티브", mark:"⛏", role:"게임", color:"#3b82f6", hp:170, attack:0, speed:2.6, range:0,
            skillName:"채굴 · 장비 진화 · 네더 원정", condition:"자원 추적 없음 · 습득반경 내 채굴(이동·공격 불가) · 충돌 시 중단/진행도 누적 · 나무1→돌2→철3→다이아4", desc:"맨손으로 시작한다. 현재 단계에 필요한 자원은 맵의 랜덤 위치에 항상 1개만 존재하며 자원을 향해 추적 이동하지 않는다. 자원이 습득반경 안에 들어오면 제자리에서 곡괭이질을 하며 채굴하고, 채굴 중에는 이동과 공격을 할 수 없다. 나무·돌·철·다이아는 각각 0.6/0.9/1.2/1.6초가 필요하며 적과 몸이 부딪히면 채굴이 중단되지만 진행도는 남아 다음 접촉 시 이어서 채굴한다. 나무1개, 돌2개, 철3개, 다이아4개를 차례로 모아 장비가 진화하고 성장 단계가 높을수록 공격범위도 넓어진다. 다이아 장비가 되면 네더 포탈이 나타나며 10초 뒤 네더라이트 장비로 귀환하면서 체력30을 잃는다." },'''
          if s.count(old_entry) != 1:
              raise SystemExit(f'steve entry marker expected 1, found {s.count(old_entry)}')
          s = s.replace(old_entry, new_entry, 1)

          old_const = '''    const STEVE = {
              pickupBonus:20, resourceRadius:10, forceWaits:[5,7,9,11], resourceSpawnDelay:1,
              attackPeriod:1.05, meleeBonus:12,
              portalFirst:5, portalLife:4.5, portalGap:4.5, portalLength:96,
              netherTime:10, netherCost:30
            };'''
          new_const = '''    const STEVE = {
              pickupBonus:24, resourceRadius:10, resourceSpawnDelay:1,
              attackPeriod:1.05, attackBonuses:[4,6,7,8,10,12],
              mineTimes:{wood:.6,stone:.9,iron:1.2,diamond:1.6},
              portalFirst:5, portalLife:4.5, portalGap:4.5, portalLength:96,
              netherTime:10, netherCost:30
            };'''
          if s.count(old_const) != 1:
              raise SystemExit(f'STEVE const marker expected 1, found {s.count(old_const)}')
          s = s.replace(old_const, new_const, 1)

          old_init = '      f.steve={tier:0,count:0,resource:null,resourceSpawnCd:0,attackCd:.35,swing:0,forcing:false,portal:null,portalCd:0,nether:0,baseSpeed:f.baseSpeed||f.speed||2.6};'
          new_init = '      f.steve={tier:0,count:0,resource:null,resourceSpawnCd:0,attackCd:.35,swing:0,mining:false,mineAnim:0,portal:null,portalCd:0,nether:0,baseSpeed:f.baseSpeed||f.speed||2.6};'
          if s.count(old_init) != 1: raise SystemExit('Steve init marker missing')
          s = s.replace(old_init, new_init, 1)

          force_fn = '    function steveForceWait(f){const t=clamp(f?.steve?.tier||0,0,3);return STEVE.forceWaits[t]||STEVE.forceWaits[0];}\n'
          if s.count(force_fn) != 1: raise SystemExit('steveForceWait marker missing')
          s = s.replace(force_fn, '', 1)

          old_spawn = '      s.resource={type:t.resource,x:rand(arena.x+r+18,arena.x2-r-18),y:rand(arena.y+r+18,arena.y2-r-18),r,age:0};s.forcing=false;'
          new_spawn = '      s.resource={type:t.resource,x:rand(arena.x+r+18,arena.x2-r-18),y:rand(arena.y+r+18,arena.y2-r-18),r,age:0,progress:0};s.mining=false;s.mineAnim=0;'
          if s.count(old_spawn) != 1: raise SystemExit('Steve spawn marker missing')
          s = s.replace(old_spawn, new_spawn, 1)

          old_collect = '      s.count++;s.resource=null;s.forcing=false;s.resourceSpawnCd=STEVE.resourceSpawnDelay;'
          new_collect = '      s.count++;s.resource=null;s.mining=false;s.mineAnim=0;s.resourceSpawnCd=STEVE.resourceSpawnDelay;'
          if s.count(old_collect) != 1: raise SystemExit('Steve collect marker missing')
          s = s.replace(old_collect, new_collect, 1)

          old_enter = '      s.nether=STEVE.netherTime;s.portal=null;s.portalCd=0;s.forcing=false;f.vx=0;f.vy=0;f.x=arena.x-5000;f.y=arena.y-5000;'
          new_enter = '      s.nether=STEVE.netherTime;s.portal=null;s.portalCd=0;s.mining=false;s.mineAnim=0;f.vx=0;f.vy=0;f.x=arena.x-5000;f.y=arena.y-5000;'
          if s.count(old_enter) != 1: raise SystemExit('Steve nether marker missing')
          s = s.replace(old_enter, new_enter, 1)

          attack_pat = re.compile(r'''    function steveAttack\(f,dt\)\{.*?\n    \}\n    function updateSteve\(f,dt\)\{.*?\n      return false;\n    \}\n    function stevePortalEndpoints''', re.S)
          new_attack_update = '''    function steveAttack(f,dt){
              const s=f.steve;s.attackCd=Math.max(0,s.attackCd-dt);s.swing=Math.max(0,(s.swing||0)-dt);if(s.attackCd>0||steveBlocked(f)||s.mining)return;
              const q=nearestEnemy(f),e=q.enemy,bonus=STEVE.attackBonuses[clamp(s.tier||0,0,5)]||0;if(!e||q.d>f.r+e.r+bonus)return;
              const tier=steveTier(f),dealt=damage(e,tier.damage,f,tier.name+" 검");s.attackCd=STEVE.attackPeriod;s.swing=.22;
              if(dealt>0&&!fastSimMode){spawnHitFlash(e.x,e.y,tier.color,34);playSound("hit",.48);}
            }
            function updateSteve(f,dt){
              const s=f?.steve;if(!s||!f.alive)return false;
              if(s.nether>0){s.nether=Math.max(0,s.nether-dt);s.mining=false;f.vx=0;f.vy=0;if(s.nether<=0){steveExitNether(f);return false;}return true;}
              if(s.tier<4){
                if(!s.resource){s.resourceSpawnCd=Math.max(0,(s.resourceSpawnCd||0)-dt);if(s.resourceSpawnCd<=0)steveSpawnResource(f);}
                const r=s.resource;
                if(r){
                  r.age+=dt;const pickup=f.r+r.r+STEVE.pickupBonus,inRange=Math.hypot(f.x-r.x,f.y-r.y)<=pickup;
                  if(inRange){
                    const q=nearestEnemy(f),e=q.enemy,collided=!!(e&&q.d<=f.r+e.r);
                    if(collided||steveBlocked(f)){s.mining=false;s.mineAnim=0;}
                    else{
                      s.mining=true;s.mineAnim=(s.mineAnim||0)+dt;f.vx=0;f.vy=0;
                      const need=STEVE.mineTimes[r.type]||1;r.progress=Math.min(need,(r.progress||0)+dt);
                      if(r.progress>=need){steveCollectResource(f);return false;}
                      return true;
                    }
                  }else{s.mining=false;s.mineAnim=0;}
                }else{s.mining=false;s.mineAnim=0;}
              }else{s.mining=false;s.mineAnim=0;}
              steveAttack(f,dt);
              if(s.tier===4){if(s.portal){s.portal.life=Math.max(0,s.portal.life-dt);if(steveTouchingPortal(f,s.portal)){steveEnterNether(f);return true;}if(s.portal.life<=0){s.portal=null;s.portalCd=STEVE.portalGap;}}else{s.portalCd=Math.max(0,(s.portalCd||0)-dt);if(s.portalCd<=0)steveSpawnPortal(f);}}
              return false;
            }
            function stevePortalEndpoints'''
          s, n = attack_pat.subn(new_attack_update, s, count=1)
          if n != 1: raise SystemExit(f'Steve attack/update block expected 1, found {n}')

          old_draw = '''      const swing=(s.swing||0)>0?-1.0+((.22-s.swing)/.22)*1.65:-.45;ctx.save();ctx.translate(9,2);ctx.rotate(swing);if(s.tier===0){ctx.fillStyle="#b77956";ctx.fillRect(0,-4,15,8);ctx.fillStyle="#8b5e3c";ctx.fillRect(12,-6,8,12);ctx.strokeStyle="#5b3a29";ctx.lineWidth=1.2;ctx.strokeRect(12,-6,8,12);}else{ctx.strokeStyle=tier.color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(22,0);ctx.stroke();ctx.strokeStyle="#f8fafc";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(4,-1);ctx.lineTo(22,-1);ctx.stroke();ctx.fillStyle="#78350f";ctx.fillRect(-3,-3,7,6);}ctx.restore();ctx.restore();drawHealthBar(f);drawName(f);'''
          new_draw = '''      const mining=!!s.mining;const swing=mining?-1.0+Math.sin((s.mineAnim||0)*18)*.55:(s.swing||0)>0?-1.0+((.22-s.swing)/.22)*1.65:-.45;ctx.save();ctx.translate(9,2);ctx.rotate(swing);if(mining){ctx.strokeStyle="#78350f";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-2,0);ctx.lineTo(23,0);ctx.stroke();ctx.strokeStyle="#cbd5e1";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(17,-8);ctx.quadraticCurveTo(23,-11,29,-7);ctx.stroke();ctx.strokeStyle="#64748b";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(17,-7);ctx.quadraticCurveTo(23,-10,29,-6);ctx.stroke();}else if(s.tier===0){ctx.fillStyle="#b77956";ctx.fillRect(0,-4,15,8);ctx.fillStyle="#8b5e3c";ctx.fillRect(12,-6,8,12);ctx.strokeStyle="#5b3a29";ctx.lineWidth=1.2;ctx.strokeRect(12,-6,8,12);}else{ctx.strokeStyle=tier.color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(22,0);ctx.stroke();ctx.strokeStyle="#f8fafc";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(4,-1);ctx.lineTo(22,-1);ctx.stroke();ctx.fillStyle="#78350f";ctx.fillRect(-3,-3,7,6);}ctx.restore();ctx.restore();drawHealthBar(f);drawName(f);'''
          if s.count(old_draw) != 1: raise SystemExit('Steve draw marker missing')
          s = s.replace(old_draw, new_draw, 1)

          old_status = '''      if(f.steve){const s=f.steve,t=steveTier(f);if(s.nether>0)return {ratio:clamp(1-s.nether/STEVE.netherTime,0,1),className:"skill-fill",text:`네더 탐험 · ${s.nether.toFixed(1)}초`,extraTextHtml:'<div class="status-skill-label">귀환 시 네더라이트 · 체력 -30</div>'};if(s.tier<4){const r=s.resource,wait=r?Math.max(0,steveForceWait(f)-r.age):Math.max(0,s.resourceSpawnCd||0);return {ratio:t.need?clamp(s.count/t.need,0,1):1,className:"skill-fill",text:`${t.name} · ${t.resourceName} ${s.count}/${t.need}`,extraTextHtml:`<div class="status-skill-label">${r?(s.forcing?"자원으로 이동 중":`자동 이동까지 ${wait.toFixed(1)}초`):`다음 자원 ${wait.toFixed(1)}초`}</div>`};}if(s.tier===4)return {ratio:s.portal?clamp(s.portal.life/s.portal.maxLife,0,1):clamp(1-(s.portalCd||0)/STEVE.portalGap,0,1),className:"skill-fill",text:s.portal?`다이아 장비 · 포탈 ${s.portal.life.toFixed(1)}초`:`다이아 장비 · 포탈 대기 ${(s.portalCd||0).toFixed(1)}초`,extraTextHtml:'<div class="status-skill-label">포탈 접촉 → 네더 10초</div>'};return {ratio:1,className:"skill-fill",text:"네더라이트 장비 · 최종 단계",extraTextHtml:'<div class="status-skill-label">검17 · 일반 피해 20% 감소</div>'};}'''
          new_status = '''      if(f.steve){const s=f.steve,t=steveTier(f);if(s.nether>0)return {ratio:clamp(1-s.nether/STEVE.netherTime,0,1),className:"skill-fill",text:`네더 탐험 · ${s.nether.toFixed(1)}초`,extraTextHtml:'<div class="status-skill-label">귀환 시 네더라이트 · 체력 -30</div>'};if(s.tier<4){const r=s.resource,spawn=Math.max(0,s.resourceSpawnCd||0),needTime=r?(STEVE.mineTimes[r.type]||1):0,prog=r?(r.progress||0):0,remain=Math.max(0,needTime-prog);return {ratio:s.mining&&needTime?clamp(prog/needTime,0,1):(t.need?clamp(s.count/t.need,0,1):1),className:"skill-fill",text:`${t.name} · ${t.resourceName} ${s.count}/${t.need}`,extraTextHtml:`<div class="status-skill-label">${r?(s.mining?`채굴 중 · ${remain.toFixed(1)}초 남음`:prog>0?`채굴 누적 ${prog.toFixed(1)}/${needTime.toFixed(1)}초`:`자원 접근 시 ${needTime.toFixed(1)}초 채굴`):`다음 자원 ${spawn.toFixed(1)}초`}</div>`};}if(s.tier===4)return {ratio:s.portal?clamp(s.portal.life/s.portal.maxLife,0,1):clamp(1-(s.portalCd||0)/STEVE.portalGap,0,1),className:"skill-fill",text:s.portal?`다이아 장비 · 포탈 ${s.portal.life.toFixed(1)}초`:`다이아 장비 · 포탈 대기 ${(s.portalCd||0).toFixed(1)}초`,extraTextHtml:'<div class="status-skill-label">포탈 접촉 → 네더 10초</div>'};return {ratio:1,className:"skill-fill",text:"네더라이트 장비 · 최종 단계",extraTextHtml:'<div class="status-skill-label">검17 · 일반 피해 20% 감소</div>'};}'''
          if s.count(old_status) != 1: raise SystemExit('Steve status marker missing')
          s = s.replace(old_status, new_status, 1)

          old_info = '      if(c.id==="steve_miner")return {damage:"맨손5 / 나무검7 / 돌검9 / 철검11 / 다이아검14 / 네더라이트검17",tick:"근접 공격1.05초 · 자원 1개만 존재 · 자동이동 5/7/9/11초 · 나무1→돌2→철3→다이아4 · 다음 자원1초 후 생성 · 네더10초",tip:"맨손에서 나무를 1개 얻어 나무 장비가 열린다. 이후 돌2개, 철3개, 다이아4개가 필요하며 단계가 높을수록 자동 이동까지 더 오래 기다린다. 습득 반경은 몸체+자원 반경에 20을 더한다. 기존 장비별 공격력과 피해 감소는 유지하며, 다이아 이후 랜덤 벽 포탈에 닿으면 10초 뒤 네더라이트로 귀환하고 현재 체력30을 잃는다."};'
          new_info = '      if(c.id==="steve_miner")return {damage:"맨손5 / 나무검7 / 돌검9 / 철검11 / 다이아검14 / 네더라이트검17 · 공격범위 보너스 +4/+6/+7/+8/+10/+12",tick:"근접 공격1.05초 · 자원 1개만 존재 · 채굴 나무0.6/돌0.9/철1.2/다이아1.6초 · 나무1→돌2→철3→다이아4 · 다음 자원1초 후 생성 · 네더10초",tip:"자원 추적 이동은 하지 않는다. 습득 반경은 몸체+자원 반경에 24를 더하며, 범위 안에서는 이동·공격을 멈추고 곡괭이질한다. 적 본체와 충돌하면 채굴이 즉시 중단되지만 진행도는 자원에 누적되어 다음 접촉 때 이어진다. 철 장비의 공격범위는 뉴헬로 병장의 비접촉 발동거리(+8)와 같고 다이아·네더라이트에서 더 넓어진다. 기존 장비별 공격력·피해감소와 네더 귀환 체력30 감소는 유지한다."};'
          if s.count(old_info) != 1: raise SystemExit('Steve info marker missing')
          s = s.replace(old_info, new_info, 1)

          note_marker = '      "v223: 스티브 성장 구조 개편.'
          if s.count(note_marker) != 1: raise SystemExit('v223 patch note marker missing')
          v224 = '      "v224: 스티브 채굴 구조 및 공격범위 개편. 자원 추적 이동을 삭제하고 습득반경을 +20→+24로 소폭 확대. 자원 접촉 시 이동·공격을 멈추고 곡괭이질하며 나무0.6/돌0.9/철1.2/다이아1.6초 후 획득. 적 본체 충돌 시 채굴은 중단되지만 진행도는 누적 유지. 공격범위 보너스는 맨손/나무/돌/철/다이아/네더라이트 +4/+6/+7/+8/+10/+12로 단계별 증가하며 철은 뉴헬로 비접촉 발동거리와 동일. 기존 공격력·피해감소·성장 필요량·네더 구조는 유지.",\n'
          s = s.replace('      "v223: 스티브 성장 구조 개편.', v224 + '      "v223: 스티브 성장 구조 개편.', 1)

          if 'steveForceWait' in s or 'STEVE.forceWaits' in s or 's.forcing' in s:
              raise SystemExit('old Steve forced tracking runtime reference remains')
          if '볼배틀 리뉴얼 v224' not in s:
              raise SystemExit('v224 title missing')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no script blocks')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('script blocks',len(scripts),'bytes',Path('/tmp/app.js').stat().st_size)
          PY
          node --check /tmp/app.js
      - name: Commit v224
        run: |
          rm .github/workflows/v224-steve-patch.yml
