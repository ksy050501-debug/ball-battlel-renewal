name: Apply Mario v134 patch

on:
  push:
    paths:
      - '.github/workflows/apply-mario-v134.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adjust duplicate anchors
        run: python3 -c "from pathlib import Path; p=Path('.github/apply_mario_v134.py'); s=p.read_text(encoding='utf-8'); old=\"    if n != 1:\\n        raise SystemExit(f'{label}: expected 1 anchor, found {n}')\\n    s = s.replace(old, new, 1)\"; new=\"    expected = 2 if label in {'Mario slow multiplier','newhello slow','movement slow'} else 1\\n    if n != expected:\\n        raise SystemExit(f'{label}: expected {expected} anchor(s), found {n}')\\n    s = s.replace(old, new, expected)\"; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Apply patch
        run: |
          set +e
          python3 .github/apply_mario_v134.py > /tmp/mario_patch.log 2>&1
          code=$?
          cat /tmp/mario_patch.log
          if [ $code -ne 0 ]; then
            cp /tmp/mario_patch.log .github/mario_patch_error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/mario_patch_error.txt
            git commit -m 'Record Mario patch diagnostic'
            git push origin HEAD:main
            exit $code
          fi
      - name: Validate JavaScript syntax
        run: |
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S); assert blocks; Path('/tmp/ballbattle.js').write_text(chr(10).join(blocks),encoding='utf-8')"
          node --check /tmp/ballbattle.js
      - name: Verify Mario markers
        run: |
          grep -q '볼배틀 리뉴얼 v134' index.html
          grep -q '배관공카트' index.html
          grep -q 'marioSpawnKartPickup' index.html
          grep -q 'blockTouchNeed:2' index.html
      - name: Commit and clean temporary files
        run: |
          rm -f .github/apply_mario_v134.py .github/workflows/apply-mario-v134.yml .github/mario_patch_error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Expand plumber into box and kart modes'
            git push origin HEAD:main
          fi
