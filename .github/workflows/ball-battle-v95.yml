name: Ball Battle v95 UI corrections
on:
  push:
    paths:
      - ".github/ball-battle-v95.py"
      - ".github/workflows/ball-battle-v95.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v95 corrections
        run: python .github/ball-battle-v95.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          if not scripts: raise SystemExit('no inline script')
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Verify v95 anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          must=[
            '<title>볼배틀 리뉴얼 v95</title>',
            '<h1 id="mainTitle">볼배틀 리뉴얼 v95</h1>',
            'const chances=Math.max(0,Math.floor(f.jabami.debtChances||0));',
            'damage:(f.damageDealt||0)+summon.damage',
            'kills:(f.kills||0)+summon.kills',
            'triggerHitStop(3.4)',
            'd.obeliskSpeechUntil=performance.now()+3400'
          ]
          banned=['function drawJabamiDebtChanceBadge','<span>소환수 피해</span>','<span>소환수 처치</span>','d.speechTime=5.8']
          miss=[x for x in must if x not in s]
          bad=[x for x in banned if x in s]
          if miss or bad: raise SystemExit('missing='+repr(miss)+' banned='+repr(bad))
          PY
      - name: Commit v95
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "v95: correct Jabami UI and Justice stats"
          git push
