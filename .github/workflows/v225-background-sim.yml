name: Apply v225 automatic simulation background support

on:
  push:
    paths:
      - '.github/workflows/v225-background-sim.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch automatic simulation background support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '볼배틀 리뉴얼 v224' not in s:
              raise SystemExit('v224 title marker missing')
          s = s.replace('볼배틀 리뉴얼 v224', '볼배틀 리뉴얼 v225', 1)
          marker = '    async function simulateQuickPair(chosen, count, progressText = "") {'
          if s.count(marker) != 1:
              raise SystemExit('simulateQuickPair marker missing')
          helper_lines = [
              '    const simulationYieldResolvers = new Set();',
              '    function flushSimulationYields(){',
              '      for(const finish of [...simulationYieldResolvers]) finish();',
              '      simulationYieldResolvers.clear();',
              '    }',
              '    function simulationYield(){',
              '      if(document.hidden) return Promise.resolve();',
              '      return new Promise(resolve=>{',
              '        let done=false,timer=null;',
              '        const finish=()=>{',
              '          if(done)return;',
              '          done=true;',
              '          if(timer!==null)clearTimeout(timer);',
              '          simulationYieldResolvers.delete(finish);',
              '          resolve();',
              '        };',
              '        timer=setTimeout(finish,0);',
              '        simulationYieldResolvers.add(finish);',
              '      });',
              '    }',
              '    document.addEventListener("visibilitychange",()=>{',
              '      if(document.hidden&&fastSimMode)flushSimulationYields();',
              '      lastFrame=performance.now();',
              '    });',
              '    window.addEventListener("pagehide",()=>{if(fastSimMode)flushSimulationYields();});'
          ]
          helpers = '\n'.join(helper_lines) + '\n\n'
          s = s.replace(marker, helpers + marker, 1)
          old_yield = 'await new Promise(resolve => setTimeout(resolve, 0));'
          count = s.count(old_yield)
          if count != 4:
              raise SystemExit(f'expected 4 simulation yields, found {count}')
          s = s.replace(old_yield, 'await simulationYield();')
          note_marker = '      "v224: 스티브 채굴 구조 및 공격범위 개편.'
          if s.count(note_marker) != 1:
              raise SystemExit('v224 patch note marker missing')
          note = '      "v225: 자동 시뮬레이션 백그라운드 대응. 자동 50/100전·전체 테스트·전체 상성표는 탭이나 앱이 숨겨지면 기존 setTimeout 양보를 즉시 해제하고 렌더링 없는 고속 계산을 최대한 계속 시도한다. 일반 전투는 기존처럼 백그라운드에서 멈추며 복귀 시 숨겨진 시간을 따라잡지 않는다.",\n'
          s = s.replace(note_marker, note + note_marker, 1)
          checks = ['볼배틀 리뉴얼 v225','function simulationYield()','document.addEventListener("visibilitychange"','await simulationYield();']
          for needle in checks:
              if needle not in s:
                  raise SystemExit('missing after patch: '+needle)
          if old_yield in s:
              raise SystemExit('old simulation yield remains')
          if 'catchUpBackgroundBattle' in s or 'backgroundHiddenAt' in s:
              raise SystemExit('general-battle catch-up code must not exist')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('script block missing')
          Path('/tmp/app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit v225
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/v225-background-sim.yml
          git add -A
          git commit -m 'v225: keep automatic simulations running in background'
          git push
