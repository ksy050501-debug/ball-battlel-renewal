name: Add Steve v222 once

on:
  push:
    paths:
      - '.github/workflows/add-steve-v222-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate v222
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/add-steve-v222.py
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          a=t.index('<script>')+len('<script>')
          b=t.rindex('</script>')
          Path('/tmp/ballbattle-v222.js').write_text(t[a:b],encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v222</title>' in t
          assert '<h1 id="mainTitle">볼배틀 리뉴얼 v222</h1>' in t
          assert 'id:"steve_miner", name:"스티브"' in t
          assert 'function updateSteve(f,dt)' in t
          assert 'drawSteveWorld();' in t
          PY
          node --check /tmp/ballbattle-v222.js
          rm .github/workflows/add-steve-v222-once.yml .github/scripts/add-steve-v222.py
          git add index.html .github/workflows/add-steve-v222-once.yml .github/scripts/add-steve-v222.py
          git commit -m "v222: add Steve mining and Nether progression"
          git push origin main
