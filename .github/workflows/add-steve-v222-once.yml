name: Add Steve v222 once
on:
  push:
    paths:
      - '.github/workflows/add-steve-v222-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Steve prototype
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_steve.py
          python /tmp/patch_steve.py
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('no script found')
          Path('/tmp/ballbattle.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/ballbattle.js
          grep -q '볼배틀 리뉴얼 v222' index.html
          grep -q 'id:"steve_builder", name:"스티브"' index.html
      - name: Commit v222
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v222: add Steve resource progression prototype'
          git push origin HEAD:main
          git rm .github/workflows/add-steve-v222-once.yml
          git commit -m 'chore: remove v222 Steve workflow'
          git push origin HEAD:main
