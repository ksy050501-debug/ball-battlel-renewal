name: Apply v121 Conan incident variants

on:
  push:
    paths:
      - '.github/workflows/apply-v121.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python .github/patch_v121.py
      - name: Validate JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const m = html.match(/<script>([\s\S]*)<\/script>/);
          if (!m) throw new Error('script block not found');
          new Function(m[1]);
          console.log('JavaScript syntax OK');
          NODE
      - name: Commit v121 and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/patch_v121.py .github/workflows/apply-v121.yml
          git diff --cached --check
          git commit -m "feat: add three Conan incident variants v121"
          git push
