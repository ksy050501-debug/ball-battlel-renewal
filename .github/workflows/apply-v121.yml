name: Apply v121 Conan incident variants

on:
  push:
    paths:
      - '.github/workflows/apply-v121.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace('<title>볼배틀 리뉴얼 v120</title>', '<title>볼배틀 리뉴얼 v121</title>', 1)
          text = text.replace('<h1 id="mainTitle">볼배틀 리뉴얼 v120</h1>', '<h1 id="mainTitle">볼배틀 리뉴얼 v121</h1>', 1)

          old_card = '''      { id: "conan", name: "코난", mark: "🔍", role: "애니", color: "#2563eb", hp: 165, attack: 0, speed: 2.8, range: 130,
        skillName: "사신 · 범인의 습격", condition: "반경130 안 초당 사신+5 · 직접 접촉+10 · 사신100 → 사건 발생", desc: "코난 근처에 오래 머문 적에게 사신이 누적된다. 사신이 가득 차면 정체불명의 범인이 나타나 큰 피해를 주는 습격을 벌인다." },'''
          new_card = '''      { id: "conan", name: "코난", mark: "🔍", role: "애니", color: "#2563eb", hp: 165, attack: 0, speed: 2.8, range: 130,
        skillName: "사신 · 사건 발생", condition: "반경130 안 초당 사신+5 · 직접 접촉+10 · 사신100 → 3종 사건 중 하나", desc: "코난 근처에 오래 머문 적에게 사신이 누적된다. 사신이 가득 차면 흉기 습격·차량 돌진·둔기 습격 중 하나의 사건에 휘말린다." },'''
          if old_card not in text:
              raise SystemExit('Conan card block not found')
          text = text.replace(old_card, new_card, 1)

          conan_block = r'''    const CONAN = {
      radius:130, maxMeter:100, auraPerSec:5, contactGain:10, contactCd:1.0,
      assaultWindup:.9, assaultDamage:100, resetMeter:0,
      knifeDirect:70, knifeBleedPower:5, knifeBleedTicks:6, knifeBleedDuration:3.4, knifeSlow:.75, knifeSlowDuration:3.4,
      carKnock:900, carKnockDuration:.34, bluntStun:.55, bluntKnock:240
    };
    const CONAN_ASSAULT_TYPES=["knife","car","blunt"];
    const CONAN_ASSAULT_LABELS={knife:"흉기 습격",car:"차량 돌진",blunt:"둔기 습격"};
    function initConan(f){
      f.conan={targets:new Map(),assaults:[],pulse:0};
    }
    function conanTargetState(source,target){
      const cc=source?.conan;if(!cc||!target)return null;
      let s=cc.targets.get(target.id);
      if(!s){s={meter:0,contactCd:0,pending:false};cc.targets.set(target.id,s);}
      return s;
    }
    function conanAssaultOrigin(target){
      const pad=22,side=Math.floor(Math.random()*4);
      if(side===0)return {x:arena.x+pad,y:clamp(target.y,arena.y+pad,arena.y2-pad)};
      if(side===1)return {x:arena.x2-pad,y:clamp(target.y,arena.y+pad,arena.y2-pad)};
      if(side===2)return {x:clamp(target.x,arena.x+pad,arena.x2-pad),y:arena.y+pad};
      return {x:clamp(target.x,arena.x+pad,arena.x2-pad),y:arena.y2-pad};
    }
    function triggerConanAssault(source,target,state){
      if(!source?.alive||!source.conan||!target?.alive||!state||state.pending)return false;
      state.meter=CONAN.maxMeter;state.pending=true;
      const o=conanAssaultOrigin(target),type=pick(CONAN_ASSAULT_TYPES);
      source.conan.assaults.push({targetId:target.id,type,t:CONAN.assaultWindup,total:CONAN.assaultWindup,x:o.x,y:o.y});
      if(!fastSimMode){
        spawnFloatingText(target.x,target.y-target.r-44,"사건 발생! · "+CONAN_ASSAULT_LABELS[type],type==="car"?"#fde68a":"#fca5a5");
        spawnBlast(target.x,target.y,58,type==="car"?"#f59e0b":"#7f1d1d");
        playSound("warning",1.0);
      }
      return true;
    }
    function conanContact(source,target){
      if(!source?.alive||!source.conan||!target?.alive||!areEnemies(source,target))return;
      const s=conanTargetState(source,target);
      if(!s||s.pending||s.contactCd>0)return;
      s.contactCd=CONAN.contactCd;
      s.meter=Math.min(CONAN.maxMeter,s.meter+CONAN.contactGain);
      if(!fastSimMode)spawnFloatingText(target.x,target.y-target.r-32,"사신 +"+CONAN.contactGain,"#f87171");
      if(s.meter>=CONAN.maxMeter)triggerConanAssault(source,target,s);
    }
    function conanKnifeSlowMultiplier(f){
      return (f?.conanKnifeSlow||0)>0&&!hasHarmfulImmunity(f)?CONAN.knifeSlow:1;
    }
    function resolveConanAssault(f,a,target){
      const dx=target.x-a.x,dy=target.y-a.y,d=Math.hypot(dx,dy)||1;
      let dealt=0,label="",color="#fecaca";
      if(a.type==="knife"){
        dealt=damage(target,CONAN.knifeDirect,f,"흉기 습격");
        label="흉기 습격! -"+Math.round(dealt)+" + 출혈30";color="#fca5a5";
        if(target.alive&&dealt>0&&!hasHarmfulImmunity(target)){
          applyBleed(target,f,CONAN.knifeBleedPower,CONAN.knifeBleedDuration,.55,CONAN.knifeBleedTicks);
          target.conanKnifeSlow=Math.max(target.conanKnifeSlow||0,CONAN.knifeSlowDuration);
        }
        if(target.alive&&dealt>0){target.vx=dx/d*180;target.vy=dy/d*180;}
      }else if(a.type==="car"){
        dealt=damage(target,CONAN.assaultDamage,f,"차량 돌진");
        label="차량 돌진! -"+Math.round(dealt);color="#fde68a";
        if(target.alive&&dealt>0){
          target.vx=dx/d*CONAN.carKnock;target.vy=dy/d*CONAN.carKnock;
          target.punchFlight=Math.max(target.punchFlight||0,CONAN.carKnockDuration);
          target.punchSource=null;target.punchWallPower=0;target.punchWallHits=0;
        }
      }else{
        dealt=damage(target,CONAN.assaultDamage,f,"둔기 습격");
        label="둔기 습격! -"+Math.round(dealt)+" · 기절";color="#ddd6fe";
        if(target.alive&&dealt>0){
          if(!hasHarmfulImmunity(target))target.tanoStop=Math.max(target.tanoStop||0,CONAN.bluntStun);
          target.vx=dx/d*CONAN.bluntKnock;target.vy=dy/d*CONAN.bluntKnock;
        }
      }
      if(!fastSimMode){
        const hitColor=a.type==="car"?"#f59e0b":a.type==="blunt"?"#6d28d9":"#7f1d1d";
        spawnHitFlash(target.x,target.y,hitColor,a.type==="car"?150:130);spawnBlast(target.x,target.y,a.type==="car"?120:105,hitColor);
        spawnParticles(target.x,target.y,a.type==="car"?"#fef3c7":a.type==="blunt"?"#c4b5fd":"#7f1d1d",30);
        spawnFloatingText(target.x,target.y-target.r-45,label,color);
        triggerHitStop(a.type==="car"?.28:.24);screenShake=Math.max(screenShake,a.type==="car"?1.0:.85);playSound("explosion",a.type==="car"?1.6:1.45);
      }
      return dealt;
    }
    function updateConan(f,dt){
      const cc=f?.conan;if(!cc||!f.alive)return;
      cc.pulse=(cc.pulse+dt)%1;
      for(const s of cc.targets.values())s.contactCd=Math.max(0,(s.contactCd||0)-dt);
      for(const target of fighters){
        if(!target?.alive||target.id===f.id||!areEnemies(f,target))continue;
        const s=conanTargetState(f,target);
        if(!s||s.pending)continue;
        if(Math.hypot(target.x-f.x,target.y-f.y)<=CONAN.radius+target.r){
          s.meter=Math.min(CONAN.maxMeter,s.meter+CONAN.auraPerSec*dt);
          if(s.meter>=CONAN.maxMeter)triggerConanAssault(f,target,s);
        }
      }
      for(let i=cc.assaults.length-1;i>=0;i--){
        const a=cc.assaults[i],target=fighters.find(x=>x.id===a.targetId),s=target?cc.targets.get(target.id):null;
        if(!target?.alive){if(s){s.pending=false;s.meter=CONAN.resetMeter;}cc.assaults.splice(i,1);continue;}
        a.t-=dt;
        if(a.t>0)continue;
        resolveConanAssault(f,a,target);
        if(s){s.pending=false;s.meter=CONAN.resetMeter;}
        cc.assaults.splice(i,1);
      }
    }
    function conanMeterForTarget(target){
      let best=0;
      for(const source of fighters){
        if(!source?.alive||!source.conan||source.id===target.id||!areEnemies(source,target))continue;
        const s=source.conan.targets.get(target.id);if(s)best=Math.max(best,s.meter||0);
      }
      return best;
    }
    function drawConanAssault(a,target){
      const p=clamp(1-a.t/a.total,0,1),ease=p*p*(3-2*p);
      const px=a.x+(target.x-a.x)*ease,py=a.y+(target.y-a.y)*ease;
      const ang=Math.atan2(target.y-py,target.x-px);
      ctx.save();ctx.globalAlpha=.38+.6*p;ctx.translate(px,py);ctx.rotate(ang);
      if(a.type==="car"){
        ctx.shadowColor="#f59e0b";ctx.shadowBlur=12;ctx.fillStyle="#111827";ctx.strokeStyle="#6b7280";ctx.lineWidth=2;
        ctx.beginPath();ctx.roundRect(-25,-12,50,24,6);ctx.fill();ctx.stroke();
        ctx.fillStyle="#374151";ctx.fillRect(-8,-10,18,20);ctx.fillStyle="#fef3c7";ctx.beginPath();ctx.arc(22,-7,3,0,Math.PI*2);ctx.arc(22,7,3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle="#020617";for(const x of [-15,15])for(const y of [-14,14]){ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();}
        ctx.strokeStyle="rgba(254,243,199,.45)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-48,-8);ctx.lineTo(-30,-8);ctx.moveTo(-48,8);ctx.lineTo(-30,8);ctx.stroke();
      }else{
        ctx.fillStyle="#020617";ctx.strokeStyle=a.type==="blunt"?"#6d28d9":"#7f1d1d";ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(0,-8,8,0,Math.PI*2);ctx.fill();ctx.stroke();
        ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.lineTo(9,17);ctx.lineTo(-9,17);ctx.closePath();ctx.fill();
        if(a.type==="knife"){
          ctx.strokeStyle="#e5e7eb";ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(6,4);ctx.lineTo(20,-1);ctx.stroke();
          ctx.fillStyle="#ef4444";ctx.beginPath();ctx.moveTo(20,-1);ctx.lineTo(26,-3);ctx.lineTo(22,2);ctx.closePath();ctx.fill();
        }else{
          ctx.strokeStyle="#a78bfa";ctx.lineWidth=5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(5,5);ctx.lineTo(22,-5);ctx.stroke();
          ctx.fillStyle="#4c1d95";ctx.fillRect(18,-10,11,8);
        }
      }
      ctx.restore();
    }
    function drawConanCharacter(f){
      const cc=f.conan||{targets:new Map(),assaults:[],pulse:0};
      if(!f.portraitOnly&&!fastSimMode){
        ctx.save();ctx.beginPath();ctx.rect(arena.x,arena.y,arena.size,arena.size);ctx.clip();
        ctx.globalAlpha=.13+.04*Math.sin(battleTime*2.5);ctx.strokeStyle="#94a3b8";ctx.lineWidth=1.5;ctx.setLineDash([6,8]);
        ctx.beginPath();ctx.arc(f.x,f.y,CONAN.radius,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();
        for(const a of cc.assaults){const target=fighters.find(x=>x.id===a.targetId);if(target?.alive)drawConanAssault(a,target);}
      }
      ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.r/20,f.r/20);
      ctx.fillStyle="#1f2937";ctx.beginPath();ctx.arc(0,-5,18,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#f3c7a5";ctx.beginPath();ctx.ellipse(0,-2,13,15,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#111827";ctx.beginPath();ctx.moveTo(-14,-9);ctx.lineTo(-9,-19);ctx.lineTo(-3,-14);ctx.lineTo(2,-21);ctx.lineTo(7,-14);ctx.lineTo(14,-17);ctx.lineTo(12,-6);ctx.quadraticCurveTo(0,-14,-14,-9);ctx.fill();
      ctx.strokeStyle="#111827";ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(-6,-2,5,0,Math.PI*2);ctx.arc(6,-2,5,0,Math.PI*2);ctx.moveTo(-1,-2);ctx.lineTo(1,-2);ctx.stroke();
      ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(-6,-2,1.4,0,Math.PI*2);ctx.arc(6,-2,1.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#2563eb";ctx.beginPath();ctx.moveTo(-15,11);ctx.lineTo(-9,5);ctx.lineTo(9,5);ctx.lineTo(15,11);ctx.lineTo(12,22);ctx.lineTo(-12,22);ctx.closePath();ctx.fill();
      ctx.fillStyle="#f8fafc";ctx.beginPath();ctx.moveTo(-7,6);ctx.lineTo(0,15);ctx.lineTo(7,6);ctx.closePath();ctx.fill();
      ctx.fillStyle="#dc2626";ctx.beginPath();ctx.moveTo(-5,10);ctx.lineTo(0,7);ctx.lineTo(5,10);ctx.lineTo(0,14);ctx.closePath();ctx.fill();
      ctx.restore();drawHealthBar(f);drawName(f);
    }
'''

          pattern = re.compile(r'    const CONAN = \{.*?\n    const ELSA = \{', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('CONAN block not found')
          text = text[:match.start()] + conan_block + '\n    const ELSA = {' + text[match.end():]

          old_damage = 'if (c.id === "conan") return {damage:"범인의 습격100 + 강한 넉백",tick:"반경130 안 초당 사신+5 · 직접 접촉 대상별1초마다+10 · 사신100에서 사건 발생 · 습격 예고0.9초 · 사건 후 사신0",tip:"코난은 직접 공격하지 않는다. 적이 반경130 안에 머무는 동안 사신 수치가 초당5씩 누적되며 범위를 벗어나도 감소하지 않는다. 직접 부딪히면 별도로 사신10이 오른다. 사신100이 되면 정체불명의 검은 범인이 경기장 가장자리에서 나타나 대상을 습격해 피해100과 강한 넉백을 준다. 사건이 끝나면 해당 대상의 사신은0으로 완전히 초기화되어 다시 처음부터 누적된다."};'
          new_damage = 'if (c.id === "conan") return {damage:"사건 3종 모두 명목 총 피해100 · 흉기70+출혈5×6 / 차량100 / 둔기100",tick:"반경130 안 초당 사신+5 · 직접 접촉 대상별1초마다+10 · 사신100에서 사건 발생 · 예고0.9초 · 사건 후 사신0",tip:"사신100이 되면 세 사건 중 하나가 동일 확률로 발생한다. 흉기 습격은 즉시70+출혈5×6회(총100)와 3.4초간 이속25% 감소, 차량 돌진은 피해100과 매우 강한 넉백, 둔기 습격은 피해100과 0.55초 기절을 준다. 세 사건 모두 0.9초 예고 후 대상에게 확정 적중하며, 사건 종료 후 사신은0으로 초기화된다."};'
          if old_damage not in text:
              raise SystemExit('Conan damage detail not found')
          text = text.replace(old_damage, new_damage, 1)

          old_progress = "extraTextHtml:'<div class=\"status-skill-label\">반경130 안 초당 사신+5 · 범위 밖에서도 누적 유지</div><div class=\"status-skill-label\">직접 접촉 +10(대상별1초) · 100에서 0.9초 예고 후 범인의 습격100 · 사건 후0</div>'};}"
          new_progress = "extraTextHtml:'<div class=\"status-skill-label\">반경130 안 초당 사신+5 · 범위 밖에서도 누적 유지</div><div class=\"status-skill-label\">직접 접촉 +10(대상별1초) · 100에서 0.9초 예고 후 3종 사건 랜덤 · 명목 총 피해100 · 사건 후0</div>'};}"
          if old_progress not in text:
              raise SystemExit('Conan status detail not found')
          text = text.replace(old_progress, new_progress, 1)

          # 일반 이동과 이동속도 표시 계산에 흉기 둔화를 반영한다.
          marker = '      const elsaIce = elsaAuraSlowMultiplier(f);'
          count = text.count(marker)
          if count < 2:
              raise SystemExit(f'Expected at least 2 movement markers, found {count}')
          text = text.replace(marker, marker + '\n      const conanSlow = conanKnifeSlowMultiplier(f);')
          text = text.replace('* elsaIce;', '* elsaIce * conanSlow;')

          old_hinta = 'const slow=(f.freeze>0?.42:1)*oshiSongSlowMultiplier(f)*(f.hintaConcussion>0?HINTA.slowMultiplier:1);'
          if old_hinta not in text:
              raise SystemExit('Hinta dash slow expression not found')
          text = text.replace(old_hinta, 'const slow=(f.freeze>0?.42:1)*oshiSongSlowMultiplier(f)*(f.hintaConcussion>0?HINTA.slowMultiplier:1)*conanKnifeSlowMultiplier(f);', 1)

          old_tick = '      if(!(f.punchFlight>0))f.hintaConcussion=Math.max(0,(f.hintaConcussion||0)-dt);'
          if old_tick not in text:
              raise SystemExit('Fighter debuff tick marker not found')
          new_tick = old_tick + '\n      f.conanKnifeSlow=Math.max(0,(f.conanKnifeSlow||0)-dt);\n      if(f.conanKnifeSlow>0&&!fastSimMode&&Math.random()<dt*5)spawnParticles(f.x+rand(-f.r*.5,f.r*.5),f.y+rand(-f.r*.5,f.r*.5),"#7f1d1d",1);'
          text = text.replace(old_tick, new_tick, 1)

          patch_marker = '      const patchNotes = [\n'
          if patch_marker not in text:
              raise SystemExit('Patch notes marker not found')
          patch_note = '      \\"v121: 코난 사건 연출을 3종으로 확장했습니다. 사신100 도달 시 0.9초 예고 뒤 흉기 습격·차량 돌진·둔기 습격 중 하나가 동일 확률로 필중합니다. 흉기는 즉시70+출혈5×6(총100)과 3.4초 이속25% 감소, 차량은 피해100+매우 강한 넉백, 둔기는 피해100+0.55초 기절. 반경130·초당 사신+5·접촉+10·사건 후 사신0 등 v120의 누적 구조는 유지합니다.\\",\n'
          text = text.replace(patch_marker, patch_marker + patch_note, 1)

          if text == original:
              raise SystemExit('No changes made')
          if 'v120</title>' in text or 'mainTitle">볼배틀 리뉴얼 v120' in text:
              raise SystemExit('Version bump incomplete')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const m = html.match(/<script>([\s\S]*)<\/script>/);
          if (!m) throw new Error('script block not found');
          new Function(m[1]);
          console.log('JavaScript syntax OK');
          NODE
      - name: Commit v121
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "feat: add three Conan incident variants v121"
          git push
