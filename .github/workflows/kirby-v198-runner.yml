name: Run Kirby v198 patch

on:
  push:
    paths:
      - '.github/workflows/kirby-v198-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Extract and apply prepared patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('.github/workflows/kirby-v198.yml').read_text(encoding='utf-8')
          m=re.search(r"cat > /tmp/patch_kirby_v198.py <<'PY'\n(.*?)\n          PY",src,re.S)
          if not m:
              raise SystemExit('embedded patch script not found')
          lines=m.group(1).splitlines()
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          body=body.replace("once(old_char,new_char,'kirby character')","pass # prose patched after gameplay")
          body=body.replace("once(old_info,new_info,'kirby info')","pass # info patched after gameplay")
          Path('/tmp/patch_kirby_v198.py').write_text(body,encoding='utf-8')
          PY
          python3 /tmp/patch_kirby_v198.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          char_new='''      { id:"kirby", name:"커비", mark:"★", role:"게임", color:"#f472b6", hp:150, attack:0, speed:2.55, range:0,
        skillName:"흡입 · 카피 능력", condition:"기본 상태 10초 주기 120° 장시간 흡입 · 중립 몬스터 최대2마리 · 카피 상태 누적피해45 → 별 이탈", desc:"기본 상태에서는 진행방향 전방120도를 3.2초 동안 천천히 흡입한다. 맵에는 커비와 상대 모두를 공격하는 중립 몬스터가 최대2마리까지 등장하며, 현재 존재하는 몬스터와 커비가 보유한 카피를 제외한 종류에서 새 몬스터가 생성된다. 소드는 회전베기, 빔은 별 채찍 광역기, 파이어는 부채꼴 화염방사, 밤은 한 번 튀는 포물선 폭탄을 사용한다. 커비가 카피하면 각 기술이 강화된다. 상대 본체를 삼키면 잠시 몸속에 가둔 뒤 뱉어 강하게 날리고 벽충돌 피해를 줄 수 있다. 카피 상태에서 누적 피해45를 받으면 능력이 별로 튕겨 나가며, 5초 안에 다시 닿으면 되찾는다." },'''
          pat=r'      \{ id:"kirby", name:"커비", mark:"★", role:"게임", color:"#f472b6", hp:150, attack:0, speed:2\.55, range:0,\n        skillName:"흡입 · 카피 능력", condition:"[^"]*", desc:"[^"]*" \},'
          s,n=re.subn(pat,char_new,s,count=1)
          if n!=1: raise SystemExit(f'kirby prose replacement failed: {n}')
          info_new='''      if(c.id==="kirby")return {damage:"소드 회전베기10+출혈1×4 / 빔 채찍7+둔화 / 파이어5+화상1×3 / 밤 폭탄12×2(반경58) / 뱉기 벽충돌12",tick:"기본 흡입10초 주기·3.2초 지속·전방120°·느린 흡입 / 중립 몬스터6.5초마다·최대2 / 카피 누적피해45에서 별 이탈·별5초",tip:"중립 몬스터는 이미 필드에 있는 종류와 커비가 현재 보유한 카피를 제외하고 생성된다. 소드는 미니 회전베기, 빔은 별 채찍 광역기, 파이어는 좁은 부채꼴 화염방사, 밤은 포물선으로 날아 한 번 튄 뒤 폭발한다. 카피 커비는 각 기술의 범위·부가효과 또는 투사 수가 강화된다."};'''
          s,n=re.subn(r'      if\(c\.id==="kirby"\)return \{damage:"[^"]*",tick:"[^"]*",tip:"[^"]*"\};',info_new,s,count=1)
          if n!=1: raise SystemExit(f'kirby info replacement failed: {n}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v198</title>' in s
          assert 'inhalePeriod:10, inhaleDuration:3.2' in s
          assert 'inhalePull:28' in s
          assert 'kirbyBombs' in s
          assert '커비 빔 채찍' in s
          assert '중립 소드 회전베기' in s
          assert 'neutral.kirbyNeutral.recoil' in s
          assert 'held=fighters.filter' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit result and cleanup helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/kirby-v198.yml .github/workflows/kirby-v198-runner.yml .github/workflows/kirby-v198-exec.yml
          git add index.html
          git commit -m 'v198: refine Kirby copy moves and neutral collisions'
          git push
