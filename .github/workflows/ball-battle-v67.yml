name: Ball Battle v67 Riddle tuning

on:
  push:
    paths:
      - ".github/ball-battle-v67.py"
      - ".github/workflows/ball-battle-v67.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v67 Riddle tuning
        run: python .github/ball-battle-v67.py

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text, re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/ball-battle-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/ball-battle-inline.js

      - name: Commit v67
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "v67: alternate Riddle spells and nerf Fiendfyre"
            git push
          fi
