          once('''      "v197: 신규 게임 진영 캐릭터 커비 추가. 기본 상태 6초 주기 전방120° 흡입, 중립 몬스터 최대2마리, 소드·빔·파이어·밤 카피, 상대 삼키기 후 1.4초 뒤 뱉기·넉백·벽충돌, 카피 상태 누적피해45에서 별 이탈 및 5초 내 재획득 구조를 추가.",''','''      "v198: 커비 1차 피드백 반영. 흡입을 10초 주기·3.2초 지속의 느린 장시간 흡입으로 변경. 중립 몬스터는 필드의 기존 종류와 커비 보유 카피를 제외해 생성. 소드는 회전베기(카피는 뉴헬로급 범위+출혈+짧은 찌르기), 빔은 별 채찍 광역기(카피는 범위 증가+둔화), 파이어는 부채꼴 화염방사(카피는 범위 증가+화상), 밤은 포물선 1회 바운드 폭탄(카피는 2개 투척)으로 재구성. 중립 몬스터가 캐릭터를 구석에 압착하지 않고 접촉 시 스스로 튕겨나가도록 충돌 버그 수정.",\n      "v197: 신규 게임 진영 캐릭터 커비 추가. 기본 상태 6초 주기 전방120° 흡입, 중립 몬스터 최대2마리, 소드·빔·파이어·밤 카피, 상대 삼키기 후 1.4초 뒤 뱉기·넉백·벽충돌, 카피 상태 누적피해45에서 별 이탈 및 5초 내 재획득 구조를 추가.",''','patch note')

