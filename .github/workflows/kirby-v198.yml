      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<title>볼배틀 리뉴얼 v198</title>' in s
          assert 'inhalePeriod:10, inhaleDuration:3.2' in s
          assert 'kirbyBombs' in s
