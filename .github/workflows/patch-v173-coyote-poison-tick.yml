name: One-shot v173 Coyote poison tick

"on":
  push:
    paths:
      - '.github/workflows/patch-v173-coyote-poison-tick.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def one(old,new,label):
              global s
              if old not in s:
                  raise SystemExit('missing '+label)
              s=s.replace(old,new,1)
          one('<title>볼배틀 리뉴얼 v172</title>','<title>볼배틀 리뉴얼 v173</title>','title')
          one('<h1 id="mainTitle">볼배틀 리뉴얼 v172</h1>','<h1 id="mainTitle">볼배틀 리뉴얼 v173</h1>','heading')
          one('      trailLife:3, trailEvery:.18, trailRadius:24, trailDamage:1, trailTick:.5,\n      contactDamage:8, contactCooldown:1, flingDuration:.42, flingGap:10,\n      liandryAt:30, liandryTicks:3,','      trailLife:3, trailEvery:.18, trailRadius:24, trailDamage:2, trailTick:1,\n      contactDamage:8, contactCooldown:1, flingDuration:.42, flingGap:10,\n      liandryAt:30, liandryDamage:1, liandryTicks:3, liandryTick:.5,','coyote constants')
          one('target.coyotePoison={sourceId:owner.id,ticksLeft:COYOTE.liandryTicks,next:COYOTE.trailTick};','target.coyotePoison={sourceId:owner.id,ticksLeft:COYOTE.liandryTicks,next:COYOTE.liandryTick};','liandry initial tick')
          one('const dealt=damage(target,COYOTE.trailDamage,source,"리안드리 잔류독");','const dealt=damage(target,COYOTE.liandryDamage,source,"리안드리 잔류독");','liandry damage')
          one('poison.ticksLeft-=1;poison.next+=COYOTE.trailTick;','poison.ticksLeft-=1;poison.next+=COYOTE.liandryTick;','liandry interval')
          one('· 독구름 피해1 / 0.5초</div>','· 독구름 피해2 / 1초 · 리안드리 잔류독1 ×3 / 0.5초</div>','status text')
          note='      "v173: 코요테드 독방구 틱 구조 조정. 기본 독은 피해1/0.5초에서 피해2/1초로 바꿔 지속 노출 DPS는 초당2로 유지한다. 리안드리 잔류독은 기본 독과 분리해 기존처럼 피해1을 0.5초 간격으로 3틱(총3피해, 1.5초) 유지한다. 균열생성기·라일라이·접촉8·HP170·넘기기 등 나머지는 유지.",\n'
          one('      const patchNotes = [\n','      const patchNotes = [\n'+note,'patch note')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          open('/tmp/check.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/check.js
          git diff --check
          grep -q '볼배틀 리뉴얼 v173' index.html
          grep -q 'trailDamage:2, trailTick:1' index.html
          grep -q 'liandryDamage:1, liandryTicks:3, liandryTick:.5' index.html
          grep -q 'COYOTE.liandryDamage' index.html
          grep -q 'poison.next+=COYOTE.liandryTick' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-v173-coyote-poison-tick.yml
          git commit -m "Retune CoyoteD poison tick packets v173"
          git push
