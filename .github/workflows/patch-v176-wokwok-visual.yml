name: One-shot v176 WokWok visual fix
on:
  push:
    paths:
      - '.github/workflows/patch-v176-wokwok-visual.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n < count:
                  raise SystemExit(f'anchor missing: {old[:160]!r} count={n}')
              s=s.replace(old,new,count)

          rep('<title>볼배틀 리뉴얼 v175</title>','<title>볼배틀 리뉴얼 v176</title>')

          old='''    function drawWokWokCharacter(f){
      const w=f.wok||{};ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.r/20,f.r/20);'''
          new='''    function drawWokWokCharacter(f){
      const w=f.wok||{};
      if(!f.portraitOnly){
        const mag=Math.hypot(f.vx||0,f.vy||0)||1;
        const a=Math.atan2((f.vy||0)/mag,(f.vx||1)/mag);
        const active=(w.bloodMult||1)>1.001;
        ctx.save();ctx.translate(f.x,f.y);
        ctx.globalAlpha=active?.13:.035;
        ctx.fillStyle=active?"#ef4444":"#94a3b8";
        ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,WOK.scentRange,a-WOK.scentHalfAngle,a+WOK.scentHalfAngle);ctx.closePath();ctx.fill();
        ctx.globalAlpha=active?.52:.14;ctx.strokeStyle=active?"#f87171":"#94a3b8";ctx.lineWidth=active?2.2:1.2;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-WOK.scentHalfAngle)*WOK.scentRange,Math.sin(a-WOK.scentHalfAngle)*WOK.scentRange);ctx.arc(0,0,WOK.scentRange,a-WOK.scentHalfAngle,a+WOK.scentHalfAngle);ctx.lineTo(0,0);ctx.stroke();ctx.restore();
      }
      ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.r/20,f.r/20);'''
          rep(old,new)

          old='''      ctx.restore();
    }

    const COYOTE = {'''
          new='''      ctx.restore();
      if(!f.portraitOnly){drawHealthBar(f);drawName(f);}
    }

    const COYOTE = {'''
          rep(old,new)

          old='''      const wokBloodSpeed = wokBloodSpeedMultiplier(f);
      const boost = f.baseId === "wind_rio" ? rioMoveBoost(f) : (f.speedBoost > 0 ? 1.45 : 1);'''
          new='''      const wokBloodSpeed = wokBloodSpeedMultiplier(f);
      if(f.wok)f.wok.effectiveSpeed=(f.wok.baseSpeed||f.baseSpeed||f.speed)*wokBloodSpeed;
      const boost = f.baseId === "wind_rio" ? rioMoveBoost(f) : (f.speedBoost > 0 ? 1.45 : 1);'''
          rep(old,new)

          old='''<div class="status-skill-label">피 냄새 ×${blood} · 전방120°/420 · 감지 최저 HP ${prey}% · 돌진 ${dashLeft.toFixed(1)}초</div>'''
          new='''<div class="status-skill-label">피 냄새 ×${blood} · 실효 이속 ${(w.effectiveSpeed||w.baseSpeed||f.baseSpeed).toFixed(2)} · 전방120°/420 · 감지 최저 HP ${prey}% · 돌진 ${dashLeft.toFixed(1)}초</div>'''
          rep(old,new)

          old='''      const patchNotes = [
      "v175:'''
          new='''      const patchNotes = [
      "v176: 웍웍 표시/피 냄새 가속 확인 개선. 인게임 웍웍 전용 렌더러에 체력바와 이름 표시가 누락된 문제를 수정했다. 진행방향 전방120°·거리420 피 냄새 감지 부채꼴을 표시하고, 감지 대상의 HP에 따라 가속이 활성화되면 붉게 강조한다. 상태창에도 현재 피 냄새 배율과 실효 이동속도를 함께 표시한다. 전투 수치와 판정은 v175 그대로 유지.",
      "v175:'''
          rep(old,new)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script not found')
          Path('/tmp/ballbattle.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/ballbattle.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix WokWok HUD and blood-scent visualization v176'
          git push
